<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pandas Lab (단일 파일)</title>
  <style>
/* ===== theme.css ===== */
/* theme.css — 디자인 시스템
 *
 * 색은 dataviz 스킬의 validate_palette.js 를 실제로 돌려서 확정했다. 임의로 바꾸지 마라.
 * 바꿔야 하면 검증기를 다시 돌리고 ../../CLAUDE.md §7-1 을 함께 고친다.
 *
 *   원본 = 파랑 · 사본 = 주황 · 결과 = 초록
 *   강조 = 색이 아니다 (링 + 굵은 라벨). 노랑을 쓰면 주황과 구분되지 않아 FAIL 이 난다.
 *   에러/경고 = 상태색 빨강 + 아이콘·라벨. 계열색으로 재사용 금지.
 *   결측(NaN) = 회색 + 45° 해칭
 *
 * 다크 값은 두 곳에 선언한다. 미디어 쿼리는 OS 설정, data-theme 은 사용자 토글이며
 * 토글이 양방향으로 이겨야 한다(:not() 가드가 라이트 도장을 OS-다크보다 우선시킨다).
 */

:root {
  color-scheme: light;

  /* ── 표면·잉크 (검증기의 surface 인자와 같은 값이어야 한다) */
  --surface-1: #fcfcfb;          /* 차트 표면 */
  --surface-page: #f9f9f7;       /* 페이지 평면 */
  --surface-raised: #ffffff;     /* 카드 */
  --surface-sunken: #f2f1ed;     /* 코드·입력 */
  --ink-1: #0b0b0b;              /* 본문 */
  --ink-2: #52514e;              /* 보조 */
  --ink-muted: #898781;          /* 축·라벨 */
  --grid: #e1e0d9;              /* 격자선 (헤어라인) */
  --axis: #c3c2b7;              /* 기준선·축 */
  --border: rgba(11, 11, 11, 0.10);

  /* ── 역할색 (전 장 고정) */
  --c-original: #2a78d6;
  --c-copy: #eb6834;
  --c-result: #1baf7a;
  --c-danger: #d03b3b;           /* 상태색. 아이콘+라벨과 함께만 */
  --c-warning: #fab219;
  --c-good: #0ca30c;
  --c-na: #898781;

  /* 강조는 색이 아니라 링이다 */
  --c-focus-ring: var(--ink-1);
  --focus-ring-width: 2px;

  /* 라이트 모드에서 결과색은 표면 대비 2.74:1 이다 (3:1 미만).
   * relief 규칙: 이 색을 칸 채우기로 쓰면 숫자 라벨이나 표 보기를 반드시 함께 낸다. */
  --relief-required: 1;

  /* ── 순차 램프 (크기·magnitude 전용. 단일 색조. 무지개 금지) */
  --seq-100: #cde2fb;
  --seq-200: #9ec5f4;
  --seq-300: #6da7ec;
  --seq-400: #3987e5;
  --seq-500: #256abf;
  --seq-600: #184f95;
  --seq-700: #0d366b;
  /* 순서형(ordinal) 램프는 라이트에서 250 보다 밝게 시작하지 않는다 */
  --seq-ordinal-min: #86b6ef;

  /* ── 타이포 (모두 시스템 산세리프. 디스플레이·세리프 없음) */
  --font-sans: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-base: 0.9375rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.5rem;
  --fs-hero: 2.5rem;
  --lh-tight: 1.25;
  --lh-base: 1.7;

  /* ── 간격·형태 */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;
  --radius-sm: 4px;              /* 데이터 끝단 라운딩과 같은 값 */
  --radius: 8px;
  --radius-lg: 12px;
  --mark-gap: 2px;               /* 채움 사이 표면 간격 */
  --stroke-line: 2px;            /* 선 굵기 */
  --marker-min: 8px;             /* 마커 최소 크기 */

  --shadow-1: 0 1px 2px rgba(11, 11, 11, 0.06);
  --shadow-2: 0 4px 12px rgba(11, 11, 11, 0.08);
  --dur: 180ms;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --surface-page: #0d0d0d;
    --surface-raised: #212120;
    --surface-sunken: #141413;
    --ink-1: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);

    --c-original: #3987e5;
    --c-copy: #d95926;
    --c-result: #199e70;
    --c-danger: #d03b3b;
    --c-warning: #fab219;
    --c-good: #0ca30c;
    --c-na: #898781;
    --c-focus-ring: var(--ink-1);

    /* 다크에서는 3색 모두 3:1 이상이라 relief 가 필요 없다 */
    --relief-required: 0;

    --seq-ordinal-min: #184f95;   /* 다크에서는 600 보다 어둡게 가지 않는다 */
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.5);
    --shadow-2: 0 4px 12px rgba(0, 0, 0, 0.6);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19;
  --surface-page: #0d0d0d;
  --surface-raised: #212120;
  --surface-sunken: #141413;
  --ink-1: #ffffff;
  --ink-2: #c3c2b7;
  --ink-muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);

  --c-original: #3987e5;
  --c-copy: #d95926;
  --c-result: #199e70;
  --c-danger: #d03b3b;
  --c-warning: #fab219;
  --c-good: #0ca30c;
  --c-na: #898781;
  --c-focus-ring: var(--ink-1);
  --relief-required: 0;
  --seq-ordinal-min: #184f95;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.5);
  --shadow-2: 0 4px 12px rgba(0, 0, 0, 0.6);
}

/* ─────────────────────────────────────────────── 기본 */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  color: var(--ink-1);
  background: var(--surface-page);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { line-height: var(--lh-tight); margin: 0 0 var(--sp-3); font-weight: 650; }
h1 { font-size: var(--fs-xl); }
h2 { font-size: var(--fs-lg); }
h3 { font-size: var(--fs-base); }
p { margin: 0 0 var(--sp-4); }
a { color: var(--c-original); text-decoration-thickness: 1px; text-underline-offset: 2px; }

code, pre, .mono { font-family: var(--font-mono); font-size: var(--fs-sm); }
code {
  background: var(--surface-sunken);
  padding: 1px var(--sp-1);
  border-radius: var(--radius-sm);
}
pre {
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--sp-4);
  margin: 0 0 var(--sp-4);
  overflow-x: auto;               /* 넓은 코드는 자기 안에서 스크롤한다 */
  line-height: 1.55;
}
pre code { background: none; padding: 0; }

:focus-visible {
  outline: var(--focus-ring-width) solid var(--c-focus-ring);
  outline-offset: 2px;
}

/* ─────────────────────────────────────────────── 조각 */

.card {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-5);
  margin: 0 0 var(--sp-5);
}

.panel-title {
  font-size: var(--fs-sm);
  font-weight: 650;
  color: var(--ink-2);
  margin: 0 0 var(--sp-3);
}

/* 코드 블록 + 복사 버튼 — 학생이 IDLE 이나 주피터에 붙여 실행한다 */
.codeblock { margin: 0 0 var(--sp-4); }
.codeblock pre { margin-bottom: var(--sp-2); }
.code-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  flex-wrap: wrap;
  margin: 0 0 var(--sp-4);
}
.btn-copy {
  font-size: var(--fs-xs);
  padding: var(--sp-1) var(--sp-3);
}
.btn-copy.is-on {
  border-color: var(--c-result);
  box-shadow: inset 0 0 0 1px var(--c-result);
  font-weight: 650;
}
.code-hint { font-size: var(--fs-xs); color: var(--ink-muted); }

.note {
  border-left: 3px solid var(--axis);
  padding: var(--sp-2) 0 var(--sp-2) var(--sp-4);
  color: var(--ink-2);
  margin: 0 0 var(--sp-4);
}
/* 경고는 색만으로 말하지 않는다 — 아이콘과 라벨이 함께 온다 */
.note--danger { border-left-color: var(--c-danger); }
.note--danger .note-label { color: var(--c-danger); font-weight: 650; }

/* 강조는 색이 아니라 링이다 */
.is-focus {
  outline: var(--focus-ring-width) solid var(--c-focus-ring);
  outline-offset: 1px;
  font-weight: 700;
}

/* 역할 칩 — 색 옆에 항상 글자가 온다 (색 단독 금지) */
.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: var(--fs-xs);
  color: var(--ink-2);
}
.chip::before {
  content: '';
  width: 10px; height: 10px;
  border-radius: 3px;
  background: var(--chip-color, var(--ink-muted));
  box-shadow: 0 0 0 var(--mark-gap) var(--surface-1);
}
.chip--original { --chip-color: var(--c-original); }
.chip--copy { --chip-color: var(--c-copy); }
.chip--result { --chip-color: var(--c-result); }
.chip--na { --chip-color: var(--c-na); }

/* ─────────────────────────────────────────────── 표 */

.tbl-wrap { overflow-x: auto; }     /* 넓은 표는 자기 안에서 스크롤 */
table.tbl {
  border-collapse: collapse;
  font-size: var(--fs-sm);
  font-variant-numeric: tabular-nums;  /* 세로로 정렬돼야 하는 곳에만 */
  width: 100%;
}
table.tbl th, table.tbl td {
  padding: var(--sp-2) var(--sp-3);
  text-align: right;
  border-bottom: 1px solid var(--grid);
  white-space: nowrap;
}
table.tbl th {
  color: var(--ink-2);
  font-weight: 650;
  border-bottom-color: var(--axis);
}
table.tbl th:first-child, table.tbl td:first-child {
  text-align: left;
  color: var(--ink-muted);           /* 인덱스 열은 뒤로 물린다 */
}
table.tbl td.na { color: var(--c-na); font-style: italic; }
table.tbl tr.hl td { background: color-mix(in oklab, var(--c-original) 10%, transparent); }

/* 뷰/사본 상태를 표 테두리로 표시한다 (색 단독으로 말하지 않게 라벨과 함께 쓴다) */
.frame--original { box-shadow: inset 0 0 0 2px var(--c-original); border-radius: var(--radius); }
.frame--copy { box-shadow: inset 0 0 0 2px var(--c-copy); border-radius: var(--radius); }
.frame--result { box-shadow: inset 0 0 0 2px var(--c-result); border-radius: var(--radius); }

/* ─────────────────────────────────────────────── 입력 */

button, .btn {
  font: inherit;
  font-size: var(--fs-sm);
  color: var(--ink-1);
  background: var(--surface-raised);
  border: 1px solid var(--axis);
  border-radius: var(--radius-sm);
  padding: var(--sp-2) var(--sp-3);
  cursor: pointer;
  transition: background var(--dur), border-color var(--dur);
}
button:hover, .btn:hover { background: var(--surface-sunken); }
button[aria-pressed="true"], .btn.is-on {
  border-color: var(--c-original);
  box-shadow: inset 0 0 0 1px var(--c-original);
  font-weight: 650;
}
button:disabled { opacity: 0.5; cursor: not-allowed; }

input[type="range"] { width: 100%; accent-color: var(--c-original); }
input[type="text"], input[type="number"], select {
  font: inherit;
  font-size: var(--fs-sm);
  color: var(--ink-1);
  background: var(--surface-sunken);
  border: 1px solid var(--axis);
  border-radius: var(--radius-sm);
  padding: var(--sp-2);
}

.control-row {          /* 필터는 차트 위에 한 줄로 */
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-3);
  margin: 0 0 var(--sp-4);
}
.control-label { font-size: var(--fs-xs); color: var(--ink-2); }

/* ─────────────────────────────────────────────── 차트 */

.viz { display: block; max-width: 100%; overflow: visible; }
.viz-wrap { overflow-x: auto; }     /* 넓은 차트도 자기 안에서 스크롤 */
.viz text { font-family: var(--font-sans); fill: var(--ink-2); }
.viz .axis-label, .viz .tick-label {
  font-size: 11px;
  fill: var(--ink-muted);
  font-variant-numeric: tabular-nums;
}
.viz .grid-line { stroke: var(--grid); stroke-width: 1; }
.viz .axis-line { stroke: var(--axis); stroke-width: 1; }
/* 값 라벨은 계열색을 입지 않는다 — 잉크 토큰만 */
.viz .value-label { font-size: 11px; fill: var(--ink-1); font-weight: 600; }
/* 겹치는 마크에는 표면색 링 2px */
.viz .mark { stroke: var(--surface-1); stroke-width: var(--mark-gap); }
.viz .line { fill: none; stroke-width: var(--stroke-line); stroke-linejoin: round; stroke-linecap: round; }
.viz .crosshair { stroke: var(--ink-muted); stroke-width: 1; stroke-dasharray: 3 3; }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-4);
  margin: var(--sp-3) 0 0;
  font-size: var(--fs-xs);
  color: var(--ink-2);
}

.tooltip {
  position: absolute;
  pointer-events: none;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-2);
  padding: var(--sp-2) var(--sp-3);
  font-size: var(--fs-xs);
  font-variant-numeric: tabular-nums;
  z-index: 40;
  max-width: 280px;
}

/* 결측 해칭 — 색 외의 채널. SVG 는 <pattern id="na-hatch"> 를 함께 쓴다 */
.na-hatch {
  background-image: repeating-linear-gradient(45deg,
    var(--c-na) 0 1px, transparent 1px 5px);
  background-color: transparent;
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0ms !important; animation-duration: 0ms !important; }
}

/* 강제 색상 모드에서는 색이 사라지므로 텍스처·테두리가 의미를 진다 */
@media (forced-colors: active) {
  .chip::before { forced-color-adjust: none; border: 1px solid CanvasText; }
  .viz .mark { stroke: Canvas; }
}

/* ===== app.css ===== */
/* app.css — 레이아웃
 * 색·타이포는 theme.css 가 정한다. 여기는 배치만 다룬다.
 * 넓은 내용(표·차트·코드)은 자기 안에서 스크롤하고, 페이지 몸통은 절대 가로 스크롤하지 않는다.
 */

.lab-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  padding: var(--sp-3) var(--sp-5);
  background: var(--surface-raised);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 20;
}

.lab-brand { font-weight: 700; font-size: var(--fs-lg); }

.lab-shell {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);   /* minmax(0,1fr) 이 있어야 자식이 넘쳐도 몸통이 안 늘어난다 */
  gap: var(--sp-5);
  max-width: 1180px;
  margin: 0 auto;
  padding: var(--sp-5);
  align-items: start;
}

.lab-nav {
  position: sticky;
  top: 72px;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-4);
  max-height: calc(100vh - 96px);
  overflow-y: auto;
}

.lab-main { min-width: 0; }        /* 그리드 자식의 기본 min-width:auto 를 풀어 준다 */
.lab-main > h1 { margin-bottom: var(--sp-4); }

/* 모바일: 사이드바를 위로 접는다 */
@media (max-width: 860px) {
  .lab-shell {
    grid-template-columns: minmax(0, 1fr);
    padding: var(--sp-4);
  }
  .lab-nav { position: static; max-height: none; }
}

img, svg { max-width: 100%; }

  </style>
</head>
<body>
  <div id="lab-root"></div>
  <script>
/* ===== core/df.js ===== */
/* df.js — 미니 DataFrame 엔진
 *
 * pandas 를 흉내내는 것이 목적이 아니다. 글로 전달되지 않는 것을 실행으로 보여주는 것이 목적이다.
 * 그래서 진짜 pandas 의 내부 모델을 그대로 옮겼다.
 *
 *   Block   컬럼 데이터의 실제 저장소. id 와 refs(참조 수)를 갖는다.
 *   ColRef  DataFrame 이 블록을 가리키는 방법. { block, slice }
 *   Index   중복 라벨을 허용한다. 정렬(alignment) 의 주인공.
 *
 * 재현해야 하는 핵심 비대칭 (실제 pandas 3.0.5 확인):
 *   슬라이싱은 블록을 공유한다  -> shares_memory True
 *   불린 마스크는 복사한다      -> shares_memory False
 *   공유 중인 컬럼에 쓰면 그 순간 복사한다 (Copy-on-Write)
 *
 * 정렬·dtype 규칙은 CLAUDE.md 의 "검증된 …" 절에 근거가 있다. 추측으로 고치지 마라.
 * ES 모듈 문법 금지 — 단일 파일 배포본에 인라인되므로 깨진다.
 */
(function () {
  'use strict';

  // ──────────────────────────────────────────────────────────── 결측·기본 유틸

  var NA = null; // 엔진 내부의 결측 표현. NaN 과 null/undefined 를 모두 NA 로 본다.

  function isNA(v) {
    return v === null || v === undefined || (typeof v === 'number' && isNaN(v));
  }

  function isNum(v) {
    return typeof v === 'number' && !isNaN(v);
  }

  /* 라벨 비교. 합집합을 정렬할 때 쓴다.
   * 숫자는 숫자끼리 크기 비교, 문자열은 사전순, 섞이면 숫자를 앞에 둔다. */
  function cmpLabel(a, b) {
    var an = typeof a === 'number', bn = typeof b === 'number';
    if (an && bn) return a < b ? -1 : a > b ? 1 : 0;
    if (an) return -1;
    if (bn) return 1;
    var as = String(a), bs = String(b);
    return as < bs ? -1 : as > bs ? 1 : 0;
  }

  function arrEq(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  // ──────────────────────────────────────────────────────────── trace

  /* 단계 실행 시뮬레이터가 읽는 연산 기록.

  /* 검증된 규칙(CLAUDE.md 참조):
   *   [1,2,3]        -> 'int64'

  var _blockSeq = 0;

    var barH = Math.min(18, rowH - 6);
    var color = opts.color || 'var(--c-original)';

    var kids = [];
    niceTicks(Math.min(0, minV), maxV || 1, 4).forEach(function (t) {
      kids.push(svg('line.grid-line', { x1: x(t), x2: x(t), y1: padT, y2: H - padB }));
      kids.push(svg('text.tick-label', { x: x(t), y: H - padB + 14, 'text-anchor': 'middle', text: fmt(t) }));
    });
    kids.push(svg('line.axis-line', { x1: x(0), x2: x(0), y1: padT, y2: H - padB }));

    items.forEach(function (d, i) {
      var cy = padT + i * rowH + rowH / 2;
      var x0 = x(Math.min(0, d.value)), x1 = x(Math.max(0, d.value));
      var isNAv = isNA(d.value);
      var r = svg('rect.mark', {
        x: x0, y: cy - barH / 2, width: Math.max(1, x1 - x0), height: barH,
        rx: 4, ry: 4,                                   // 4px 라운딩, 기준선에 붙는다
        fill: isNAv ? 'var(--c-na)' : color,
        'fill-opacity': isNAv ? 0.35 : 1
      });
      r.addEventListener('mousemove', function (e) {
        tip().show('<b>' + esc(d.label) + '</b><br>' + esc(fmt(d.value)), e.clientX, e.clientY);
      });
      r.addEventListener('mouseleave', function () { tip().hide(); });
      kids.push(r);
      kids.push(svg('text.tick-label', {
        x: padL - 8, y: cy + 4, 'text-anchor': 'end', text: d.label
      }));
      // 값 라벨은 잉크 토큰. 계열색을 입지 않는다
      kids.push(svg('text.value-label', { x: x1 + 6, y: cy + 4, text: fmt(d.value) }));
    });

    var node = svg('svg.viz', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', height: H, role: 'img' }, kids);
    var tbl = table([{ key: 'label', label: opts.labelHeader || '항목' },
                     { key: 'value', label: opts.valueHeader || '값' }], items, {});
    return withTableTwin(node, tbl, { title: opts.title });
  }

  /* 히스토그램. values 를 bins 개로 나눈다. */
  function hist(values, opts) {
    opts = opts || {};
    var nums = values.filter(function (v) { return typeof v === 'number' && !isNaN(v); });
    if (!nums.length) return el('div.note', { text: '숫자 값이 없다' });
    var bins = opts.bins || 20;
    var lo = Math.min.apply(null, nums), hi = Math.max.apply(null, nums);
    var step = (hi - lo) / bins || 1;
    var counts = new Array(bins).fill(0);
    nums.forEach(function (v) {
      var k = Math.min(bins - 1, Math.floor((v - lo) / step));
      counts[k]++;
    });
    var items = counts.map(function (c, i) {
      return { label: fmt(lo + i * step, 2) + ' ~ ' + fmt(lo + (i + 1) * step, 2), value: c };
    });
    return bar(items, Object.assign({ padLeft: 120, labelHeader: '구간', valueHeader: '개수' }, opts));
  }

  /* 산점도. 계열이 3개를 넘지 않게 한다(팔레트 all-pairs 한계). */
  function scatter(series, opts) {
    opts = opts || {};
    if (series.length > 3) {
      throw new Error('산점도 계열은 3개까지다. 더 필요하면 "그 외" 로 묶거나 차트를 나눠라 (팔레트 all-pairs 한계).');
    }
    var W = opts.width || 560, H = opts.height || 340;
    var padL = 52, padR = 16, padT = 12, padB = 40;
    var all = series.reduce(function (a, s) { return a.concat(s.points); }, []);
    var xs = all.map(function (p) { return p[0]; }), ys = all.map(function (p) { return p[1]; });
    var x = scale([Math.min.apply(null, xs), Math.max.apply(null, xs)], [padL, W - padR]);
    var y = scale([Math.min.apply(null, ys), Math.max.apply(null, ys)], [H - padB, padT]);
    var COLORS = ['var(--c-original)', 'var(--c-copy)', 'var(--c-result)'];

    var kids = [];
    niceTicks(Math.min.apply(null, ys), Math.max.apply(null, ys), 4).forEach(function (t) {
      kids.push(svg('line.grid-line', { x1: padL, x2: W - padR, y1: y(t), y2: y(t) }));
      kids.push(svg('text.tick-label', { x: padL - 6, y: y(t) + 4, 'text-anchor': 'end', text: fmt(t, 2) }));
    });
    niceTicks(Math.min.apply(null, xs), Math.max.apply(null, xs), 5).forEach(function (t) {
      kids.push(svg('text.tick-label', { x: x(t), y: H - padB + 16, 'text-anchor': 'middle', text: fmt(t, 2) }));
    });
    kids.push(svg('line.axis-line', { x1: padL, x2: W - padR, y1: H - padB, y2: H - padB }));
    if (opts.xLabel) kids.push(svg('text.axis-label', { x: (padL + W - padR) / 2, y: H - 6, 'text-anchor': 'middle', text: opts.xLabel }));
    if (opts.yLabel) kids.push(svg('text.axis-label', { x: 12, y: padT + 4, text: opts.yLabel }));

    series.forEach(function (s, si) {
      s.points.forEach(function (p) {
        var c = svg('circle.mark', {
          cx: x(p[0]), cy: y(p[1]), r: Math.max(4, (opts.markerSize || 8) / 2),
          fill: COLORS[si], 'fill-opacity': 0.75
        });
        c.addEventListener('mousemove', function (e) {
          tip().show('<b>' + esc(s.name) + '</b><br>' + fmt(p[0], 3) + ', ' + fmt(p[1], 3), e.clientX, e.clientY);
        });
        c.addEventListener('mouseleave', function () { tip().hide(); });
        kids.push(c);
      });
    });

    var node = svg('svg.viz', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', height: H, role: 'img' }, kids);

    var rows = [];
    series.forEach(function (s) {
      s.points.forEach(function (p) { rows.push({ series: s.name, x: p[0], y: p[1] }); });
    });
    var tbl = table([{ key: 'series', label: '계열' },
                     { key: 'x', label: opts.xLabel || 'x', digits: 3 },
                     { key: 'y', label: opts.yLabel || 'y', digits: 3 }], rows, { maxRows: 100 });

    /* svg 를 withTableTwin 에 직접 넘긴다(bar/hist 와 같은 구조 — svg 의 부모가 곧 .viz-wrap 이다).
     * 전에는 svg 와 범례를 한 div 로 감싸서 넘겼는데, 그러면 svg 의 조부모가 .viz-wrap 이 아니라
     * 그 감싼 div 가 되어 "표 보기 twin이 있는가" 를 조상 2단계로 검사하는 도구(browser_check.js)가
     * 오탐(twin 없음)을 냈다. 범례는 결과 상자에 형제로 붙인다 — 표 보기로 전환해도 계열 색을
     * 계속 알아볼 수 있어서 오히려 더 낫다. */
    var out = withTableTwin(node, tbl, { title: opts.title });
    if (series.length >= 2) {
      out.appendChild(legend(series.map(function (s, i) {
        return { label: s.name, color: COLORS[i] };
      })));
    }
    return out;
  }

  /* 범례 — 계열 2개 이상이면 반드시 붙는다. 색 옆에 항상 글자가 온다. */
  function legend(items) {
    var box = el('div.legend');
    items.forEach(function (it) {
      var c = el('span.chip');
      c.style.setProperty('--chip-color', it.color);
      c.appendChild(document.createTextNode(it.label));
      box.appendChild(c);
    });
    return box;
  }

  // ─────────────────────────────────────────────── 컨트롤

  function slider(opts) {
    var row = el('div.control-row');
    var out = el('span.mono', { text: String(opts.value) });
    var input = el('input', {
      type: 'range', min: opts.min, max: opts.max, step: opts.step || 1, value: opts.value
    });
    input.addEventListener('input', function () {
      out.textContent = input.value;
      if (opts.onChange) opts.onChange(Number(input.value));
    });
    if (opts.label) row.appendChild(el('span.control-label', { text: opts.label }));
    row.appendChild(input);
    row.appendChild(out);
    return row;
  }

  function buttonGroup(items, opts) {
    opts = opts || {};
    var row = el('div.control-row');
    if (opts.label) row.appendChild(el('span.control-label', { text: opts.label }));
    var btns = [];
    items.forEach(function (it, i) {
      var b = el('button', { text: it.label, 'aria-pressed': i === (opts.selected || 0) ? 'true' : 'false' });
      b.addEventListener('click', function () {
        btns.forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', 'true');
        if (opts.onChange) opts.onChange(it.value === undefined ? it.label : it.value, i);
      });
      btns.push(b);
      row.appendChild(b);
    });
    return row;
  }

  function toggle(opts) {
    var b = el('button', { text: opts.label, 'aria-pressed': opts.value ? 'true' : 'false' });
    b.addEventListener('click', function () {
      var on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      if (opts.onChange) opts.onChange(on);
    });
    return b;
  }

  // ─────────────────────────────────────────────── 코드·출력

  /* 데이터셋별 실행 준비 코드.
   * 웹앱의 코드 조각은 `t`, `df` 같은 변수를 이미 있다고 가정한다. 학생이 IDLE 이나
   * 주피터에 그대로 붙이면 NameError 가 난다. 그래서 복사할 때 이걸 앞에 붙여 준다. */
  var PREAMBLE = {
    titanic: ['import pandas as pd', '', "t = pd.read_csv('train.csv')"],
    ramen: ['import pandas as pd', '', "ramen = pd.read_csv('ramen-ratings.csv')"],
    abalone: ['import pandas as pd', '', "df = pd.read_csv('abalone.csv')"],
    earthquake: ['import pandas as pd', '', "data = pd.read_csv('lab_earthquake.csv')"]
  };

  /* 클립보드에 쓴다. https 가 아니거나 file:// 로 열면 navigator.clipboard 가 없으므로
   * textarea + execCommand 로 되돌아간다(단일 파일 배포본을 그냥 열어도 동작해야 한다). */
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      ok ? resolve() : reject(new Error('복사할 수 없다'));
    });
  }

  /* 코드 블록. 실행하지 않는다 — 옆의 결과는 엔진이 계산한 실제 값이다.
   *
   *   opts.title      제목
   *   opts.output     아래에 붙일 출력
   *   opts.dataset    'titanic' | 'ramen' | 'abalone' | 'earthquake'
   *                   복사할 때 import 와 read_csv 를 앞에 붙여 **붙이면 바로 도는** 코드로 만든다
   *   opts.copyText   복사할 내용을 직접 지정 (dataset 보다 우선)
   *   opts.noCopy     복사 버튼을 달지 않는다
   */
  function code(src, opts) {
    opts = opts || {};
    var box = el('div.codeblock');
    if (opts.title) box.appendChild(el('div.panel-title', { text: opts.title }));

    var pre = el('pre', null, el('code', { text: src }));
    box.appendChild(pre);

    if (!opts.noCopy) {
      var payload = opts.copyText;
      if (payload === undefined) {
        var head = PREAMBLE[opts.dataset];
        payload = head ? head.join('\n') + '\n\n' + src : src;
      }
      var bar = el('div.code-actions');
      var btn = el('button.btn-copy', { text: '복사', type: 'button' });
      var hint = el('span.code-hint', {
        text: opts.dataset
          ? 'import 와 데이터 불러오기까지 함께 복사된다 — IDLE 에 붙여 바로 실행할 수 있다'
          : '이 블록만 복사된다'
      });
      btn.addEventListener('click', function () {
        copyToClipboard(payload).then(function () {
          btn.textContent = '✓ 복사됨';
          btn.classList.add('is-on');
          setTimeout(function () {
            btn.textContent = '복사';
            btn.classList.remove('is-on');
          }, 1600);
        }, function () {
          // 복사가 막힌 환경 — 학생이 직접 고를 수 있게 코드를 선택해 준다
          btn.textContent = '직접 복사하세요 (Ctrl+C)';
          var r = document.createRange();
          r.selectNodeContents(pre);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
        });
      });
      bar.appendChild(btn);
      bar.appendChild(hint);
      box.appendChild(bar);
    }

    if (opts.output !== undefined) {
      box.appendChild(el('div.panel-title', { text: '출력' }));
      box.appendChild(el('pre', null, el('code', { text: opts.output })));
    }
    return box;
  }

  /* 경고·에러 안내. 색만으로 말하지 않는다 — 아이콘과 라벨이 함께 온다. */
  function danger(label, message) {
    var box = el('div.note.note--danger');
    box.appendChild(el('span.note-label', { text: '⚠ ' + label + ' ' }));
    box.appendChild(document.createTextNode(message));
    return box;
  }

  function note(message, title) {
    var box = el('div.note');
    if (title) box.appendChild(el('span.note-label', { text: title + ' ' }));
    box.appendChild(document.createTextNode(message));
    return box;
  }

  // ─────────────────────────────────────────────── 단계 실행

  /* DF.trace 의 기록을 한 단계씩 넘겨 본다. */
  function stepper(steps, renderStep, opts) {
    opts = opts || {};
    var i = 0;
    var box = el('div.card');
    if (opts.title) box.appendChild(el('div.panel-title', { text: opts.title }));
    var bar = el('div.control-row');
    var prev = el('button', { text: '← 이전' });
    var next = el('button', { text: '다음 →' });
    var label = el('span.control-label');
    var body = el('div');
    function draw() {
      label.textContent = (i + 1) + ' / ' + steps.length;
      prev.disabled = i === 0;
      next.disabled = i === steps.length - 1;
      clear(body);
      body.appendChild(renderStep(steps[i], i));
    }
    prev.addEventListener('click', function () { if (i > 0) { i--; draw(); } });
    next.addEventListener('click', function () { if (i < steps.length - 1) { i++; draw(); } });
    bar.appendChild(prev); bar.appendChild(next); bar.appendChild(label);
    box.appendChild(bar);
    box.appendChild(body);
    draw();
    return box;
  }

  // ─────────────────────────────────────────────── 확인 문제

  function quiz(spec) {
    var box = el('div.card');
    box.appendChild(el('div.panel-title', { text: spec.title || '확인 문제' }));
    box.appendChild(el('p', { text: spec.question }));
    var result = el('div.note', { style: { display: 'none' } });
    (spec.choices || []).forEach(function (c, i) {
      var b = el('button', { text: c.label, style: { marginRight: '8px', marginBottom: '8px' } });
      b.addEventListener('click', function () {
        result.style.display = '';
        clear(result);
        var right = !!c.correct;
        result.classList.toggle('note--danger', !right);
        result.appendChild(el('span.note-label', {
          text: right ? '✓ 맞다. ' : '✗ 아니다. '
        }));
        result.appendChild(document.createTextNode(c.why || spec.explain || ''));
      });
      box.appendChild(b);
    });
    box.appendChild(result);
    return box;
  }

  // ─────────────────────────────────────────────── 공개 API

  var UI = {
    // DOM
    el: el, svg: svg, clear: clear, esc: esc, uid: uid,
    // 값
    fmt: fmt, isNA: isNA,
    // 표
    table: table, frameTable: frameTable, seriesTable: seriesTable,
    // 엔진 시각화
    blockView: blockView, shareBadge: shareBadge, alignView: alignView, groupView: groupView,
    // 차트
    bar: bar, hist: hist, scatter: scatter, legend: legend, withTableTwin: withTableTwin,
    niceTicks: niceTicks, scale: scale,
    // 컨트롤
    slider: slider, buttonGroup: buttonGroup, toggle: toggle,
    // 텍스트
    code: code, note: note, danger: danger,
    copyToClipboard: copyToClipboard, PREAMBLE: PREAMBLE,
    // 단계·문제
    stepper: stepper, quiz: quiz
  };

  if (typeof window !== 'undefined') window.UI = UI;
  if (typeof module !== 'undefined' && module.exports) module.exports = UI;
})();

 *    문법 검사도 node 하네스도 통과한다. 브라우저로 열어 보지 않으면 발견하지 못한다.
 *
 *    올바른 순서: df → ui → data → app → modules → Lab.boot()
 *
 * ★ render(root) 는 여러 번 호출된다. 장을 다시 방문하면 다시 불린다.
 *    모듈 전역에 가변 상태를 두지 말고 render 안의 지역 변수 + rebuild() 를 써라.
 *

(function () {
  'use strict';

  var STORE_KEY = 'pandas-lab/v1';
  var chapters = [];        // {id, num, title, subtitle, render}
  var byId = {};
  var mounted = null;       // 현재 그려진 장 id
  var firstRenderDone = false;
  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : { done: {}, theme: null };
    } catch (e) {
      return { done: {}, theme: null };   // 저장소가 막혀 있어도 앱은 돌아야 한다
    }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 무시 */ }
  }

  // ─────────────────────────────────────────────── 등록

  /* 모듈이 자기를 등록한다.
   *   Lab.register({ id:'ch07-copy', num:7, title:'뷰와 복사', render:function(root){…} }) */
  function register(spec) {
    if (!spec || !spec.id) throw new Error('register: id 가 필요하다');
    if (typeof spec.render !== 'function') throw new Error('register: ' + spec.id + ' 에 render 가 없다');
    if (byId[spec.id]) {
      console.warn('[Lab] 같은 id 가 두 번 등록되었다: ' + spec.id);
      return;
    }
    byId[spec.id] = spec;
    chapters.push(spec);
  }

  // ─────────────────────────────────────────────── 라우터

  function currentId() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    return h && byId[h] ? h : (chapters.length ? chapters[0].id : null);
  }

  function go(id) {
    if (location.hash.replace(/^#\/?/, '') === id) render();
    else location.hash = '#/' + id;
  }

  function render() {
    var id = currentId();
    if (!id) return;
    var main = document.getElementById('lab-main');
    if (!main) return;
    var spec = byId[id];

    // 같은 장을 다시 그릴 때도 root 를 완전히 비운다.
    // 모듈이 root 밖에 상태를 두면 여기서 새지만, 그건 모듈의 잘못이다(위 주석 참고).
    UI.clear(main);
    mounted = id;

    var head = UI.el('div');
    head.appendChild(UI.el('h1', { text: (spec.num ? spec.num + '장. ' : '') + spec.title }));
    if (spec.subtitle) head.appendChild(UI.el('p.note', { text: spec.subtitle }));
    main.appendChild(head);

    var body = UI.el('div');
    main.appendChild(body);
    try {
      spec.render(body);
    } catch (e) {
      body.appendChild(UI.danger('이 장을 그리는 중 오류', String(e && e.message || e)));
      console.error('[Lab] ' + id + ' render 실패', e);
    }

    main.appendChild(footer(spec));
    drawNav();

    /* 장을 **옮길 때만** 맨 위로 올린다.
     * 첫 렌더에서 스크롤하면 앱을 열자마자 장 제목을 지나친 위치에서 시작한다.
     * (scrollIntoView 는 sticky 헤더 높이를 고려하지 않아 제목이 헤더 밑에 깔리기도 한다.) */
    if (firstRenderDone) window.scrollTo({ top: 0, behavior: 'auto' });
    firstRenderDone = true;

    document.title = (spec.num ? spec.num + '장 · ' : '') + spec.title + ' — Pandas Lab';
  }

  function footer(spec) {
    var box = UI.el('div.card');
    var row = UI.el('div.control-row');
    var i = chapters.indexOf(spec);
    var doneBtn = UI.toggle({
      label: state.done[spec.id] ? '✓ 다 봤음' : '다 봤음으로 표시',
      value: !!state.done[spec.id],
      onChange: function (on) {
        state.done[spec.id] = on;
        save();
        doneBtn.textContent = on ? '✓ 다 봤음' : '다 봤음으로 표시';
        drawNav();
      }
    });
    row.appendChild(doneBtn);
    if (i > 0) {
      var p = UI.el('button', { text: '← ' + chapters[i - 1].title });
      p.addEventListener('click', function () { go(chapters[i - 1].id); });
      row.appendChild(p);
    }
    if (i < chapters.length - 1) {
      var n = UI.el('button', { text: chapters[i + 1].title + ' →' });
      n.addEventListener('click', function () { go(chapters[i + 1].id); });
      row.appendChild(n);
    }
    box.appendChild(row);
    return box;
  }

  // ─────────────────────────────────────────────── 네비게이션

  function drawNav() {
    var nav = document.getElementById('lab-nav');
    if (!nav) return;
    UI.clear(nav);
    var cur = currentId();
    var doneCount = chapters.filter(function (c) { return state.done[c.id]; }).length;

    nav.appendChild(UI.el('div.panel-title', {
      text: '진도 ' + doneCount + ' / ' + chapters.length
    }));

    var list = UI.el('div');
    chapters.forEach(function (c) {
      var item = UI.el('button', {
        style: { display: 'block', width: '100%', textAlign: 'left', marginBottom: '4px' },
        'aria-pressed': c.id === cur ? 'true' : 'false'

      item.appendChild(document.createTextNode(

      ));
      item.addEventListener('click', function () { go(c.id); });
      list.appendChild(item);
    });
    nav.appendChild(list);

    var reset = UI.el('button', { text: '진도 초기화', style: { marginTop: '12px' } });
    reset.addEventListener('click', function () {
      state.done = {};
      save();
      drawNav();
    });
    nav.appendChild(reset);
  }

  // ─────────────────────────────────────────────── 테마

  /* data-theme 을 루트에 도장한다. 토글이 OS 설정을 양방향으로 이겨야 한다. */
  function applyTheme() {
    var root = document.documentElement;
    if (state.theme === 'dark' || state.theme === 'light') root.setAttribute('data-theme', state.theme);

  function themeButton() {
    var b = UI.el('button', { text: themeLabel() });

      save();
      applyTheme();
      b.textContent = themeLabel();
    });
    return b;
  }
  function themeLabel() {
    return state.theme === 'dark' ? '◐ 어둡게' : state.theme === 'light' ? '◑ 밝게' : '◓ 시스템';
  }

  /* 모듈이 전부 등록된 뒤에 부른다. index.html 의 맨 마지막. */
  function boot(opts) {

/* ===== modules/ch01-why.js ===== */
/* ch01-why.js — 1장. pandas 는 무엇을 해결하는가
 *
 * 교재 pandas.md 192~470줄(1장)의 짝.
 * 리스트 -> 넘파이 배열 -> DataFrame 으로 올라가며 무엇이 해결되는지 조작으로 보여준다.
 *
 * ES 모듈 문법 금지 — IIFE. render(root) 는 재방문 시 다시 불리므로
 * 모든 가변 상태는 render 안의 지역 변수로 둔다(API.md §1 ②).
 */
(function () {
  'use strict';

  // ──────────────────────────────────────────── 순수 도우미(가변 상태 없음)

  /* 교재 1.3(1)의 학생 표. 열마다 dtype 이 다르다. */
  function buildStudentFrame() {
    var df = DF.frame({
      '이름': ['김민준', '이서연', '박도윤'],
      '나이': [32, 24, 38],
      '키': [183.0, 173.0, 180.0]
    });
    // JS 는 183.0 과 183 을 구분 못 한다 -> float64 를 명시로 선언한다
    df.declareDtypes({ '키': 'float64' });
    return df;
  }

  /* '+' 데모. 교재 1.1/1.2 의 a=[1,2,3], b=[4,5,6] 을 그대로 쓴다. */
  function computeAddDemo() {
    var a = [1, 2, 3];
    var b = [4, 5, 6];

    var listResult = a.concat(b); // 파이썬 리스트의 + = 이어붙이기

    // 넘파이 배열의 + = 자리별 덧셈. 엔진의 기본 RangeIndex 는 위치 그대로라
    // Series.add 가 위치로 짝짓는 것과 같은 결과를 낸다.
    var arrResult = DF.series(a).add(DF.series(b)).toArray();

    // DataFrame(Series): 이름표(인덱스)로 값을 저장한다.
    // b 쪽은 저장 순서를 일부러 뒤섞었다 — 그래도 이름으로 정확히 맞춰지는지 보기 위해서다.
    var labelsA = ['월', '화', '수'];
    var labelsB = ['수', '월', '화'];
    var valuesB = [6, 4, 5]; // '수'=6, '월'=4, '화'=5  (b 와 같은 값, 저장 순서만 다르다)
    var dfA = DF.series(a, { index: labelsA, name: '값' });
    var dfB = DF.series(valuesB, { index: labelsB, name: '값' });
    var dfResult = dfA.add(dfB);

    // 만약 이름을 무시하고 저장된 순서로만(배열처럼) 더했다면?
    var naive = [];
    for (var i = 0; i < a.length; i++) naive.push(dfA.at(i) + dfB.at(i));

    return {
      a: a, b: b, listResult: listResult, arrResult: arrResult,
      dfA: dfA, dfB: dfB, dfResult: dfResult, naive: naive
    };
  }

  /* '이름으로 열 찾기' 데모 */
  function computeColDemo(colName) {
    var df = buildStudentFrame();
    var rows = df.records().map(function (r) { return [r['이름'], r['나이'], r['키']]; });
    // 리스트/배열은 위치로만 저장되므로 문자열 키로 찾으면 (실제로) undefined 다
    var positional = rows.map(function (r) { return r[colName]; });
    var dfFound = df.col(colName); // 진짜로 이름으로 찾아진다
    return { df: df, rows: rows, positional: positional, dfFound: dfFound };
  }

  /* '열마다 다른 타입' 데모 — 교재 1.3(1) */
  function computeDtypeDemo() {
    var df = buildStudentFrame();
    var cols = df.columns; // ['이름', '나이', '키']
    var dtypes = df.dtypes(); // DataFrame 은 컬럼별 dtype 을 유지한다
    var rows = df.records().map(function (r) { return cols.map(function (c) { return r[c]; }); });

    var dtypeLabel = { 'str': 'str (문자열)', 'int64': 'int (정수)', 'float64': 'float (실수)' };
    // 리스트: 셀마다 원래 타입을 그대로 유지한다 (JS 는 183 과 183.0 을 구분 못 하므로
    // 컬럼에 선언된 dtype 을 그대로 라벨로 쓴다 — 값 자체가 아니라 "원래 무슨 타입이었나" 를 보여준다)
    var listTypes = cols.map(function (c) { return dtypeLabel[dtypes[c]] || dtypes[c]; });

    // 배열: numpy 처럼 전부 문자열로 강제 변환된다. float64 컬럼은 '183.0' 처럼 소수점을 남긴다
    // (JS 숫자는 183 과 183.0 을 구분 못 하므로, 원래 dtype 이 float64 였던 값만 .0 을 붙여 문자열로 만든다)
    function pyStr(v, dtype) {
      if (dtype === 'float64' && typeof v === 'number' && Number.isInteger(v)) return v + '.0';
      return String(v);
    }
    var stringified = [];
    rows.forEach(function (r) {
      r.forEach(function (v, i) { stringified.push(pyStr(v, dtypes[cols[i]])); });
    });
    var arrDtype = DF.inferDtype(stringified); // 실제로 'str' 이 나온다

    return { df: df, rows: rows, listTypes: listTypes, stringified: stringified, arrDtype: arrDtype, dtypes: dtypes };
  }

  /* '결측값 넣기' 데모 — 교재 1.3(3) */
  function computeNaDemo() {
    var withoutNA = [27, 19, 31];
    var withNA = [27, 19, NaN, 31]; // 진짜 NaN. null 은 JS 에서 산술 시 0 으로 취급돼 전파되지 않는다
    var arrDtypeBefore = DF.inferDtype(withoutNA);
    var arrDtypeAfter = DF.inferDtype(withNA);
    var naiveSum = withNA.reduce(function (s, v) { return s + v; }, 0); // NaN 이 전파된다
    var series = DF.series(withNA, { name: '나이' }); // dtype 은 자동으로 float64 로 올라간다
    return {
      withNA: withNA, arrDtypeBefore: arrDtypeBefore, arrDtypeAfter: arrDtypeAfter,
      naiveSum: naiveSum, series: series
    };
  }

  // ──────────────────────────────────────────── 공용 레이아웃 도우미
  // (색은 원본/사본/결과 세 역할로 고정돼 있어 리스트·배열·DataFrame 을 그 색으로
  //  구분하지 않는다. 여기서는 "DataFrame 이 낸 결과" 에만 --c-result 를 쓰고
  //  나머지는 중립 테두리 + 라벨로 구분한다.)

  function threeUp(children) {
    return UI.el('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '16px', alignItems: 'flex-start' } },
      children.map(function (c) {
        return UI.el('div', { style: { flex: '1 1 240px', minWidth: '220px' } }, c);
      })
    );
  }

  function neutralBox(label, node) {
    var box = UI.el('div', {
      style: {
        border: '1px solid var(--border)', borderRadius: 'var(--radius)',
        padding: '12px', background: 'var(--surface-1)'
      }
    });
    box.appendChild(UI.el('div.panel-title', { text: label }));
    box.appendChild(node);
    return box;
  }

  Lab.register({
    id: 'ch01-why',
    num: 1,
    title: 'pandas 는 무엇을 해결하는가',
    subtitle: '리스트 → 배열 → DataFrame, 표 데이터가 막히는 지점을 하나씩 넘는다',

    render: function (root) {
      root.appendChild(UI.note(
        '파이썬 리스트는 "이어붙이기"만 안다. 넘파이 배열은 자리별 계산은 되지만 ' +
        '이름으로 열을 찾거나, 열마다 dtype 을 다르게 두거나, 결측값을 다루지 못한다. ' +
        'DataFrame(과 Series)이 이 세 가지를 어떻게 메우는지 아래에서 직접 눌러 확인한다.'
      ));

      // ══════════════════════════════════ 시뮬레이터 ① 세 가지 자료구조 비교기

      var sim1 = UI.el('div.card');
      sim1.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ① — 리스트 · 배열 · DataFrame 비교기' }));

      var op = 'add';       // 'add' | 'findcol' | 'dtype' | 'na'
      var col = '나이';      // findcol 에서 고른 열 이름
      var sim1Body = UI.el('div');

      function rebuildSim1() {
        UI.clear(sim1Body);

        if (op === 'add') {
          var d = computeAddDemo();
          sim1Body.appendChild(UI.note('같은 데이터: a = [' + d.a.join(', ') + '],  b = [' + d.b.join(', ') + ']'));
          sim1Body.appendChild(threeUp([
            neutralBox('① 파이썬 리스트 — a + b',
              UI.table([{ key: 'v', label: '값' }], d.listResult.map(function (v) { return { v: v }; }))),
            neutralBox('② 넘파이 배열 — a + b (자리별 덧셈)',
              UI.table([{ key: 'v', label: '값' }], d.arrResult.map(function (v) { return { v: v }; }))),
            neutralBox('③ DataFrame(Series) — a + b',
              UI.seriesTable(d.dfResult, { frame: 'result' }))
          ]));
          sim1Body.appendChild(UI.note(
            '왼쪽은 [' + d.dfA.labels().join(',') + '] 순서로, 오른쪽은 [' + d.dfB.labels().join(',') +
            '] 순서로 저장되어 있다(저장 순서가 다르다). 그래도 pandas 는 이름표(인덱스)를 보고 짝지어 ' +
            d.dfResult.labels().join(',') + ' 순서로 ' + d.dfResult.toArray().join(', ') + ' 를 낸다. ' +
            '만약 배열처럼 저장된 순서로만 더했다면 ' + d.naive.join(', ') + ' 이 됐을 것이다(틀렸다).',
            '인덱스로 짝짓기 — '
          ));
        } else if (op === 'findcol') {
          sim1Body.appendChild(UI.buttonGroup(
            [{ label: '이름', value: '이름' }, { label: '나이', value: '나이' }, { label: '키', value: '키' }],
            { label: '찾을 열', selected: ['이름', '나이', '키'].indexOf(col), onChange: function (v) { col = v; rebuildSim1(); } }

          sim1Body.appendChild(threeUp([
            neutralBox('① 파이썬 리스트 — 위치로만 접근',

                String(d2.positional[0]) + " 가 나온다 — 원하는 값이 아니다.")),
            neutralBox('② 넘파이 배열 — 위치로만 접근',
              UI.danger('안 된다',

            neutralBox('③ DataFrame — 이름으로 된다',

          ]));
        } else if (op === 'dtype') {
          var d3 = computeDtypeDemo();
          sim1Body.appendChild(UI.note('표: 이름(문자열) · 나이(정수) · 키(실수)를 한 곳에 담아본다. (1행: ' +
            d3.rows[0].join(' / ') + ')'));
          sim1Body.appendChild(threeUp([
            neutralBox('① 파이썬 리스트 — 그대로 유지',
              UI.table([{ key: 'cell', label: '첫 행의 칸' }, { key: 't', label: '실제 타입' }],

            neutralBox('② 넘파이 배열 — 문자열로 통일',
              UI.table([{ key: 'v', label: '값(문자열로 바뀜)' }],

            neutralBox('③ DataFrame — 컬럼별 dtype 유지',
              UI.table([{ key: 'c', label: '컬럼' }, { key: 'dt', label: 'dtype' }],
                Object.keys(d3.dtypes).map(function (k) { return { c: k, dt: d3.dtypes[k] }; }),
                { frame: 'result' }))
          ]));
        } else { // 'na'
          var d4 = computeNaDemo();
          sim1Body.appendChild(UI.note('나이 배열 [27, 19, 31] (dtype: ' + d4.arrDtypeBefore +
            ') 에 결측값을 하나 넣는다.'));
          sim1Body.appendChild(threeUp([
            neutralBox('① 파이썬 리스트 — dtype 개념이 없다',
              UI.table([{ key: 'v', label: '값' }], d4.withNA.map(function (v) { return { v: v }; }))),
            neutralBox('② 넘파이 배열 — dtype 이 바뀐다', UI.el('div', null, [
              UI.note(d4.arrDtypeBefore + ' → ' + d4.arrDtypeAfter + ' 로 바뀌었다'),
              UI.table([{ key: 'v', label: '값' }], d4.withNA.map(function (v) { return { v: v }; })),
              UI.danger('전파된다', '이대로 합을 구하면 ' + UI.fmt(d4.naiveSum) +
                ' 이 나온다 — NaN 이 하나만 섞여도 전체 계산이 못 쓰게 된다.')
            ])),
            neutralBox('③ DataFrame(Series) — NaN 을 다룰 수 있다', UI.el('div', null, [
              UI.seriesTable(d4.series, { frame: 'result' }),
              UI.note('결측을 자동으로 건너뛰고 계산한다: 평균 = ' + UI.fmt(d4.series.mean(), 2) +

            ]))
          ]));
        }
      }

      sim1.appendChild(UI.buttonGroup([
        { label: '+', value: 'add' },
        { label: '이름으로 열 찾기', value: 'findcol' },
        { label: '열마다 다른 타입', value: 'dtype' },
        { label: '결측값 넣기', value: 'na' }
      ], { label: '연산', selected: 0, onChange: function (v) { op = v; col = '나이'; rebuildSim1(); } }));
      sim1.appendChild(sim1Body);

      root.appendChild(sim1);

      var n = 4;

      function rebuildSim2() {

          '넘파이 배열은 이 인덱스가 없다 — 값만 있는 목록일 뿐이다: [' + s.toArray().join(', ') + ']. ' +
          '그래서 배열에서는 "몇 번째" 로만 꺼낼 수 있고, Series 에서는 "' +

        ));
      }

      root.appendChild(UI.quiz({
        title: '확인 문제 1',

        choices: [
          { label: '[5, 7, 9]', correct: false, why: '그건 넘파이 배열의 자리별 덧셈 결과다. 리스트의 + 는 이어붙이기라 다르다.' },

      root.appendChild(UI.quiz({
        title: '확인 문제 2',
        question: '이름(문자열)·나이(정수)·키(실수)가 섞인 표를 하나의 numpy 배열에 담으면 32, 183.0 같은 숫자는 어떻게 되는가?',
