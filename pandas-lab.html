    { label: '승객 번호 (PassengerId)', value: 'PassengerId' }
  ];

  Lab.register({
    id: 'ch10-agg',
    num: 10,
    title: '정렬과 집계',
    subtitle: 'sort_values 로 순서를 정하고, count·mean·std·describe·corr 로 수백 행을 숫자 몇 개로 요약한다',

    render: function (root) {
      root.appendChild(simSort());
      root.appendChild(simAggCalc());
      root.appendChild(simDescribeHist());
      root.appendChild(simCorr());
      root.appendChild(quizSection());
    }
  });

  // ──────────────────────────────────────────────────────────── 시뮬레이터 ①

  /* 정렬 실험실 — sort_values 로 순서를 바꿔도 인덱스가 값을 따라가는 것,
   * 결측값은 오름차순·내림차순 상관없이 언제나 맨 뒤로 가는 것을 직접 본다. */
  function simSort() {
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ① 정렬 실험실 — sort_values' }));
    box.appendChild(UI.note('titanic 데이터는 원본과 구조(행 수, 결측 개수, dtype)만 같은 합성 데이터다.'));

    var col = 'Age';
    var asc = true;
    var multi = false;
    var body = UI.el('div');

    box.appendChild(UI.buttonGroup(SORT_COLS, {
      label: '정렬 기준', selected: 0, onChange: function (v) { col = v; rebuild(); }
    }));
    box.appendChild(UI.toggle({
      label: '내림차순 (ascending=False)', value: !asc,
      onChange: function (on) { asc = !on; rebuild(); }
    }));
    box.appendChild(UI.toggle({
      label: "여러 컬럼 정렬 — ['Pclass', 선택한 컬럼]", value: multi,
      onChange: function (on) { multi = on; rebuild(); }
    }));
    box.appendChild(body);

    function rebuild() {
      UI.clear(body);
      var df = LabData.frame('titanic');
      var by = multi ? ['Pclass', col] : col;
      var sorted = df.sortValues(by, { ascending: asc });

      body.appendChild(UI.el('div.panel-title', {
        text: "t.sort_values(" + JSON.stringify(by) + ", ascending=" + asc + ")"
      }));

      // ── 인덱스는 값을 따라간다 ──────────────────────────────────
      var origLabel0 = df.index.at(0);
      var sortedLabel0 = sorted.index.at(0);
      var sortedName0 = sorted.col('Name').at(0);
      var checkedName = df.loc(sortedLabel0, 'Name').at(0);
      var consistent = checkedName === sortedName0;

      var headHl = [];
      for (var i = 0; i < Math.min(6, sorted.shape[0]); i++) headHl.push([i, '__index__']);
      body.appendChild(UI.frameTable(sorted.head(6), { digits: 2, hlCells: headHl }));

      body.appendChild(UI.note(
        '정렬 전 df 의 맨 위 행(iloc 위치 0)은 인덱스 라벨 ' + origLabel0 + '를 갖고 있었다. 정렬 후 표의 맨 ' +
        '위 행은 위치는 바뀌었지만 인덱스 라벨 ' + sortedLabel0 + '(위 표에서 링으로 표시)를 그대로 갖고 있다. ' +
        "df.loc(" + sortedLabel0 + ", 'Name') 으로 원본에서 찾아도 같은 사람(" + checkedName + ")이 나온다(" +
        (consistent ? '일치' : '불일치') + ') — sort_values 는 행의 순서만 바꿀 뿐, 인덱스는 원래 행의 것을 ' +
        '그대로 들고 다닌다. 5장의 loc(라벨)·iloc(위치) 구분이 여기서도 그대로 유효하다.'
      ));

      if (!multi) {
        var total = df.col(col).length();
        var nonNull = df.col(col).count();
        var missing = total - nonNull;
        if (missing > 0) {
          var tailN = Math.min(6, missing);
          var tail = sorted.tail(tailN);
          var tailHl = [];
          for (var j = 0; j < tail.shape[0]; j++) tailHl.push([j, col]);
          body.appendChild(UI.el('div.panel-title', { text: col + ' 결측 ' + missing + '건 — 표의 맨 끝' }));
          body.appendChild(UI.frameTable(tail, { digits: 2, hlCells: tailHl }));
          var allNaAtTail = true;
          for (var k = 0; k < tailN; k++) { if (!DF.isNA(tail.col(col).at(k))) allNaAtTail = false; }
          body.appendChild(UI.danger(
            '결측은 언제나 맨 뒤',
            col + ' 열에는 결측이 ' + missing + '건 있다. 지금 ' + (asc ? '오름차순' : '내림차순') +
            '으로 정렬했는데도 맨 마지막 ' + tailN + '행이 ' + (allNaAtTail ? '전부 결측(NaN)이다' : '결측이 아니다') +
            '. 위 토글로 방향을 바꿔 봐도(오름↔내림) 결측은 항상 맨 뒤에 남는다 — na_position="last" 가 ' +
            '기본값이기 때문이다.'
          ));
        } else {
          body.appendChild(UI.note(col + ' 열에는 결측이 없어(count = ' + nonNull + ' / ' + total +
            ') 이 정렬에서는 결측이 맨 뒤로 가는 모습을 볼 수 없다. Age 나 Embarked 를 골라 보라.'));
        }
      } else {
        var firstPclass = sorted.col('Pclass').at(0);
        var lastPclass = sorted.col('Pclass').at(sorted.shape[0] - 1);
        body.appendChild(UI.note(
          "['Pclass', '" + col + "'] 로 정렬하면 Pclass 가 먼저 결정한다(" + (asc ? '오름차순' : '내림차순') +
          ' 이므로 맨 위는 Pclass=' + firstPclass + ', 맨 아래는 Pclass=' + lastPclass + '). Pclass 값이 같은 ' +
          '행끼리는 그 안에서 ' + col + ' 기준으로 다시 줄을 선다 — 앞 컬럼이 우선순위를 갖고, 값이 같을 때만 ' +
          '다음 컬럼으로 넘어간다.'
        ));
      }

      body.appendChild(UI.note(
        'sort_values() 도 원본을 바꾸지 않는다(4장의 drop() 과 같은 패턴). 반환값을 변수에 받지 않으면 ' +
        '정렬된 결과는 만들어졌다가 그대로 버려진다.'
      ));
    }

    rebuild();
    return box;
  }

  // ──────────────────────────────────────────────────────────── 시뮬레이터 ②

  /* 집계 함수 계산기 — count/sum/mean/min/max/median/std/nunique 를 한 번에.
   * count() 와 shape[0] 의 차이, std 의 ddof=1 기본값을 직접 대조한다. */
  function simAggCalc() {
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ② 집계 함수 계산기' }));

    var col = 'Age';
    var body = UI.el('div');

    box.appendChild(UI.buttonGroup(AGG_COLS, {
      label: '숫자 컬럼', selected: 0, onChange: function (v) { col = v; rebuild(); }
    }));
    box.appendChild(body);

    function rebuild() {
      UI.clear(body);
      var df = LabData.frame('titanic');
      var s = df.col(col);
      var totalRows = df.shape[0];
      var cnt = s.count();
      var missing = totalRows - cnt;

      body.appendChild(UI.el('div.panel-title', { text: "df.col('" + col + "') 의 집계값" }));
      body.appendChild(UI.table([
        { key: 'which', label: '집계 함수' },
        { key: 'value', label: '값', digits: 4 }
      ], [
        { which: 'count()', value: cnt },
        { which: 'sum()', value: s.sum() },
        { which: 'mean()', value: s.mean() },
        { which: 'min()', value: s.min() },
        { which: 'max()', value: s.max() },
        { which: 'median()', value: s.median() },
        { which: 'std()', value: s.std() },
        { which: 'nunique()', value: s.nunique() }
      ], { hlCells: missing > 0 ? [[0, 'which'], [0, 'value']] : [] }));

      body.appendChild(UI.el('div.panel-title', { text: 'count() 대 shape[0]' }));
      body.appendChild(UI.table([
        { key: 'which', label: '무엇' },
        { key: 'value', label: '값' }
      ], [
        { which: 'df.shape[0] — 전체 행 수', value: totalRows },
        { which: "df.col('" + col + "').count() — 결측이 아닌 값의 개수", value: cnt }
      ], {}));
      body.appendChild(missing > 0
        ? UI.danger(
            'count() != shape[0]',
            col + ' 열은 ' + totalRows + '행 중 ' + missing + '개가 결측이라 count() 는 ' + cnt +
            '만 센다. count() 는 "그 컬럼에 값이 몇 개 채워져 있는가" 를 답하고, shape[0] 은 "행이 ' +
            '몇 개인가" 를 답한다 — 질문 자체가 다르다.'
          )
        : UI.note(col + ' 열에는 결측이 없어 count()(' + cnt + ') 와 shape[0](' + totalRows + ') 가 같다.')
      );

      // ★ std 의 ddof 기본값
      var std1 = s.std(1);
      var std0 = s.std(0);
      body.appendChild(UI.el('div.panel-title', { text: 'std 는 ddof 에 따라 값이 달라진다' }));
      body.appendChild(UI.table([
        { key: 'which', label: '호출' },
        { key: 'value', label: '표준편차', digits: 6 }
      ], [
        { which: "s.std()  — ddof=1 (pandas 기본, 표본 표준편차)", value: std1 },
        { which: "s.std(0) — ddof=0 (numpy 의 np.std 기본값)", value: std0 }
      ], {}));
      body.appendChild(UI.note(
        '같은 ' + col + ' 열인데 ddof 기본값이 다르면 표준편차 값도 달라진다(' + UI.fmt(std1, 6) + ' 대 ' +
        UI.fmt(std0, 6) + '). pandas 와 numpy 를 섞어 쓰다가 표준편차가 다르게 나온다면 라이브러리가 아니라 ' +
        'ddof 기본값 차이를 먼저 의심한다.'
      ));
    }

    rebuild();
    return box;
  }

  // ──────────────────────────────────────────────────────────── 시뮬레이터 ③

  /* describe() 와 분포 잇기 — 8줄이 히스토그램의 어디를 가리키는지 연결한다. */
  function simDescribeHist() {
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ③ describe() 와 분포 잇기' }));

    var col = 'Age';
    var body = UI.el('div');

    box.appendChild(UI.buttonGroup(AGG_COLS, {
      label: '숫자 컬럼', selected: 0, onChange: function (v) { col = v; rebuild(); }
    }));
    box.appendChild(body);

    function rebuild() {
      UI.clear(body);
      var df = LabData.frame('titanic');
      var s = df.col(col);
      var desc = s.describe();

      body.appendChild(UI.el('div.panel-title', { text: "df.col('" + col + "').describe()" }));
      body.appendChild(UI.seriesTable(desc, { digits: 4 }));

      var bins = s.nunique() > 1 && s.nunique() <= 10 ? s.nunique() : 20;
      body.appendChild(UI.hist(s.toArray(), { title: col + ' 의 분포', bins: bins }));

      var nums = s.toArray().filter(function (v) { return typeof v === 'number' && !isNaN(v); });
      var lo = Math.min.apply(null, nums), hi = Math.max.apply(null, nums);
      var step = (hi - lo) / bins || 1;
      function binRange(v) {
        var k = Math.min(bins - 1, Math.max(0, Math.floor((v - lo) / step)));
        return UI.fmt(lo + k * step, 2) + ' ~ ' + UI.fmt(lo + (k + 1) * step, 2);
      }
      var q25 = s.quantile(0.25), q50 = s.median(), q75 = s.quantile(0.75);
      body.appendChild(UI.note(
        '25% 지점(' + UI.fmt(q25, 3) + ')은 히스토그램의 ' + binRange(q25) + ' 구간에, ' +
        '중앙값 50%(' + UI.fmt(q50, 3) + ')는 ' + binRange(q50) + ' 구간에, ' +
        '75% 지점(' + UI.fmt(q75, 3) + ')은 ' + binRange(q75) + ' 구간에 있다. 값을 오름차순으로 늘어놓았을 ' +
        '때 그 비율 지점에 있는 값이 사분위수(quartile)다.'
      ));

      var medianVal = s.median();
      var describe50 = desc.loc('50%');
      var same = medianVal === describe50;
      body.appendChild(UI.note(
        's.median() = ' + UI.fmt(medianVal, 6) + ', describe()[\'50%\'] = ' + UI.fmt(describe50, 6) + ' — ' +
        (same ? '완전히 같은 값이다' : '값이 다르다(엔진 확인 필요)') +

  }

  // ──────────────────────────────────────────────────────────── 시뮬레이터 ④

  /* 상관계수 — 문자열 컬럼이 섞이면 pandas 의 corr() 이 죽는 유일한 케이스.
   * 엔진에는 corr 이 없으므로 숫자 컬럼 두 개를 골라 피어슨 상관계수를 직접 계산한다. */
  function pearsonPairwise(df, xName, yName) {
    var xs = df.col(xName).toArray();
    var ys = df.col(yName).toArray();
    var px = [], py = [];
    for (var i = 0; i < xs.length; i++) {
      if (!DF.isNA(xs[i]) && !DF.isNA(ys[i]) && typeof xs[i] === 'number' && typeof ys[i] === 'number') {
        px.push(xs[i]); py.push(ys[i]);
      }
    }
    var n = px.length;
    if (n < 2) return { r: NaN, n: n, points: [] };
    var mx = px.reduce(function (a, b) { return a + b; }, 0) / n;
    var my = py.reduce(function (a, b) { return a + b; }, 0) / n;
    var num = 0, dx2 = 0, dy2 = 0;
    for (var j = 0; j < n; j++) {
      var dx = px[j] - mx, dy = py[j] - my;
      num += dx * dy; dx2 += dx * dx; dy2 += dy * dy;
    }
    var r = (dx2 === 0 || dy2 === 0) ? NaN : num / Math.sqrt(dx2 * dy2);
    var points = [];
    for (var k = 0; k < n; k++) points.push([px[k], py[k]]);
    return { r: r, n: n, points: points };
  }

  function simCorr() {
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ④ ★ 상관계수 — 여기서 실행이 멈춘다' }));

    var dfIntro = LabData.frame('titanic');
    var firstName = dfIntro.col('Name').at(0);
    box.appendChild(UI.danger(
      "t.corr() 는 ValueError 로 죽는다",

      "pandas 는 문자열을 실수로 바꾸려다 실패한다. 예를 들어 titanic 의 첫 행 Name 값은 '" + firstName +
      "'인데, 이런 문자열은 애초에 숫자가 아니라서 상관계수를 계산할 수 없다. 숫자 컬럼만 쓰겠다는 뜻을 " +
      "numeric_only=True 로 직접 밝혀야 한다(t.corr(numeric_only=True))."
    ));
    box.appendChild(UI.code(
      "t.corr()",
      { title: '문자열 컬럼이 섞인 채로 corr() 을 부르면', output: "ValueError: could not convert string to float: '" + firstName + "'" }
    ));
    box.appendChild(UI.note(
      '엔진(DF)에는 corr() 이 없다. 아래 계산기는 숫자 컬럼 두 개를 골라 피어슨 상관계수를 직접 계산한다 ' +
      '(두 컬럼 모두 값이 있는 행만 골라 평균과 표준편차로 구한다) — pandas 의 corr(numeric_only=True) 와 ' +
      '같은 방식이다.'
    ));

    var xCol = 'Pclass';
    var yCol = 'Fare';
    var body = UI.el('div');

    box.appendChild(UI.buttonGroup(CORR_COLS, {
      label: 'x 축 컬럼', selected: 0, onChange: function (v) { xCol = v; rebuild(); }
    }));
    box.appendChild(UI.buttonGroup(CORR_COLS, {
      label: 'y 축 컬럼', selected: 4, onChange: function (v) { yCol = v; rebuild(); }
    }));
    box.appendChild(body);

    function rebuild() {
      UI.clear(body);
      var df = LabData.frame('titanic');

      if (xCol === yCol) {
        body.appendChild(UI.note('같은 컬럼을 x, y 로 고르면 상관계수는 언제나 1이다(자기 자신과는 완전히 ' +
          '같이 움직인다). 서로 다른 두 컬럼을 골라 보라.'));
        return;
      }

      var result = pearsonPairwise(df, xCol, yCol);
      body.appendChild(UI.el('div.panel-title', {
        text: 'corr(' + xCol + ', ' + yCol + ') = ' + UI.fmt(result.r, 4) + '  (결측 없는 ' + result.n + '쌍으로 계산)'
      }));

      var abs = Math.abs(result.r);
      var strength = isNaN(abs) ? '계산할 수 없음' : abs >= 0.6 ? '뚜렷한' : abs >= 0.3 ? '약한' : '거의 없는';
      var direction = result.r > 0 ? '같은 방향으로(하나가 커지면 다른 하나도 커지는 쪽으로)'
        : result.r < 0 ? '반대 방향으로(하나가 커지면 다른 하나는 작아지는 쪽으로)' : '어느 쪽도 아니게';
      body.appendChild(UI.note(
        xCol + ' 와 ' + yCol + ' 는 ' + strength + ' 상관관계를 보인다(|r| = ' + UI.fmt(abs, 3) + '). ' +
        '부호가 ' + (result.r >= 0 ? '양수' : '음수') + '이므로 두 값은 ' + direction + ' 움직이는 경향이 있다.'
      ));

      // 산점도는 표시 목적으로 최대 300점만 그린다. r 값 자체는 결측 없는 전체 쌍으로 계산했다.
      var pts = result.points;
      if (pts.length > 300) {
        var step = Math.ceil(pts.length / 300);
        var sampled = [];
        for (var i = 0; i < pts.length; i += step) sampled.push(pts[i]);
        pts = sampled;
        body.appendChild(UI.note(
          '산점도에는 ' + result.n + '쌍 중 ' + pts.length + '개만 골라 그렸다(화면이 너무 빽빽해지지 않게). ' +
          '상관계수 값은 표시된 점이 아니라 결측 없는 ' + result.n + '쌍 전체로 계산한 값이다.'
        ));
      }
      body.appendChild(UI.scatter(
        [{ name: xCol + ' vs ' + yCol, points: pts }],
        { title: xCol + ' – ' + yCol + ' 산점도', xLabel: xCol, yLabel: yCol }
      ));

      body.appendChild(UI.note(
        '상관계수가 인과관계를 뜻하지는 않는다. 두 컬럼이 강하게 상관되어 있다고 해서 어느 하나가 다른 ' +
        '하나의 원인은 아니다. 둘 다 같은 원인(예: 좌석 등급)에서 갈라져 나온 결과일 수 있다. 상관계수는 ' +
        '"같이 움직이는 정도"만 알려 준다 — 왜 같이 움직이는지는 데이터 밖의 지식으로 판단해야 한다.',
        '상관은 인과가 아니다'
      ));
    }

    rebuild();
    return box;
  }

  function uniqueSorted(arr) {

      var total = groups.reduce(function (s, gr) { return s + gr.rows.length; }, 0);
      body.appendChild(UI.note(
        '묶음에 들어간 행을 모두 더하면 ' + total + '행이다(전체 ' + df.shape[0] + '행 중). ' +
        (total < df.shape[0]
          ? (df.shape[0] - total) + '행이 어느 묶음에도 들어가지 못했다 — ' + key + ' 값이 결측인 행은 ' +
            'groupby 가 기본값(dropna=True)으로 통째로 제외한다.'
          : '이 컬럼에는 결측이 없어 전체 행이 빠짐없이 어느 한 묶음에 들어갔다.')
      ));
    }

    rebuild();
    return box;
  }

  // ──────────────────────────────────────────────────────────── 시뮬레이터 ②

  /* apply → combine — 집계 함수를 붙이면 각 묶음이 값 하나로 접힌다.
   * ★ 결측은 집계에서 빠진다: Age 와 Fare 를 나란히 count() 하면 값이 다르게 나온다. */
  function simAggCombine() {
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ② apply 로 각 묶음을 한 줄로 접기' }));
    box.appendChild(UI.note(
      '집계 함수를 고르는 순간 apply → combine 이 실행된다. 결과의 인덱스는 원래 컬럼이 아니라 ' +
      '그룹을 나눈 기준 값이 된다는 것을 눈여겨보라.'
    ));

    var key = 'Pclass';
    var agg = 'mean';
    var col = 'Age';
    var body = UI.el('div');

    box.appendChild(UI.buttonGroup(KEY_COLS, {
      label: '기준 컬럼', selected: 0, onChange: function (v) { key = v; rebuild(); }
    }));
    box.appendChild(UI.buttonGroup(AGG_FUNCS, {
      label: '집계 함수', selected: 0, onChange: function (v) { agg = v; rebuild(); }
    }));
    box.appendChild(UI.buttonGroup(NUM_COLS, {
      label: '대상 컬럼', selected: 0, onChange: function (v) { col = v; rebuild(); }
    }));
    box.appendChild(body);

    function rebuild() {
      UI.clear(body);
      var df = LabData.frame('titanic');
      var g = df.groupby(key);
      var result = g.aggCol(col, agg);

      body.appendChild(UI.el('div.panel-title', {
        text: "df.groupby('" + key + "')['" + col + "']." + agg + "()"
      }));
      body.appendChild(UI.seriesTable(result, { digits: 4 }));
      body.appendChild(UI.note(
        '결과의 인덱스(' + (result.index.name || key) + ')는 ' + key + ' 값 그 자체다. combine 이 끝나면 ' +
        '"무엇으로 나눴는가" 가 인덱스에, "그 그룹에 대해 계산한 값" 이 값 자리에 들어간다.'
      ));

      // ★ 결측은 집계에서 빠진다 — Age 와 Fare 를 함께 count 하면 값이 다르다
      var countBoth = g.agg({ Age: 'count', Fare: 'count' });
      body.appendChild(UI.el('div.panel-title', {
        text: "g.agg({Age: 'count', Fare: 'count'}) — 결측값은 세지 않는다"
      }));
      body.appendChild(UI.frameTable(countBoth, { digits: 0 }));

      var ageMissTotal = df.shape[0] - df.col('Age').count();
      var fareMissTotal = df.shape[0] - df.col('Fare').count();
      if (ageMissTotal !== fareMissTotal) {
        body.appendChild(UI.danger('Age 와 Fare 의 count() 가 다르다',
          'Fare 는 결측이 ' + fareMissTotal + '건이라 각 묶음의 count 가 그 묶음의 인원수(g.size())와 정확히 같지만, ' +
          'Age 는 결측이 ' + ageMissTotal + '건 있어 그보다 작게 나온다. count() 는 결측값을 세지 않기 때문이다 — ' +
          'groupby 뒤에서도 이 규칙은 그대로 적용된다.'));
      } else {
        body.appendChild(UI.note('이 컬럼 조합에서는 두 열의 결측 개수가 우연히 같다.'));
      }
    }

    rebuild();
    return box;
  }

  // ──────────────────────────────────────────────────────────── 시뮬레이터 ③

  /* 여러 키로 묶기 — 키를 켜고 끄면 그룹 수가 곱해지는 것과, NaN 키를 가진 행이
   * 조용히 빠지는 것(그룹 크기의 합 < 전체 행 수)을 함께 보여준다. */
  function simMultiKey() {
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ③ 여러 키로 묶기 — 그룹 수는 곱해진다' }));
    box.appendChild(UI.note(
      '키를 켜고 꺼서 몇 개의 기준으로 묶을지 정해 보라. 키를 하나 더 켤 때마다 그룹 수는 그 컬럼이 ' +
      '가진 값의 개수만큼 늘어난다(실제로 나타나는 조합만 그룹이 된다). 적어도 하나의 키는 켜져 있어야 한다.'
    ));

    var ORDER = ['Pclass', 'Sex', 'Embarked'];
    var LABELS = { Pclass: '좌석 등급 (Pclass)', Sex: '성별 (Sex)', Embarked: '승선 항구 (Embarked)' };
    var active = { Pclass: true, Sex: true, Embarked: false };
    var body = UI.el('div');

    ORDER.forEach(function (k) {
      var t = UI.toggle({
        label: LABELS[k], value: active[k],
        onChange: function (on) {
          if (!on) {
            var remaining = ORDER.filter(function (kk) { return kk === k ? false : active[kk]; });
            if (remaining.length === 0) {
              t.setAttribute('aria-pressed', 'true');   // 최소 1개는 켜져 있어야 한다 — 되돌린다
              return;
            }
          }
          active[k] = on;
          rebuild();
        }
      });
      box.appendChild(t);
    });
    box.appendChild(body);

    function pivotTable(df, groups, keys) {
      var rowVals = uniqueSorted(groups.map(function (gr) { return gr.key[0]; }));
      var colVals = uniqueSorted(groups.map(function (gr) { return gr.key[1]; }));
      var cellMap = {};
      groups.forEach(function (gr) {
        var sub = df.take(gr.rows);
        cellMap[gr.key[0] + '||' + gr.key[1]] = sub.col('Age').mean();
      });

      var cols = [{ key: 'row', label: keys[0] }];
      colVals.forEach(function (cv, i) {
        cols.push({ key: 'c' + i, label: keys[1] + ' = ' + String(cv), digits: 2 });
      });
      var rows = rowVals.map(function (rv) {
        var r = { row: rv };
        colVals.forEach(function (cv, i) {
          var v = cellMap[rv + '||' + cv];
          r['c' + i] = v === undefined ? NaN : v;
        });
        return r;
      });

      var wrap = UI.el('div');
      wrap.appendChild(UI.el('div.panel-title', {
        text: keys[0] + ' × ' + keys[1] + ' 별 Age 평균 — unstack() 이 하는 일을 표로 직접 재배치'
      }));
      wrap.appendChild(UI.table(cols, rows));
      wrap.appendChild(UI.note(
        '세로로 긴 groupby([' + keys.join(', ') + "])['Age'].mean() 결과를, 두 번째 키(" + keys[1] +
        ')를 열로 옮겨 익숙한 가로세로 표 모양으로 바꾼 것이다. 키가 정확히 2개일 때만 이렇게 2차원으로 펼 수 있다.'
      ));
      return wrap;
    }

    function flatTable(df, groups, keys) {
      var cols = keys.map(function (k, i) { return { key: 'k' + i, label: k }; });
      cols.push({ key: 'n', label: '행 수' });
      cols.push({ key: 'ageMean', label: 'Age 평균', digits: 2 });

      var rows = groups.map(function (gr) {
        var r = {};
        keys.forEach(function (k, i) { r['k' + i] = gr.key[i]; });
        r.n = gr.rows.length;
        r.ageMean = df.take(gr.rows).col('Age').mean();
        return r;
      });

      var wrap = UI.el('div');
      wrap.appendChild(UI.el('div.panel-title', { text: keys.join(' × ') + ' 조합별 그룹' }));
      wrap.appendChild(UI.table(cols, rows));
      wrap.appendChild(UI.note(
        keys.length === 1
          ? '키가 하나뿐이면 표를 재배치할 필요가 없다. 이 형태 그대로가 groupby 의 결과다.'
          : '키가 3개면 2차원 표 하나로는 다 담을 수 없어 조합을 한 줄씩 나열했다 ' +
            '(pandas 라면 세 단계짜리 MultiIndex Series 형태로 나온다).'
      ));
      return wrap;
    }

    function rebuild() {
      UI.clear(body);
      var df = LabData.frame('titanic');
      var keys = ORDER.filter(function (k) { return active[k]; });
      var g = df.groupby(keys);
      var groups = g.groups();

      var theoretical = keys.reduce(function (p, k) { return p * df.col(k).nunique(); }, 1);
      body.appendChild(UI.note(
        '선택한 키: ' + keys.join(' × ') + '. 각 컬럼이 가질 수 있는 값의 개수를 곱하면 이론상 최대 ' +
        theoretical + '개 조합이 나올 수 있는데, 데이터에 실제로 나타난 조합은 ' + groups.length + '개다' +
        (groups.length < theoretical ? ' — 일부 조합은 이 데이터에 아예 존재하지 않는다.' : '.')
      ));

      var totalInGroups = groups.reduce(function (s, gr) { return s + gr.rows.length; }, 0);
      var totalRows = df.shape[0];
      if (totalInGroups < totalRows) {
        var naKeys = keys.filter(function (k) { return df.col(k).count() < totalRows; });
        body.appendChild(UI.danger('그룹 크기의 합이 전체 행 수보다 작다',
          '그룹에 들어간 행을 모두 더하면 ' + totalInGroups + '행인데 전체는 ' + totalRows + '행이다(차이 ' +
          (totalRows - totalInGroups) + '행). ' +
          (naKeys.length ? naKeys.join(', ') + ' 열에 결측값이 있는 행은 그룹을 나눌 키 자체가 없어 ' +
            '어느 그룹에도 들어가지 못했다.' : '선택한 키 중 결측이 있는 컬럼 때문이다.') +
          ' 이것이 "조용한 데이터 손실" 이다 — 그룹별 합계를 냈는데 전체 합과 안 맞으면 이 경우를 의심하라.'));
      } else {
        body.appendChild(UI.note('선택한 키에는 결측이 없어 전체 ' + totalRows + '행이 모두 그룹에 들어갔다.'));
      }

      body.appendChild(keys.length === 2 ? pivotTable(df, groups, keys) : flatTable(df, groups, keys));
    }

    rebuild();
    return box;
  }

  // ──────────────────────────────────────────────────────────── 시뮬레이터 ④

  /* agg 로 컬럼마다 다른 집계 — ★ 같은 컬럼을 딕셔너리(객체)에 두 번 키로 쓰면
   * 나중 값이 앞의 값을 덮어써서 하나가 조용히 사라진다. */
  function simAggDict() {
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ④ agg 로 컬럼마다 다른 집계' }));
    box.appendChild(UI.note(
      '컬럼마다 원하는 집계 함수를 골라 g.agg({...}) 에 한 번에 넘겨 보라. 컬럼 수만큼 다른 통계가 ' +
      '한 표에 나온다.'
    ));

    var key = 'Pclass';
    var aggAge = 'max', aggFare = 'mean', aggSibSp = 'sum';
    var body = UI.el('div');

    box.appendChild(UI.buttonGroup(KEY_COLS, {
      label: '기준 컬럼', selected: 0, onChange: function (v) { key = v; rebuild(); }
    }));
    box.appendChild(UI.buttonGroup(AGG_FUNCS, {
      label: 'Age 에 적용할 집계', selected: 2, onChange: function (v) { aggAge = v; rebuild(); }
    }));
    box.appendChild(UI.buttonGroup(AGG_FUNCS, {
      label: 'Fare 에 적용할 집계', selected: 0, onChange: function (v) { aggFare = v; rebuild(); }
    }));
    box.appendChild(UI.buttonGroup(AGG_FUNCS, {
      label: 'SibSp 에 적용할 집계', selected: 1, onChange: function (v) { aggSibSp = v; rebuild(); }
    }));
    box.appendChild(body);

    function rebuild() {
      UI.clear(body);
      var df = LabData.frame('titanic');
      var g = df.groupby(key);
      var spec = { Age: aggAge, Fare: aggFare, SibSp: aggSibSp };
      var result = g.agg(spec);

      body.appendChild(UI.el('div.panel-title', {
        text: "g.agg({Age: '" + aggAge + "', Fare: '" + aggFare + "', SibSp: '" + aggSibSp + "'})"
      }));
      body.appendChild(UI.frameTable(result, { digits: 4 }));
      body.appendChild(UI.note('세 컬럼에 서로 다른 집계를 한 번에 걸었다 — 컬럼마다 원하는 통계가 다를 때 쓰는 형태다.'));

      // ★ 같은 컬럼을 두 번 키로 쓰면 나중 값만 남는다 — 실제 자바스크립트 객체 리터럴로 재현
      var demoSpec = { Age: 'max', Age: 'mean', Fare: 'mean' };   // eslint-disable-line no-dupe-keys
      var demoResult = g.agg(demoSpec);

      body.appendChild(UI.el('div.panel-title', { text: '함정 — 같은 컬럼을 딕셔너리에 두 번 쓰면?' }));
      body.appendChild(UI.note(
        "agg_format2 = {'Age': 'max', 'Age': 'mean', 'Fare': 'mean'} 를 그대로 실행하면, groupby 가 보기도 " +
        '전에 딕셔너리 리터럴 자체가 같은 키를 나중 값으로 덮어써 버린다(자바스크립트 객체도 똑같다 — ' +
        '이 화면은 자바스크립트로 같은 상황을 그대로 재현했다). 지금 agg_format2 를 그대로 찍어 보면:'
      ));
      body.appendChild(UI.code(
        "agg_format2 = {'Age': 'max', 'Age': 'mean', 'Fare': 'mean'}\nagg_format2",
        { output: pyDictRepr(demoSpec) }
      ));
      body.appendChild(UI.danger("'Age: max' 가 흔적도 없이 사라졌다",
        "agg_format2 는 이미 {'Age': 'mean', 'Fare': 'mean'} 이 되어 있다. groupby(...).agg(agg_format2) 를 " +
        '실행하면 아래처럼 Age 최댓값은 어디에도 없고 평균만(그것도 한 번) 나온다. 에러도 경고도 없어서 ' +
        '딕셔너리를 다시 읽어 보지 않으면 최댓값이 빠졌다는 사실조차 알아채기 어렵다.'));
      body.appendChild(UI.frameTable(demoResult, { digits: 4 }));

      // 해결책 — 컬럼 이름을 나눠 따로따로 집계한 뒤 합친다 (pandas 의 키워드 인자 형태에 대응)
      var ageMax = g.aggCol('Age', 'max');
      var ageMean = g.aggCol('Age', 'mean');
      var fareMean = g.aggCol('Fare', 'mean');
      var fixed = DF.frame({
        age_max: ageMax.toArray(),
        age_mean: ageMean.toArray(),
        fare_mean: fareMean.toArray()
      }, { index: ageMax.labels() });

      body.appendChild(UI.el('div.panel-title', { text: '해결책 — 결과 컬럼 이름을 나눠서 각각 집계' }));
      body.appendChild(UI.note(
        '같은 원본 컬럼(Age)에 여러 집계를 걸고 싶다면 딕셔너리 키를 결과 컬럼 이름으로 바꿔 각각 ' +
        "집계한 뒤 합친다(age_max, age_mean). 키 충돌 자체가 일어날 수 없다."
      ));
      body.appendChild(UI.frameTable(fixed, { digits: 4 }));
    }

    rebuild();
    return box;
  }

  // ──────────────────────────────────────────────────────────── 확인 문제

  function quizSection() {

    wrap.appendChild(UI.el('div.panel-title', { text: '확인 문제' }));

            '작게 나온다. groupby 뒤에서도 "결측값은 집계에서 빠진다" 는 규칙이 그대로 적용된다.'
        },
        {
          label: '같은 DataFrame 인데 Fare 열의 행 수가 Age 열보다 원래 더 많기 때문이다', correct: false,
          why: '같은 titanic DataFrame 의 두 열이므로 전체 행 수(길이)는 같다. count() 차이는 결측값 때문이다.'
        },
        {
          label: '두 컬럼을 서로 다른 기준으로 그룹 지었기 때문이다', correct: false,
          why: "같은 groupby('Pclass') 결과에 대해 두 컬럼을 나란히 집계한 것이다. 그룹 기준은 같다."

    }));

    wrap.appendChild(UI.quiz({
      question: "titanic.groupby('Embarked').size() 의 합은 " + embSizeSum + '인데 titanic.shape[0] 은 ' +
        totalRows + '이다. ' + embMissing + '행이 차이 나는 이유는 무엇이며, 전체 행을 다 세려면 어떻게 해야 하는가?',
      choices: [
        {
          label: 'Embarked 가 결측인 행은 기본값(dropna=True) 때문에 그룹에서 통째로 빠진다. dropna=False 를 주면 NaN 그룹이 추가되어 합이 맞는다', correct: true,
          why: 'groupby() 의 기본값은 그룹을 나누는 기준 컬럼이 결측인 행을 제외한다. dropna=False 를 주면 ' +
            'NaN 이라는 별도 그룹이 생겨 합이 전체 행 수와 같아진다.'
        },
        {
          label: 'size() 계산이 잘못됐다', correct: false,
          why: '계산은 정확하다. 결측 키를 가진 행이 조용히 빠지는 것이 pandas groupby 의 기본 동작이다.'
        },
        {
          label: 'Embarked 열의 값 중 일부가 중복되어 있어서다', correct: false,
          why: '중복 값은 오히려 정상적으로 하나의 그룹으로 합쳐질 뿐 행이 사라지지 않는다. 행이 사라지는 이유는 결측(NaN) 키다.'
        }
      ]
    }));

    wrap.appendChild(UI.quiz({
      question: "{Age: 'max', Age: 'mean', Fare: 'mean'} 처럼 딕셔너리(객체)에 같은 컬럼 이름을 키로 두 번 쓰면 " +
        '두 집계를 다 구할 수 있는가?',
      choices: [
        {
          label: "아니다 — groupby 가 보기도 전에 객체 리터럴 자체가 나중 값으로 덮어써서 'Age: max' 는 사라진다", correct: true,
          why: "객체(딕셔너리)가 만들어지는 순간 이미 {Age: 'mean', Fare: 'mean'} 이 되어 있다. groupby().agg() 는 " +
            '이 덮어써진 결과만 본다. 해결하려면 결과 컬럼 이름을 나눠(age_max, age_mean) 각각 집계해야 한다.'
        },
        {
          label: '그렇다 — groupby 가 같은 컬럼에 걸린 값을 배열로 알아서 모아 준다', correct: false,
          why: '모아주지 않는다. 나중에 쓴 값이 앞의 값을 그냥 지운다. 배열로 모으려면 애초에 같은 키를 두 번 쓰면 안 된다.'
        },
        {
          label: '에러가 나서 코드가 멈춘다', correct: false,
          why: '에러도 경고도 없다. 그래서 딕셔너리를 다시 확인해 보지 않으면 최댓값이 빠진 것을 알아채기 어렵다.'
        }
      ]
    }));

    return wrap;
  }
})();

/* ===== modules/ch12-merge.js ===== */
/* ch12-merge.js — 12장. 표를 합치기: concat 과 merge (교재 12장, pandas.md 4679~5083줄)
 * IIFE 로 완전히 감싸 전역을 공유하지 않는다. render 는 여러 번 호출될 수 있으므로
 * 가변 상태는 전부 render 안의 지역 변수(각 시뮬레이터의 st 객체)에 둔다(API.md §1 ②).
 *
 * concat 은 "같은 모양의 표를 세로로 쌓는다", merge 는 "다른 표를 키로 옆에 잇는다" — 이 둘을
 * 구분하지 못하면 행이 왜 늘거나 줄었는지 설명할 수 없다. 표는 전부 UI.frameTable/UI.table 로
 * 그린다 — 직접 표를 그리지 않는다. 색은 API.md §1 ③ 대로 원본=파랑/사본=주황/결과=초록만 쓴다.
 */
(function () {
  'use strict';

  // ──────────────────────────────────────────────────────────── 순수 도우미
  // (상태가 없는 계산·설정 자료만 모듈 스코프에 둔다. ch06-align.js 의 OPS 와 같은 패턴.)

  var HOW_OPTIONS = [
    { label: 'inner (기본)', value: 'inner' },
    { label: 'left', value: 'left' },
    { label: 'right', value: 'right' },
    { label: 'outer', value: 'outer' }
  ];

  /* merge 시뮬레이터 ②·③ 이 함께 쓰는 예제 모음. 교재 12.3절의 예제를 기본값으로 둔다. */
  var PRESETS_MERGE = [
    { label: '교재 예제 (a,b,c ↔ b,c,d)', leftKeys: ['a', 'b', 'c'], leftVals: [1, 2, 3], rightKeys: ['b', 'c', 'd'], rightVals: [20, 30, 40] },
    { label: '완전히 겹침 (a,b,c ↔ a,b,c)', leftKeys: ['a', 'b', 'c'], leftVals: [1, 2, 3], rightKeys: ['a', 'b', 'c'], rightVals: [10, 20, 30] },
    { label: '전혀 안 겹침 (a,b,c ↔ x,y,z)', leftKeys: ['a', 'b', 'c'], leftVals: [1, 2, 3], rightKeys: ['x', 'y', 'z'], rightVals: [10, 20, 30] },
    { label: '왼쪽이 더 좁음 (a,b ↔ a,b,c,d)', leftKeys: ['a', 'b'], leftVals: [1, 2], rightKeys: ['a', 'b', 'c', 'd'], rightVals: [10, 20, 30, 40] }
  ];

  /* how 네 가지를 전부 돌려서 결과 행 수를 계산한다. 순수 함수 — 새 merge 를 매번 새로 계산할 뿐
   * 어느 쪽도 바꾸지 않는다. HOW_OPTIONS 와 같은 순서로 반환해서 표 하이라이트 인덱스를 맞춘다. */
  function computeHowCounts(left, right, on) {
    return HOW_OPTIONS.map(function (h) {
      return { how: h.value, rows: left.merge(right, { on: on, how: h.value }).shape[0] };
    });
  }

  function makeKeyFrame(keys, vals, valCol) {
    var obj = {};
    obj.key = keys.slice();
    obj[valCol] = vals.slice();
    return DF.frame(obj, { columns: ['key', valCol] });
  }

  Lab.register({
    id: 'ch12-merge',
    num: 12,
    title: '표를 합치기 — concat 과 merge',
    subtitle: '같은 모양의 표는 세로로 쌓고(concat), 다른 표는 공통 열(키)로 옆에 잇는다(merge)',

    render: function (root) {
      root.appendChild(simConcat());
      root.appendChild(simMergeHow());
      root.appendChild(simMatchTrace());
      root.appendChild(simDuplicateKeys());
      root.appendChild(simCommonMistakes());
      root.appendChild(quizSection());
    }
  });

  // ───────────────────────────────── 시뮬레이터 ① concat — 세로로 쌓기

  function simConcat() {
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ① concat — 세로로 쌓기' }));
    box.appendChild(UI.note(
      'titanic 데이터를 두 조각으로 잘라 train.csv/test.csv 두 파일을 흉내낸다. 두 조각 모두 자기 파일인 ' +
      '것처럼 인덱스를 0부터 다시 매겨서, 실제로 파일 두 개를 각각 읽었을 때와 같은 상황을 만든다.'
    ));

    var DROP_CHOICES = [
      { label: '컬럼 구성 그대로', value: null },
      { label: "조각 B 에서 'Survived' 빼기", value: 'Survived' },
      { label: "조각 B 에서 'Pclass' 빼기", value: 'Pclass' }
    ];

    var st = { n: 4, m: 4, dropCol: null, ignoreIndex: false, addSource: false };
    var body = UI.el('div');

    box.appendChild(UI.slider({
      label: '조각 A 행 수 (n)', min: 2, max: 8, value: st.n,
      onChange: function (v) { st.n = v; rebuild(); }
    }));
    box.appendChild(UI.slider({
      label: '조각 B 행 수 (m)', min: 2, max: 8, value: st.m,
      onChange: function (v) { st.m = v; rebuild(); }
    }));
    box.appendChild(UI.buttonGroup(
      DROP_CHOICES.map(function (d) { return { label: d.label, value: d.label }; }),
      { label: '조각 B 컬럼', selected: 0, onChange: function (v, i) { st.dropCol = DROP_CHOICES[i].value; rebuild(); } }
    ));
    box.appendChild(UI.toggle({
      label: 'ignore_index=True 사용', value: st.ignoreIndex,
      onChange: function (on) { st.ignoreIndex = on; rebuild(); }
    }));
    box.appendChild(UI.toggle({
      label: '출처 컬럼(source) 추가', value: st.addSource,
      onChange: function (on) { st.addSource = on; rebuild(); }
    }));
    box.appendChild(body);

    function rebuild() {
      UI.clear(body);
      var t = LabData.frame('titanic').cols(['PassengerId', 'Pclass', 'Name', 'Age', 'Survived']);
      var A = t.head(st.n);
      var B = t.islice(st.n, st.n + st.m).resetIndex({ drop: true });
      if (st.dropCol) B = B.drop(st.dropCol, { axis: 1 });
      if (st.addSource) {
        A.setCol('source', '조각A');
        B.setCol('source', '조각B');
      }

      body.appendChild(UI.frameTable(A, {
        frame: 'original', digits: 2,
        caption: '조각 A (train 역할) — ' + A.shape[0] + '행, 인덱스 0~' + (A.shape[0] - 1)
      }));
      body.appendChild(UI.frameTable(B, {
        frame: 'copy', digits: 2,
        caption: '조각 B (test 역할) — ' + B.shape[0] + '행, 인덱스 0~' + (B.shape[0] - 1) +
          (st.dropCol ? (", '" + st.dropCol + "' 컬럼 없음") : '')
      }));

      var combined = DF.concat([A, B], { ignoreIndex: st.ignoreIndex });
      body.appendChild(UI.code(
        'pd.concat([A, B]' + (st.ignoreIndex ? ', ignore_index=True' : '') + ')',
        { output: combined.toString(16) }
      ));
      body.appendChild(UI.frameTable(combined, {
        frame: 'result', digits: 2,
        caption: '결과 — ' + combined.shape[0] + '행 x ' + combined.shape[1] + '열'
      }));

      if (!st.ignoreIndex && combined.index.hasDuplicates()) {
        body.appendChild(UI.danger(
          '인덱스가 겹친다',
          '조각 A 와 조각 B 가 각자 0부터 인덱스를 다시 매겼기 때문에, 합친 표에도 같은 번호가 두 번 나온다. ' +
          '위의 ignore_index=True 토글을 켜서 비교해 보라.'
        ));
      } else if (st.ignoreIndex) {
        body.appendChild(UI.note('ignore_index=True 를 켜서 0부터 새로 번호를 매겼다. 인덱스가 겹치지 않는다.'));
      }

      if (st.dropCol) {
        var naCount = combined.col(st.dropCol).isna().sum();
        body.appendChild(UI.danger(
          "'" + st.dropCol + "' 열이 NaN 이 됐다",
          "조각 B 에는 '" + st.dropCol + "' 열이 아예 없었다. 합친 표에서 그 열의 결측 개수는 " + naCount +
          '개로, 정확히 조각 B 의 행 수(' + B.shape[0] + ')와 같다. 없는 열은 pandas 가 전부 NaN 으로 채운다.'
        ));
      }

      if (st.addSource) {
        body.appendChild(UI.note("source 열을 보면 각 행이 조각 A 에서 왔는지 B 에서 왔는지 바로 알 수 있다."));
      } else {
        body.appendChild(UI.note(
          '지금은 출처를 표시하는 열이 없다.' +
          (st.dropCol ? (" '" + st.dropCol + "' 열의 NaN 이 우연히 단서가 되지만, ") : ' ') +
          '두 조각의 컬럼 구성이 완전히 같았다면 어느 쪽에서 왔는지 합친 뒤에는 되돌릴 방법이 없다. ' +
          '위의 "출처 컬럼 추가" 토글을 켜서 비교해 보라.'
        ));
      }
    }

    rebuild();
    return box;
  }

  // ───────────────────────────────── 시뮬레이터 ② merge — how 네 가지

  function simMergeHow() {
    var st = { preset: 0, how: 'inner' };
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ② merge — how 네 가지' }));
    box.appendChild(UI.note(
      '작은 표 두 개를 key 로 잇는다. 891행짜리 표로는 무슨 일이 일어나는지 안 보이니 3~4행짜리로 본다. ' +
      'how 를 바꾸며 결과 행 수가 어떻게 달라지는지 확인하라.'
    ));

    box.appendChild(UI.buttonGroup(
      PRESETS_MERGE.map(function (p) { return { label: p.label, value: p.label }; }),
      { label: '예제', selected: st.preset, onChange: function (v, i) { st.preset = i; rebuild(); } }
    ));
    box.appendChild(UI.buttonGroup(HOW_OPTIONS, {
      label: 'how', selected: 0, onChange: function (v) { st.how = v; rebuild(); }
    }));

    var body = UI.el('div');
    box.appendChild(body);

    function rebuild() {
      UI.clear(body);
      var p = PRESETS_MERGE[st.preset];
      var left = makeKeyFrame(p.leftKeys, p.leftVals, 'L');
      var right = makeKeyFrame(p.rightKeys, p.rightVals, 'R');
      var result = left.merge(right, { on: 'key', how: st.how });

      body.appendChild(UI.frameTable(left, { frame: 'original', caption: 'left — key [' + p.leftKeys.join(', ') + ']' }));
      body.appendChild(UI.frameTable(right, { frame: 'copy', caption: 'right — key [' + p.rightKeys.join(', ') + ']' }));
      body.appendChild(UI.code("left.merge(right, on='key', how='" + st.how + "')", { output: result.toString() }));
      body.appendChild(UI.frameTable(result, { frame: 'result', caption: '결과 — ' + result.shape[0] + '행' }));

      var counts = computeHowCounts(left, right, 'key');
      body.appendChild(UI.el('div.panel-title', { text: 'how 별 결과 행 수' }));
      body.appendChild(UI.table(
        [{ key: 'how', label: 'how' }, { key: 'rows', label: '행 수' }],
        counts,
        { hlRows: [HOW_OPTIONS.map(function (h) { return h.value; }).indexOf(st.how)] }
      ));

      var naCells = 0;
      result.columns.forEach(function (c) { naCells += result.col(c).isna().sum(); });
      if (naCells > 0) {
        body.appendChild(UI.danger(
          '매칭되지 않은 자리는 NaN',
          "how='" + st.how + "' 결과에는 상대 쪽에 짝이 없는 키 자리가 있어 NaN 이 " + naCells + '칸 있다.'
        ));
      } else {
        body.appendChild(UI.note("how='" + st.how + "' 에서는 모든 자리가 양쪽 다 채워져서 NaN 이 없다."));
      }
    }

    rebuild();
    return box;
  }

  // ───────────────────────────────── 시뮬레이터 ③ 키 매칭을 표로 잇기 (DF.trace)

  function simMatchTrace() {
    var st = { preset: 0, how: 'inner' };
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ③ 키 매칭 들여다보기' }));
    box.appendChild(UI.note(
      'DF.trace 로 merge 가 실제로 어떤 왼쪽 행과 오른쪽 행을 짝지었는지 기록한다. -1 은 그 쪽에 짝이 ' +
      '없다는 뜻이다. how 를 바꾸며 짝의 수가 늘고 줄어드는 것을 보라.'
    ));

    box.appendChild(UI.buttonGroup(
      PRESETS_MERGE.map(function (p) { return { label: p.label, value: p.label }; }),
      { label: '예제', selected: st.preset, onChange: function (v, i) { st.preset = i; rebuild(); } }
    ));
    box.appendChild(UI.buttonGroup(HOW_OPTIONS, {
      label: 'how', selected: 0, onChange: function (v) { st.how = v; rebuild(); }
    }));

    var body = UI.el('div');
    box.appendChild(body);

    function rebuild() {
      UI.clear(body);
      var p = PRESETS_MERGE[st.preset];
      var left = makeKeyFrame(p.leftKeys, p.leftVals, 'L');
      var right = makeKeyFrame(p.rightKeys, p.rightVals, 'R');

      DF.trace.enable();
      left.merge(right, { on: 'key', how: st.how });
      var steps = DF.trace.get();
      DF.trace.disable();

      var mergeStep = null;
      steps.forEach(function (s) { if (s.kind === 'merge') mergeStep = s; });
      var matches = mergeStep ? mergeStep.detail.matches : [];

      body.appendChild(UI.frameTable(left, { frame: 'original', caption: 'left — key [' + p.leftKeys.join(', ') + ']' }));
      body.appendChild(UI.frameTable(right, { frame: 'copy', caption: 'right — key [' + p.rightKeys.join(', ') + ']' }));

      var rows = matches.map(function (pr, i) {
        return {
          order: i + 1,
          leftPos: pr[0] === -1 ? '—' : pr[0],
          leftKey: pr[0] === -1 ? 'NaN' : left.col('key').at(pr[0]),
          rightPos: pr[1] === -1 ? '—' : pr[1],
          rightKey: pr[1] === -1 ? 'NaN' : right.col('key').at(pr[1])
        };
      });
      body.appendChild(UI.table([
        { key: 'order', label: '순서' },
        { key: 'leftPos', label: '왼쪽 행 번호' },
        { key: 'leftKey', label: '왼쪽 key' },
        { key: 'rightPos', label: '오른쪽 행 번호' },
        { key: 'rightKey', label: '오른쪽 key' }
      ], rows, { frame: 'result', caption: "DF.trace 가 기록한 키 매칭 — " + matches.length + '쌍' }));

      body.appendChild(UI.note(
        '짝의 수(' + matches.length + '쌍)는 시뮬레이터 ②의 "how 별 결과 행 수" 표에서 how=' + "'" + st.how +
        "'" + ' 행과 같은 숫자다. how 를 바꿔 가며 표에서 짝이 늘고 줄어드는 것을 직접 세어 보라.'
      ));
    }

    rebuild();
    return box;
  }

  // ───────────────────────────────── 시뮬레이터 ④ ★ 키가 중복이면 행이 늘어난다

  function simDuplicateKeys() {
    var st = { leftDup: 2, rightDup: 2, how: 'inner' };
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ④ ★ 키가 중복이면 행이 늘어난다' }));
    box.appendChild(UI.note(
      "key='a' 가 왼쪽에 몇 개, 오른쪽에 몇 개 있는지 슬라이더로 조절해 보라. 겹치는 키는 곱집합으로 " +
      '전부 짝지어지므로 결과 행 수가 곱으로 늘어난다 — 6장의 인덱스 정렬과 완전히 같은 원리다.'
    ));

    box.appendChild(UI.slider({
      label: "왼쪽의 key='a' 개수", min: 1, max: 4, value: st.leftDup,
      onChange: function (v) { st.leftDup = v; rebuild(); }
    }));
    box.appendChild(UI.slider({
      label: "오른쪽의 key='a' 개수", min: 1, max: 4, value: st.rightDup,
      onChange: function (v) { st.rightDup = v; rebuild(); }
    }));
    box.appendChild(UI.buttonGroup(HOW_OPTIONS, {
      label: 'how', selected: 0, onChange: function (v) { st.how = v; rebuild(); }
    }));

    var body = UI.el('div');
    box.appendChild(body);

    function rebuild() {
      UI.clear(body);
      var leftKeys = [], leftVals = [], rightKeys = [], rightVals = [];
      for (var i = 0; i < st.leftDup; i++) { leftKeys.push('a'); leftVals.push(i + 1); }
      leftKeys.push('b'); leftVals.push(99);          // 왼쪽에만 있는 여분의 키
      for (var j = 0; j < st.rightDup; j++) { rightKeys.push('a'); rightVals.push((j + 1) * 10); }
      rightKeys.push('c'); rightVals.push(999);       // 오른쪽에만 있는 여분의 키

      var left = makeKeyFrame(leftKeys, leftVals, 'L');
      var right = makeKeyFrame(rightKeys, rightVals, 'R');
      var result = left.merge(right, { on: 'key', how: st.how });

      body.appendChild(UI.frameTable(left, { frame: 'original', caption: 'left — ' + left.shape[0] + '행' }));
      body.appendChild(UI.frameTable(right, { frame: 'copy', caption: 'right — ' + right.shape[0] + '행' }));
      body.appendChild(UI.code("left.merge(right, on='key', how='" + st.how + "')", { output: result.toString() }));
      body.appendChild(UI.frameTable(result, { frame: 'result', caption: '결과 — ' + result.shape[0] + '행' }));

      var expectedA = st.leftDup * st.rightDup;
      body.appendChild(UI.note(
        "key='a' 는 왼쪽 " + st.leftDup + '개 × 오른쪽 ' + st.rightDup + '개 = ' + expectedA + '쌍이 만들어진다. ' +
        '왼쪽이 바깥 루프, 오른쪽이 안쪽 루프를 돈다 — 6장의 곱집합과 같은 원리다.',
        '곱집합'
      ));

      if (result.shape[0] > Math.max(left.shape[0], right.shape[0])) {
        body.appendChild(UI.danger(
          '결과 행이 늘어났다',
          '왼쪽 ' + left.shape[0] + '행, 오른쪽 ' + right.shape[0] + '행인데 결과는 ' + result.shape[0] +
          "행이다. key='a' 가 중복된 자리에서 곱집합으로 짝지어졌기 때문이다. merge 후에는 항상 df.shape 로 " +
          '행 수를 확인하는 습관을 들여야 한다.'
        ));
      }
      if (st.how === 'left' && result.shape[0] > left.shape[0]) {
        body.appendChild(UI.danger(
          "how='left' 인데 늘었다",
          "how='left' 는 왼쪽 표를 다치지 않게 지킨다는 뜻이지 행 수를 그대로 지킨다는 뜻이 아니다. " +
          '오른쪽 key 가 중복되면 왼쪽의 그 행 하나가 여러 행으로 불어난다.'
        ));
      }
    }

    rebuild();
    return box;
  }

  // ───────────────────────────────── 흔한 실수

  function simCommonMistakes() {

      "'_y' 를 붙인다(위 결과의 컬럼 이름에서 확인). 실제 pandas 의 기본 접미사는 ('_x','_y') 라서 왼쪽도 " +

  // ───────────────────────────────── 확인 문제

  function quizSection() {
    var wrap = UI.el('div');
    wrap.appendChild(UI.el('div.panel-title', { text: '확인 문제' }));

    // 12-1 concat — 없는 컬럼은 NaN
    var qA = DF.frame({ id: [1, 2, 3], score: [10, 20, 30] }, { columns: ['id', 'score'] });
    var qB = DF.frame({ id: [4, 5], grade: ['A', 'B'] }, { columns: ['id', 'grade'] });
    var qConcat = DF.concat([qA, qB], { ignoreIndex: true });
    var qNaScore = qConcat.col('score').isna().sum();

    wrap.appendChild(UI.quiz({
      title: '확인 문제 12-1',
      question:
        'qA(' + qA.shape[0] + "행, 컬럼 [id, score])와 qB(" + qB.shape[0] + "행, 컬럼 [id, grade])를 " +
        'pd.concat([qA, qB], ignore_index=True) 로 합치면 score 열의 결측 개수는 몇 개인가?',
      choices: [
        { label: '0개', why: '오답이다. qB 에는 애초에 score 열이 없다. 없는 열은 값이 있고 없고를 떠나 그 행에서는 전부 결측이 된다.' },
        { label: qNaScore + '개', correct: true,
          why: "qB 에는 score 열 자체가 없어서, qB 에서 온 행 전부(" + qB.shape[0] + '행)가 결측이 된다. 그래서 정확히 qB 의 행 수와 같다.' },
        { label: (qA.shape[0] + qB.shape[0]) + '개', why: '오답이다. 이건 그냥 두 표의 행 수를 더한 값이다 — score 가 있는 qA 쪽 행은 결측이 아니다.' }
      ]
    }));

    // 12-2 merge outer — 교재 12.3절과 같은 예제
    var qLeft2 = DF.frame({ key: ['a', 'b', 'c'], L: [1, 2, 3] }, { columns: ['key', 'L'] });
    var qRight2 = DF.frame({ key: ['b', 'c', 'd'], R: [20, 30, 40] }, { columns: ['key', 'R'] });
    var qOuter2 = qLeft2.merge(qRight2, { on: 'key', how: 'outer' });
    var qInner2 = qLeft2.merge(qRight2, { on: 'key', how: 'inner' });

    wrap.appendChild(UI.quiz({
      title: '확인 문제 12-2',
      question:
        "left 의 key 가 [a,b,c], right 의 key 가 [b,c,d] 일 때 left.merge(right, on='key', how='outer') 는 몇 행이 되는가?",
      choices: [
        { label: qInner2.shape[0] + '행', why: "오답이다. 이건 how='inner'(교집합)의 행 수다. outer 는 합집합이라 더 넓다." },
        { label: (qLeft2.shape[0] + qRight2.shape[0]) + '행', why: '오답이다. 이건 그냥 두 표의 길이를 더한 값이다 — 겹치는 키(b, c)를 두 번 세면 안 된다.' },
        { label: qOuter2.shape[0] + '행', correct: true,
          why: "양쪽 key 의 합집합 [a,b,c,d] 만큼 행이 생긴다. inner(교집합)가 " + qInner2.shape[0] + '행인 것과 비교해 보라.' }
      ]
    }));

    // 12-3 merge 중복 키 — 곱집합 (교재 12.4절과 같은 예제)
    var qL3 = DF.frame({ key: ['a', 'a'], L: [1, 2] }, { columns: ['key', 'L'] });
    var qR3 = DF.frame({ key: ['a', 'a', 'a'], R: [10, 20, 30] }, { columns: ['key', 'R'] });
    var qM3 = qL3.merge(qR3, { on: 'key', how: 'inner' });

    wrap.appendChild(UI.quiz({
      title: '확인 문제 12-3',
      question:
        "left 의 key 가 ['a','a'](2개), right 의 key 가 ['a','a','a'](3개)일 때 how='inner' 로 merge 하면 몇 행이 되는가?",
      choices: [
        { label: (qL3.shape[0] + qR3.shape[0]) + '행', why: '오답이다. 이건 그냥 두 표의 행 수를 더한 값이다 — 실제로는 겹치는 key 끼리 곱집합을 계산해야 한다.' },
        { label: qM3.shape[0] + '행', correct: true,
          why: 'key=a 가 왼쪽 2개 × 오른쪽 3개 = ' + qM3.shape[0] + '쌍으로 짝지어진다. 6장에서 본 인덱스 정렬의 곱집합과 같은 규칙이다.' },
        { label: (qM3.shape[0] + 2) + '행', why: '오답이다.' }
      ]
    }));

    // 12-4 how=left 인데 행이 늘어난 경우 — 개념 확인 (교재 12.5절 ④)
    wrap.appendChild(UI.quiz({
      title: '확인 문제 12-4',
      question:
        "how='left' 로 merge 했는데 결과 행 수가 왼쪽 표보다 많이 나왔다. 무엇을 의심해야 하는가?",
      choices: [
        { label: '오른쪽 표의 key 가 중복됐다', correct: true,
          why: "how='left' 는 왼쪽의 key 를 전부 보존한다는 뜻이지 행 수를 유지한다는 뜻이 아니다. 왼쪽의 key 하나가 오른쪽에서 여러 번 매칭되면 그 하나가 여러 행으로 불어난다." },
        { label: '왼쪽 표의 key 가 중복됐다', why: "오답이다. 왼쪽 key 가 중복돼도 이미 왼쪽 표 자체에 그만큼의 행이 있었던 것이다 — 새로 늘어난 원인은 오른쪽의 중복이다." },
        { label: '이런 일은 일어날 수 없다 — 계산이 잘못된 것이다', why: 'how=left 라도 오른쪽 key 가 중복되면 행이 느는 것은 정상 동작이다. validate="many_to_one" 등으로 미리 확인하는 습관이 필요하다.' }
      ]
    }));

    return wrap;
  }
})();

/* ===== modules/ch13-notebook.js ===== */
/* ch13-notebook.js — 노트북이 거짓말할 때: 실행 순서와 상태 (교재 13장)
 * 이 장은 pandas API 가 아니라 "노트북의 출력은 지금 보이는 코드가 아니라 실행 이력의 결과다" 를
 * 가르친다. 그래서 시뮬레이터도 진짜 셀을 눌러 실행하는 가짜 노트북이어야 한다 — 절대 가짜
 * 출력을 문자열로 적지 않는다. 전부 render 호출마다 DF 엔진을 실제로 돌려서 만든다.
 * IIFE 로 감싸 전역을 공유하지 않는다. render 는 여러 번 호출될 수 있으므로(재방문),
 * 이 장의 핵심인 "노트북 상태" 자체도 render 안의 지역 변수에 둔다(API.md §1 ②).
 * 재방문하면 노트북은 깨끗한 초기 상태(커널을 새로 켠 것)로 돌아가야 한다.
 */
(function () {
  'use strict';

  // ═══════════════════════════════════════════════════ 시뮬레이터 ① 가짜 노트북 — 셀 정의

  /* 5개 셀. 코드는 고정이지만 결과는 실행 순서(상태)에 따라 달라진다.
   * exec(nb) 는 매번 nb.t(현재 커널의 변수 t)를 실제로 읽고 쓴다. */
  var CELL_DEFS = [
    { code: "t = pd.read_csv('train.csv')", label: '데이터 불러오기' },
    { code: "t['Age'] = t['Age'].fillna(0)", label: "원본을 바꾼다" },
    { code: "t['Age'].mean()", label: '②를 실행했는지에 따라 값이 달라진다' },
    { code: "t = pd.read_csv('train.csv')  # 다시 불러오기", label: '상태를 되돌린다' },
    { code: "t.drop('Age', axis=1)", label: 'inplace 없음 — 반환만 되고 원본에 남는다' }
  ];

  /* 아직 t 를 불러오지 않고 ②③⑤ 를 누르면 실제 노트북처럼 NameError 가 난다. */
  function requireT(nb) {
    if (!nb.t) throw new Error("NameError: name 't' is not defined — 위쪽의 '불러오기' 셀을 먼저 실행해야 한다");
  }

  var CELL_EXEC = [
    function (nb) {
      nb.t = LabData.frame('titanic').cols(['Age', 'Cabin']);
      return 't 를 불러왔다. t.shape = (' + nb.t.shape[0] + ', ' + nb.t.shape[1] + ')';
    },
    function (nb) {
      requireT(nb);
      nb.t.setCol('Age', nb.t.col('Age').fillna(0));
      return "Age 의 결측을 0 으로 채웠다. 채운 뒤 남은 결측 수 = " + nb.t.col('Age').isna().sum();
    },
    function (nb) {
      requireT(nb);
      return "t['Age'].mean() = " + UI.fmt(nb.t.col('Age').mean(), 4);
    },
    function (nb) {
      nb.t = LabData.frame('titanic').cols(['Age', 'Cabin']);
      return 't 를 다시 불러왔다(원본 상태로 되돌아감). t.shape = (' + nb.t.shape[0] + ', ' + nb.t.shape[1] + ')';
    },
    function (nb) {
      requireT(nb);
      var d = nb.t.drop('Age', { axis: 1 });
      return '반환된 표의 컬럼: [' + d.columns.join(', ') + ']\n' +
        '원본 t 의 컬럼: [' + nb.t.columns.join(', ') + ']  (t = ... 재대입을 하지 않았다)';
    }
  ];

  /* 뒤섞어 실행 미리보기 — ①③②④⑤ 순서. ②(fillna)보다 ③(mean)을 먼저 눌러서
   * "화면 순서와 실행 순서가 다르면 무슨 일이 나는지" 를 한 번에 재현한다. */
  var SHUFFLE_ORDER = [0, 2, 1, 3, 4];

  function makeNotebook() {
    return {
      counter: 0,
      t: null,
      cells: CELL_DEFS.map(function () { return { runNo: null, output: null, error: null }; }),
      history: [],
      lastCheck: null
    };
  }

  function runCell(nb, i) {
    nb.counter++;
    var st = nb.cells[i];
    st.runNo = nb.counter;
    try {
      st.output = CELL_EXEC[i](nb);
      st.error = null;
    } catch (e) {
      st.output = null;
      st.error = e.message || String(e);
    }
    nb.history.push({ cell: i, runNo: st.runNo });
  }

  /* Restart & Run All — 커널을 완전히 비우고 ①→⑤ 를 한 번씩 순서대로 실행한다.
   * 실행 전에 화면에 떠 있던 값과 실행 후의 값을 비교해, 달라진 셀이 있으면 알려 준다. */
  function restartRunAll(nb) {
    var prev = nb.cells.map(function (c) { return { runNo: c.runNo, output: c.output, error: c.error }; });
    nb.counter = 0;
    nb.t = null;
    nb.cells = CELL_DEFS.map(function () { return { runNo: null, output: null, error: null }; });
    nb.history = [];
    for (var i = 0; i < CELL_DEFS.length; i++) runCell(nb, i);

    var hadPrevious = prev.some(function (p) { return p.runNo !== null; });
    var mismatches = [];
    if (hadPrevious) {
      for (var j = 0; j < CELL_DEFS.length; j++) {
        if (prev[j].runNo !== null &&
          (prev[j].output !== nb.cells[j].output || prev[j].error !== nb.cells[j].error)) {
          mismatches.push(j);
        }
      }
    }
    nb.lastCheck = { hadPrevious: hadPrevious, mismatches: mismatches };
  }

  function renderNotebook(nb, body) {
    UI.clear(body);

    CELL_DEFS.forEach(function (def, i) {
      var st = nb.cells[i];
      var box = UI.el('div', {
        style: { borderTop: '1px solid var(--border)', paddingTop: 'var(--sp-3)', marginTop: 'var(--sp-3)' }
      });
      box.appendChild(UI.el('div.panel-title', {
        text: '셀 ' + (i + 1) + ' · ' + def.label + '   —   In [' + (st.runNo === null ? ' ' : st.runNo) + ']'
      }));
      box.appendChild(UI.code(def.code, {
        output: st.error ? undefined : (st.output === null ? '(아직 실행되지 않음)' : st.output)
      }));
      if (st.error) box.appendChild(UI.danger('실행 오류', st.error));
      box.appendChild(UI.el('button', {
        text: '실행 ▶',
        onclick: function () { runCell(nb, i); renderNotebook(nb, body); }
      }));
      body.appendChild(box);
    });

    if (nb.history.length) {
      var histRows = nb.history.map(function (h) {
        return { cell: '셀 ' + (h.cell + 1), inn: 'In [' + h.runNo + ']' };
      });
      body.appendChild(UI.table(
        [{ key: 'cell', label: '클릭한 셀' }, { key: 'inn', label: '실행 번호' }],
        histRows, { caption: '지금까지의 실행 이력(클릭 순서)' }
      ));
    }

    var actions = UI.el('div', { style: { marginTop: 'var(--sp-4)' } });
    actions.appendChild(UI.el('button', {
      text: '뒤섞어서 실행해보기 (셀 1 → 3 → 2 → 4 → 5 순서)',
      onclick: function () {
        SHUFFLE_ORDER.forEach(function (i) { runCell(nb, i); });
        renderNotebook(nb, body);
      }
    }));
    actions.appendChild(UI.el('button', {
      text: 'Restart & Run All',
      onclick: function () { restartRunAll(nb); renderNotebook(nb, body); }
    }));
    actions.appendChild(UI.el('button', {
      text: '커널 초기화',
      onclick: function () {
        var fresh = makeNotebook();
        nb.counter = fresh.counter; nb.t = fresh.t; nb.cells = fresh.cells;
        nb.history = fresh.history; nb.lastCheck = fresh.lastCheck;
        renderNotebook(nb, body);
      }
    }));
    body.appendChild(actions);

    if (nb.lastCheck) {
      if (!nb.lastCheck.hadPrevious) {
        body.appendChild(UI.note('처음부터 순서대로 실행돼서 비교할 이전 상태가 없다.', 'Restart & Run All'));
      } else if (nb.lastCheck.mismatches.length === 0) {
        body.appendChild(UI.note(
          '방금 전 화면에 떠 있던 값과 지금 다시 순서대로 실행한 값이 전부 같다 — 이 노트북은 재현된다.',
          'Restart & Run All 결과'
        ));
      } else {
        var names = nb.lastCheck.mismatches.map(function (i) { return '셀 ' + (i + 1); }).join(', ');
        body.appendChild(UI.danger(
          '이 노트북은 재현되지 않는다',
          names + '의 출력이 Restart & Run All 이후 달라졌다. 방금 전 화면에 보이던 값은 위에서 아래로 ' +
          '한 번씩 실행한 결과가 아니라, 클릭한 순서가 만든 값이었다.'
        ));
      }
    }
  }

  // ═══════════════════════════════════════════════════ 시뮬레이터 ② 실행 카운트 읽기

  /* 교재 13.2절 표. titanic.ipynb 를 열어 각 셀의 실행 번호를 위치 순서대로 옮겨 적은 것 —
   * 실제 있었던 한 개 노트북의 기록이므로 값 자체는 고정이다. 그러나 "어디서 역전이 일어나는가"
   * 는 손으로 세어 적지 않고, 아래에서 배열을 순회해 계산한다. */
  var EXEC_LOG = [
    { pos: 8, code: "t['Age'] = t['Age'].fillna('0')", n: 16 },
    { pos: 9, code: "t['Cabin'].replace('S','C001')", n: 24 },
    { pos: 10, code: "t['Embarkded'] = t['Embarked']...(오타)", n: 18 },
    { pos: 11, code: "t.drop('Embarkded', axis=1)", n: 27 },
    { pos: 12, code: 'Y = ...', n: 28 },
    { pos: 13, code: 'X = ...', n: 29 },
    { pos: 14, code: 'X.head(3)', n: 30 },
    { pos: 15, code: 'Y.head()', n: 31 },
    { pos: 16, code: 'from sklearn.model_selection import train_test_split', n: 34 },
    { pos: 17, code: 'x_train, x_test, y_train, y_test = train_test_split(...)', n: 60 },
    { pos: 18, code: 'X_train.head()', n: 36 },
    { pos: 19, code: 'X_train.shape', n: 40 },
    { pos: 21, code: 'from sklearn.tree import DecisionTreeClassifier', n: 61 },
    { pos: 22, code: 'dt = DecisionTreeClassifier()', n: 63 },
    { pos: 23, code: 'dt.fit(x_train, y_train)', n: 64 },
    { pos: 24, code: 'dt.fit(X_train, Y_train)', n: 49 }
  ];

  /* 바로 앞 순서보다 번호가 작아지는 위치를 계산한다 — 이게 "역전" 이다. */
  function findReversals(log) {
    var idx = [];
    for (var i = 1; i < log.length; i++) if (log[i].n < log[i - 1].n) idx.push(i);
    return idx;
  }

  function renderExecLog(root) {
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ② 실행 카운트 읽기' }));
    box.appendChild(UI.note(
      "위에서 아래로 한 번씩만 실행했다면 In [ ] 번호는 항상 증가해야 한다. 아래 표는 교재가 " +
      "보여주는 titanic.ipynb 를 열어 위치 순서대로 번호를 옮겨 적은 것이다. 번호가 바로 앞보다 " +
      "작아지는 지점을 찾아보자 — 손으로 세지 않고 표에서 직접 계산한다."
    ));

    var reversals = findReversals(EXEC_LOG);
    var hlCells = [];
    reversals.forEach(function (i) {
      ['pos', 'code', 'n', 'flag'].forEach(function (k) { hlCells.push([i, k]); });
    });
    var rows = EXEC_LOG.map(function (e, i) {
      return {
        pos: e.pos + '번째 셀', code: e.code, n: e.n,
        flag: reversals.indexOf(i) !== -1 ? '◀ 역전 (바로 앞보다 번호가 작다)' : ''
      };
    });
    box.appendChild(UI.table(
      [{ key: 'pos', label: '노트북에서 위치' }, { key: 'code', label: '코드 요약' },
       { key: 'n', label: 'In [ ]' }, { key: 'flag', label: '비고' }],
      rows, { hlCells: hlCells, caption: 'titanic.ipynb 의 실행 번호(위치 순서대로)' }
    ));

    box.appendChild(UI.note(
      '번호가 거꾸로 간 지점은 계산해 보면 총 ' + reversals.length + '번이다(위 표에서 링으로 표시한 행). ' +
      '위에서 아래로 한 번씩만 실행됐다면 이런 역전은 있을 수 없다 — 이 노트북은 셀을 왔다 갔다 하며 ' +
      '고치고 다시 실행하기를 반복한 기록이고, 지금 화면에 남은 코드의 순서는 실행된 순서가 아니다.'
    ));
    root.appendChild(box);
  }

  // ═══════════════════════════════════════════════════ 시뮬레이터 ③ 유령 컬럼

  var GHOST_STEPS = [
    {
      label: "① t = 데이터 불러오기 (Embarked 컬럼만)",

      run: function (st) {
        st.d = st.t.drop('Embarkded', { axis: 1 });
        return "반환된 표의 컬럼: [" + st.d.columns.join(', ') + ']\n' +
          '원본 t 의 컬럼: [' + st.t.columns.join(', ') + ']';

  ];

  function renderGhostColumn(root) {
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ③ 유령 컬럼' }));
    box.appendChild(UI.note(

      "drop() 했지만 반환값을 다시 담지 않은 상황을 그대로 눌러 재현해 보자."
    ));

    var st = { step: 0, t: null, d: null };
    var body = UI.el('div');

    function rebuild() {
      UI.clear(body);
      for (var i = 0; i < st.step; i++) {
        var def = GHOST_STEPS[i];
        var out = def.__output;
        body.appendChild(UI.el('div.panel-title', { text: def.label }));
        body.appendChild(UI.code(def.code, { output: out }));
      }
      if (st.step < GHOST_STEPS.length) {
        body.appendChild(UI.el('button', {
          text: GHOST_STEPS[st.step].label + ' 실행 ▶',
          onclick: function () {
            var def = GHOST_STEPS[st.step];
            def.__output = def.run(st);
            st.step++;
            rebuild();
          }
        }));
      } else {
        body.appendChild(UI.frameTable(st.t, {
          maxRows: 5, caption: "원본 t — Embarked 와 Embarkded 가 둘 다 남아 있다"
        }));

          "값은 서로 같아 보이지만(둘 다 같은 값에서 나왔으니까) 컬럼은 분명히 둘이다. drop() 이 " +
          '가상으로만 지운다는 오해가 아니라(그건 7장에서 이미 바로잡았다 — drop 은 항상 새 표를 ' +
          '반환한다), t = t.drop(...) 처럼 재대입하지 않아서 원본이 그대로 남은 것이다. 오타 컬럼은 ' +
          '이후의 모든 셀에서 계속 따라다닌다.'
        ));
        body.appendChild(UI.el('button', {
          text: '초기화',
          onclick: function () { st.step = 0; st.t = null; st.d = null; rebuild(); }
        }));
      }
    }
    rebuild();
    box.appendChild(body);
    root.appendChild(box);
  }

    rebuild();
    box.appendChild(body);

 *

 * 한글이다(길이·직경·두께·전체무게·내장무게·껍질무게·나이테·순살무게). 두 사실 모두 화면에 밝힌다.
 *

  /* 엔진에 회귀가 없으므로 한 변수 최소제곱을 직접 구현한다.
   *   b = cov(x,y) / var(x),  a = mean(y) - b * mean(x),  R² = corr(x,y)²
   * scikit-learn 1.9.0 의 LinearRegression().fit(X,y).score(X,y) 와 abalone 전체 값으로
   * 8개 컬럼 전부 대조해 소수 10자리까지 일치를 확인했다(스크래치패드 reg_check.js/.py). */
  function simpleLinReg(x, y) {
    var n = x.length;
    var mx = 0, my = 0;
    for (var i = 0; i < n; i++) { mx += x[i]; my += y[i]; }
    mx /= n; my /= n;
    var covxy = 0, varx = 0, vary = 0;
    for (var j = 0; j < n; j++) {
      var dx = x[j] - mx, dy = y[j] - my;
      covxy += dx * dy; varx += dx * dx; vary += dy * dy;
    }
    covxy /= n; varx /= n; vary /= n;
    var b = covxy / varx;
    var a = my - b * mx;
    var r = covxy / Math.sqrt(varx * vary);
    return { a: a, b: b, r2: r * r, n: n };
  }

    var col = 'magType';
    var body = UI.el('div');
    wrap.appendChild(UI.buttonGroup(DTYPE_CHECK_COLS, {
      label: '컬럼 고르기', selected: 2, onChange: function (v) { col = v; rebuild(); }
    }));
    wrap.appendChild(body);

    function rebuild() {
      UI.clear(body);
      var eq = LabData.frame('earthquake');
      var s = eq.col(col);
      body.appendChild(UI.note("eq.col('" + col + "').dtype = '" + s.dtype + "'"));
      try {
        var converted = s.toNumeric();
        body.appendChild(UI.note(
          "toNumeric() 이 문제없이 끝났다. 변환된 첫 값: " + UI.fmt(converted.at(0), 4) +
          ' — 이 컬럼은 그대로 회귀에 넣어도 안전하다.'
        ));
      } catch (e) {
        body.appendChild(UI.danger(
          '숫자로 바꿀 수 없다',
          e.message + '  ' + col + ' 열의 값이 문자열이라 실수로 바꿀 방법이 없어서 엔진이 그 자리에서 ' +
          '멈춘 것이다(재현: sklearn 의 LinearRegression() 도 문자열 컬럼을 만나면 "could not convert ' +
          'string to float" 로 똑같이 멈춘다 — 교재 14.13절 ②).'
        ));
      }
    }
    rebuild();
    return wrap;
  }

  /* ③ ★ 데이터 누수 — 이 장의 가장 인상적인 시연 */
  function checkLeak() {
    var wrap = UI.el('div');
    wrap.appendChild(UI.el('div.panel-title', {
      text: '★★ 예측할 값이 입력에 섞여 있지 않은가 — 데이터 누수 (14.13절 ③)'
    }));
    var xCol = '전체무게';
    var body = UI.el('div');
    wrap.appendChild(UI.buttonGroup(X_CANDIDATES, {
      label: 'X 로 쓸 컬럼 하나 (단순 선형회귀라 하나씩 시험한다)', selected: 3,
      onChange: function (v) { xCol = v; rebuild(); }
    }));
    wrap.appendChild(body);

    function rebuild() {
      UI.clear(body);
      var ab = LabData.frame('abalone');
      var x = ab.col(xCol).toArray();
      var y = ab.col('순살무게').toArray();
      var res = simpleLinReg(x, y);

      body.appendChild(UI.el('div.panel-title', {
        text: '순살무게 ≈ ' + UI.fmt(res.a, 4) + ' + ' + UI.fmt(res.b, 4) + ' × ' + xCol
      }));
      body.appendChild(UI.table([
        { key: 'k', label: '값' },
        { key: 'v', label: '계산 결과', digits: 6 }
      ], [
        { k: '절편 a (mean(y) - b·mean(x))', v: res.a },
        { k: '기울기 b (cov(x,y) / var(x))', v: res.b },
        { k: 'R² (corr(x,y)²)', v: res.r2 },
        { k: '쓰인 행 수', v: res.n }
      ]));

      if (xCol === '순살무게') {
        body.appendChild(UI.danger(
          '데이터 누수 (data leakage)',
          'X 에 예측 대상인 순살무게 자신을 그대로 넣었다. R² = ' + UI.fmt(res.r2, 6) + ' — 정확히 1에 ' +
          '붙는다. 모델이 정답을 맞힌 게 아니라 그 열에 계수 1을 곱하는 것만으로 완벽한 답을 낸 것이다. ' +
          '실전에서는 열 이름이 이렇게 뻔하지 않으므로, R² 가 의심스러울 만큼 1에 가깝게 나오면 가장 먼저 ' +
          '입력 열 목록에 예측 대상이나 그 파생값이 섞여 있지 않은지 확인해야 한다.'
        ));
      } else {
        body.appendChild(UI.note(
          xCol + ' 하나만으로도 R² = ' + UI.fmt(res.r2, 4) + ' 로 순살무게 변화의 상당 부분을 설명한다. ' +
          '그래도 1.0 에는 못 미친다 — 위 버튼에서 "순살무게(누수)" 를 골라 무엇이 다른지 비교해 보라.'
        ));
      }

      // 산점도 — 실제 값(샘플)과 회귀선을 겹쳐 보여준다. 계열은 2개.
      var n = x.length;
      var step = Math.max(1, Math.floor(n / 200));
      var sampleIdx = [];
      for (var i = 0; i < n; i += step) sampleIdx.push(i);
      var actualPts = sampleIdx.map(function (idx) { return [x[idx], y[idx]]; });
      var lineXs = actualPts.map(function (p) { return p[0]; }).slice().sort(function (a, b) { return a - b; });
      var linePts = lineXs.map(function (xi) { return [xi, res.a + res.b * xi]; });
      body.appendChild(UI.note(
        '산점도에는 ' + n + '마리 중 ' + actualPts.length + '마리만 골라 그렸다(화면이 빽빽해지지 않게). ' +
        'a, b, R² 값 자체는 ' + n + '마리 전체로 계산한 값이다.'
      ));
      body.appendChild(UI.scatter([
        { name: '실제 값 (샘플)', points: actualPts },
        { name: '회귀선(예측값)', points: linePts }
      ], { title: xCol + ' 로 순살무게 예측', xLabel: xCol, yLabel: '순살무게' }));
    }
    rebuild();
    return wrap;
  }

  // ──────────────────────────────────────────────────────────── 시뮬레이터 ④

  /* 배운 것 한 장 정리 — 장 목록은 Lab.chapters() 로 엔진에서 읽는다. 손으로 적지 않는다. */
  function simSummary() {
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ④ 배운 것 한 장 정리' }));

    var chapters = Lab.chapters()
      .filter(function (c) { return c.num !== 14; })
      .slice()
      .sort(function (a, b) { return a.num - b.num; });

    var rows = chapters.map(function (c) {
      return { num: c.num, title: c.title, subtitle: c.subtitle || '' };
    });
    box.appendChild(UI.table([
      { key: 'num', label: '장' },
      { key: 'title', label: '개념' },
      { key: 'subtitle', label: '한 줄 요약' }
    ], rows));

    box.appendChild(UI.note('이 표의 num · title · 한 줄 요약은 전부 Lab.chapters() 로 각 장이 스스로 등록한 값을 읽은 것이다.'));
    box.appendChild(UI.buttonGroup(
      chapters.map(function (c) { return { label: c.num + '장 · ' + c.title, value: c.id }; }),
      { label: '그 장으로 이동', selected: 0, onChange: function (id) { Lab.go(id); } }
    ));
    return box;
  }

  // ──────────────────────────────────────────────────────────── 확인 문제

  function quizSection() {
    var wrap = UI.el('div');
    wrap.appendChild(UI.el('div.panel-title', { text: '확인 문제' }));

    var eq = LabData.frame('earthquake');
    var strong = eq.mask(eq.col('mag').gt(6));
    var abForLeak = LabData.frame('abalone');
    var xLeak = abForLeak.col('순살무게').toArray();
    var yLeak = abForLeak.col('순살무게').toArray();
    var leakRes = simpleLinReg(xLeak, yLeak);

    wrap.appendChild(UI.quiz({
      question: "strong = eq.mask(eq.col('mag').gt(6)) 로 강한 지진만 뽑아 새 프레임을 만든 뒤, " +
        "strong 의 값을 바꾸면 원본 eq 도 함께 바뀌는가?",
      choices: [
        {
          label: '아니다. mask() 는 항상 새 블록을 복사하므로 strong 을 바꿔도 eq 는 그대로다', correct: true,
          why: '7장에서 본 대로 mask()(불린 인덱싱)와 take() 는 항상 복사를 만든다. head()/islice() 같은 ' +
            '슬라이싱만 메모리를 공유한다 — 두 연산이 겉보기엔 비슷해 보여도 메모리 동작은 정반대다.'
        },
        {
          label: '그렇다. mask() 도 슬라이스처럼 메모리를 공유한다', correct: false,
          why: 'mask()(불린 조건)는 슬라이싱과 달리 항상 새 블록을 만든다. 슬라이싱(head, islice)만 공유한다.'
        },
        {
          label: '뽑힌 행 수가 원본의 절반을 넘으면 공유하고, 아니면 복사한다', correct: false,
          why: '행 수와 무관하다. mask() 는 조건 결과와 상관없이 항상 복사를, 슬라이싱은 항상 공유를 한다.'
        }
      ]
    }));

    wrap.appendChild(UI.quiz({
      question: 'abalone 데이터의 학습용 입력(X_train) 한 칸을 df.setLoc(...) 로 NaN 으로 바꾼 뒤 ' +
        'LinearRegression().fit(X_train, y_train) 을 그대로 부르면 무슨 일이 일어나는가?',
      choices: [
        {
          label: 'ValueError 가 나며 학습이 시작되지도 못한다', correct: true,
          why: '사이킷런의 LinearRegression 은 NaN 을 만나면 "Input X contains NaN" 이라는 예외를 내며 ' +
            '그 자리에서 멈춘다. 8장에서 배운 fillna/dropna 로 결측을 먼저 정리해야 통과한다.'
        },
        {
          label: '결측이 있는 행만 자동으로 건너뛰고 학습이 끝까지 된다', correct: false,
          why: 'LinearRegression 은 결측을 자동으로 건너뛰지 않는다. 에러 없이 넘어가려면 미리 fillna 나 ' +
            'dropna 로 직접 정리해야 한다.'
        },
        {
          label: '결측을 0으로 자동으로 채우고 경고만 낸다', correct: false,
          why: '경고로 끝나지 않는다. NaN 을 스스로 처리하지 않는 모델(LinearRegression)은 예외를 내며 ' +
            '멈춘다. 경고만 내고 넘어가는 것은 이 장의 사례가 아니라 pandas 3.0 의 ChainedAssignmentError 쪽이다.'
        }
      ]
    }));

    wrap.appendChild(UI.quiz({
      question: "eq.col('magType').toNumeric() 을 실행하면 무슨 일이 일어나는가? 원인은 무엇인가?",
      choices: [
        {
          label: 'ValueError 가 난다. magType 의 값이 문자열이라 숫자로 바꿀 방법이 없기 때문이다', correct: true,
          why: 'magType 은 dtype 이 str 인 컬럼이다. 문자열을 실수로 바꾸려는 시도가 실패하면 엔진은 ' +
            '"Unable to parse string" 예외를 던진다 — sklearn 이 "could not convert string to float" 로 ' +
            '멈추는 것과 같은 자리의 문제다.'
        },
        {
          label: '숫자로 바꿀 수 없는 값은 조용히 NaN 이 되고 나머지는 정상 변환된다', correct: false,
          why: '그렇게 동작하려면 toNumeric("coerce") 처럼 errors 를 직접 지정해야 한다. 기본값은 ' +
            '"raise" 라서 실패하면 예외를 던지고 멈춘다.'
        },
        {
          label: '아무 일도 일어나지 않고 원래 문자열이 그대로 반환된다', correct: false,
          why: 'toNumeric() 은 항상 숫자 Series 를 만들려고 시도한다. 실패하면(기본값 기준) 예외를 던지지, ' +
            '원래 값을 그대로 돌려주지 않는다.'
        }
      ]
    }));

    wrap.appendChild(UI.quiz({
      question: '전복 데이터에서 순살무게를 예측하는 회귀에 X 로 순살무게 자기 자신을 넣으면 R² 는 ' +
        '얼마가 되며, 왜 그런 값이 나오는가?',
      choices: [
        {
          label: '정확히 1.0 이 된다. 모델이 정답을 그대로 베꼈기 때문이다', correct: true,
          why: '실제로 계산해 보면 R² = ' + UI.fmt(leakRes.r2, 6) + '이다. 예측 대상 자신이 입력에 들어 ' +
            '있으면 그 열에 계수 1을 곱하는 것만으로 완벽한 답을 낼 수 있다. 이런 상황을 데이터 누수 ' +
            '(data leakage)라고 부른다.'
        },
        {
          label: '오히려 0에 가까워진다. 같은 값을 두 번 쓰면 모델이 혼란스러워지기 때문이다', correct: false,
          why: '반대다. 예측 대상을 입력에 그대로 넣으면 R² 는 오히려 완벽한 값(1.0)에 붙는다 — 모델이 ' +
            '잘한 게 아니라 답을 베낀 것이라 문제다.'
        },
        {
          label: '입력과 출력이 같은 열이라 계산 자체가 에러를 내며 멈춘다', correct: false,
          why: '에러도 경고도 나지 않는다. 그래서 더 위험하다 — 코드는 끝까지 돌고 R² 만 의심스럽게 ' +
            '완벽해진다. 이 장이 "R² 가 1에 너무 가까우면 입력 열부터 의심하라"고 가르치는 이유다.'
        }
      ]
    }));

    return wrap;
  }
})();
