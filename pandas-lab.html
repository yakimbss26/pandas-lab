      root.appendChild(UI.quiz({
        title: '확인 문제 3',
        question: 'issubclass(pd.Series, np.ndarray) 를 실행하면 무엇이 나오며, 그 이유는?',
        choices: [
          { label: 'True — Series 는 ndarray 의 자식클래스다', correct: false, why: '틀렸다. 실제로는 False 다. Series 의 __mro__ 에는 ndarray 가 아예 등장하지 않는다.' },
          { label: 'False — Series 는 ndarray 를 상속하지 않고 내부에 담고 있을 뿐이다', correct: true, why: 'Series 는 ndarray 를 상속(is-a)하는 게 아니라 ndarray 와 인덱스를 함께 담은 합성(composition) 구조다. 그래서 진짜 배열이 필요하면 .values 나 .to_numpy() 로 꺼내야 한다.' },
          { label: '파이썬 버전에 따라 다르다', correct: false, why: '버전과 무관하게 항상 False 다.' }
        ]
      }));

      root.appendChild(UI.quiz({
        title: '확인 문제 4',
        question: '정수만 있던 나이 배열 [27, 19, 31] (dtype: int64) 에 결측값을 하나 추가하면 dtype 은 어떻게 되는가?',
        choices: [
          { label: 'int64 그대로다', correct: false, why: 'NaN 은 정수 dtype 에 담을 수 없다. dtype 이 올라간다.' },
          { label: 'float64 로 바뀐다', correct: true, why: '넘파이의 NaN 은 실수 전용 값이라서, 정수 배열 전체가 float64 로 승격된다.' },
          { label: 'object 로 바뀐다', correct: false, why: 'object 로 가는 것은 문자열처럼 완전히 다른 타입이 섞였을 때다. 숫자 + 결측은 float64 로 충분하다.' }
        ]
      }));
    }
  });
})();

/* ===== modules/ch02-load.js ===== */
/* ch02-load.js — 2장. 데이터를 불러오고 첫눈에 파악하기
 *
 * 교재 2장(pandas.md 471~893줄)의 짝.
 * read_csv 로 얻은 DataFrame 을 열어 보지 않고 head/shape/dtypes/info/describe/value_counts 로
 * 첫인상을 파악하는 법을 다룬다. 이 파일이 대신 파일을 읽지는 않는다 —
 * LabData.frame() 이 이미 읽어 둔 DataFrame 을 그 자리에서 요약해 보여준다.
 *
 * ES 모듈 문법 금지 — 단일 파일 배포본에 인라인되므로 깨진다. IIFE 로 감싼다.
 */
(function () {
  'use strict';

  var DATASET_NAMES = ['titanic', 'ramen', 'abalone', 'earthquake'];
  var DATASET_LABEL = { titanic: '타이타닉', ramen: '라멘 평점', abalone: '전복', earthquake: '지진' };

  Lab.register({
    id: 'ch02-load',
    num: 2,
    title: '데이터를 불러오고 첫눈에 파악하기',
    subtitle: 'head · shape · dtypes · info() · describe() · value_counts() 로 파일을 열지 않고 파악한다',

    render: function (root) {
      root.appendChild(simDashboard());
      root.appendChild(simDescribe());
      root.appendChild(simCategory());
      root.appendChild(quizSection());
    }
  });

  // ──────────────────────────────────────────────────────────── 시뮬레이터 ①

  /* 데이터 첫인상 대시보드 — shape/info()/head(n) 를 데이터를 바꿔가며 본다. */
  function simDashboard() {
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ① 데이터 첫인상 대시보드' }));

    var current = 'titanic';
    var n = 5;
    var body = UI.el('div');

    box.appendChild(UI.buttonGroup(
      DATASET_NAMES.map(function (name) { return { label: DATASET_LABEL[name], value: name }; }),
      { label: '데이터', selected: 0, onChange: function (v) { current = v; rebuild(); } }
    ));
    var sliderRow = UI.slider({
      label: 'head(n) 의 n', min: 1, max: 10, value: n,
      onChange: function (v) { n = v; rebuild(); }
    });
    box.appendChild(sliderRow);
    box.appendChild(body);

    function rebuild() {
      UI.clear(body);
      var df = LabData.frame(current);
      var meta = LabData.sets[current];
      var rows = df.shape[0], cols = df.shape[1];

      body.appendChild(UI.note(
        meta.synthetic
          ? '이 데이터는 원본과 구조(행·열 수, 결측 개수, dtype)만 같고 값은 새로 만든 합성 데이터다.'
          : '이 데이터는 USGS 가 공개한 실제 지진 관측값이다(퍼블릭 도메인). 값을 그대로 쓴다.',
        meta.label
      ));

      body.appendChild(UI.note('df.shape = (' + rows + ', ' + cols + ')  ->  ' + rows + '행, ' + cols + '열'));

      // info() — 컬럼 / dtype / non-null / 결측 수
      var info = df.info();
      var infoRows = info.columns.map(function (c) {
        return { name: c.name, dtype: c.dtype, nonNull: c.nonNull, missing: rows - c.nonNull };
      });
      var missingCols = infoRows.filter(function (r) { return r.missing > 0; }).map(function (r) { return r.name; });
      var infoHl = [];
      infoRows.forEach(function (r, i) {
        if (r.missing > 0) {
          ['name', 'dtype', 'nonNull', 'missing'].forEach(function (k) { infoHl.push([i, k]); });
        }
      });

      body.appendChild(UI.el('div.panel-title', { text: 'df.info() — ' + info.indexDesc }));
      body.appendChild(UI.table([
        { key: 'name', label: '컬럼' },
        { key: 'dtype', label: 'dtype' },
        { key: 'nonNull', label: 'non-null' },
        { key: 'missing', label: '결측 수' }
      ], infoRows, { hlCells: infoHl }));

      body.appendChild(UI.note(
        missingCols.length
          ? '결측이 있는 컬럼: ' + missingCols.join(', ') + ' — 위 표에서 링(is-focus)으로 강조했다.'
          : '이 데이터에는 결측이 있는 컬럼이 없다.'
      ));

      // head(n) — 결측이 있는 컬럼은 head 표에서도 같은 방식으로 강조한다
      var headDf = df.head(n);
      var headHl = [];
      for (var i = 0; i < headDf.shape[0]; i++) {
        missingCols.forEach(function (col) { headHl.push([i, col]); });
      }
      body.appendChild(UI.el('div.panel-title', { text: 'df.head(' + n + ')' }));
      body.appendChild(UI.frameTable(headDf, { digits: 2, hlCells: headHl }));
    }

    rebuild();
    return box;
  }

  // ──────────────────────────────────────────────────────────── 시뮬레이터 ②

  /* describe() 해부기 — 8줄이 각각 무엇인지, std 의 ddof 가 무엇인지 본다. */
  function simDescribe() {
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ② describe() 해부하기' }));
    box.appendChild(UI.note('titanic 데이터는 원본과 구조만 같은 합성 데이터다.'));

    var NUM_COLS = [
      { label: '나이 (Age)', value: 'Age' },
      { label: '요금 (Fare)', value: 'Fare' },
      { label: '좌석 등급 (Pclass)', value: 'Pclass' },
      { label: '형제자매/배우자 수 (SibSp)', value: 'SibSp' },
      { label: '부모/자녀 수 (Parch)', value: 'Parch' }
    ];
    var current = 'Age';
    var body = UI.el('div');

    box.appendChild(UI.buttonGroup(NUM_COLS, {
      label: '숫자 컬럼', selected: 0, onChange: function (v) { current = v; rebuild(); }
    }));
    box.appendChild(body);

    function rebuild() {
      UI.clear(body);
      var df = LabData.frame('titanic');
      var s = df.col(current);
      var desc = s.describe();

      body.appendChild(UI.el('div.panel-title', { text: "df.col('" + current + "').describe()" }));
      body.appendChild(UI.seriesTable(desc, { digits: 4 }));

      var nums = s.toArray().filter(function (v) { return typeof v === 'number' && !isNaN(v); });
      var bins = s.nunique() <= 10 ? Math.max(1, s.nunique()) : 20;
      body.appendChild(UI.hist(s.toArray(), { title: current + ' 의 분포', bins: bins }));

      // describe() 의 사분위수가 히스토그램의 어느 구간인지 연결해 보여준다
      var lo = Math.min.apply(null, nums), hi = Math.max.apply(null, nums);
      var step = (hi - lo) / bins || 1;
      function binRange(v) {
        var k = Math.min(bins - 1, Math.floor((v - lo) / step));
        return UI.fmt(lo + k * step, 2) + ' ~ ' + UI.fmt(lo + (k + 1) * step, 2);
      }
      var q25 = s.quantile(0.25), q50 = s.median(), q75 = s.quantile(0.75);
      body.appendChild(UI.note(
        '25% 지점(' + UI.fmt(q25, 3) + ')은 히스토그램의 ' + binRange(q25) + ' 구간에, ' +
        '중앙값 50%(' + UI.fmt(q50, 3) + ')는 ' + binRange(q50) + ' 구간에, ' +
        '75% 지점(' + UI.fmt(q75, 3) + ')은 ' + binRange(q75) + ' 구간에 있다.'
      ));

      // ★ std 는 ddof=1 이 pandas 기본이다. numpy 의 np.std 기본값(ddof=0)과 다르다.
      var std1 = s.std();
      var std0 = s.std(0);
      body.appendChild(UI.el('div.panel-title', { text: 'std 는 ddof 에 따라 달라진다' }));
      body.appendChild(UI.table([
        { key: 'which', label: '호출' },
        { key: 'value', label: '표준편차', digits: 6 }
      ], [
        { which: 's.std()  — ddof=1 (pandas 기본, 표본 표준편차)', value: std1 },
        { which: 's.std(0) — ddof=0 (numpy 의 np.std 기본값)', value: std0 }
      ], {}));
      body.appendChild(UI.note(
        'describe() 의 std 행은 s.std() 와 같은 값(ddof=1)이다. numpy 의 np.std 는 기본값이 ddof=0 이라 ' +
        's.std(0) 과 같은, 조금 더 작은 값을 준다. 같은 이야기가 교재 10장에서 다시 나온다.'
      ));
    }

    rebuild();
    return box;
  }

  // ──────────────────────────────────────────────────────────── 시뮬레이터 ③

  /* 범주 확인기 — ramen.Country 로 'USA'/'United States' 분리 문제를 직접 본다. */
  function simCategory() {
    var box = UI.el('div.card');
    box.appendChild(UI.el('div.panel-title', { text: "시뮬레이터 ③ 범주 확인기 — ramen['Country']" }));
    box.appendChild(UI.note('ramen 데이터는 원본과 구조만 같은 합성 데이터라 개수는 교재와 다를 수 있다.'));

    var includeNA = false; // dropna=False 를 켰는가
    var body = UI.el('div');

    box.appendChild(UI.toggle({
      label: '결측도 세기 (dropna=False)', value: includeNA,
      onChange: function (on) { includeNA = on; rebuild(); }
    }));
    box.appendChild(body);

    function rebuild() {
      UI.clear(body);
      var df = LabData.frame('ramen');
      var country = df.col('Country');
      var vc = country.valueCounts({ dropna: !includeNA });

      body.appendChild(UI.note(
        "nunique() = " + country.nunique() + " — Country 열에는 서로 다른 문자열이 이만큼 있다는 뜻이다."
      ));

      var usaPos = vc.index.positions('USA');
      var usPos = vc.index.positions('United States');
      if (usaPos.length && usPos.length) {
        var usaCount = vc.at(usaPos[0]), usCount = vc.at(usPos[0]);
        body.appendChild(UI.danger('같은 나라, 다른 이름',
          "'USA' 는 " + usaCount + '건, ' + "'United States' 는 " + usCount + '건으로 따로 세어진다. ' +
          '실제로는 같은 나라의 데이터 ' + (usaCount + usCount) + '건인데 문자열이 달라 두 그룹으로 쪼개진다.'));
      }

      var items = [];
      for (var i = 0; i < Math.min(10, vc.length()); i++) {
        items.push({ label: vc.index.at(i) === null ? 'NaN' : String(vc.index.at(i)), value: vc.at(i) });
      }
      body.appendChild(UI.bar(items, { title: '상위 ' + items.length + '개국 — value_counts()', labelHeader: '국가', valueHeader: '건수' }));

      var hl = [];
      for (var j = 0; j < vc.length(); j++) {
        var lbl = vc.index.at(j);
        if (lbl === 'USA' || lbl === 'United States') { hl.push([j, 'idx']); hl.push([j, 'val']); }
      }
      body.appendChild(UI.el('div.panel-title', { text: '전체 value_counts()' }));
      body.appendChild(UI.seriesTable(vc, { hlCells: hl }));

      var styleMissing = df.col('Style').length() - df.col('Style').count();
      body.appendChild(UI.note(
        'Country 열에는 결측이 없다(count = ' + country.count() + ' / ' + country.length() + '). ' +
        '그래서 dropna 토글이 이 열의 결과를 바꾸지 않는다. 결측이 있는 열(Style, 결측 ' + styleMissing +
        '건)에서는 dropna=False 를 켜야 NaN 항목이 드러난다.'
      ));
    }

    rebuild();
    return box;
  }

  // ──────────────────────────────────────────────────────────── 확인 문제

  function quizSection() {
    var wrap = UI.el('div');
    wrap.appendChild(UI.el('div.panel-title', { text: '확인 문제' }));

    var titanic = LabData.frame('titanic');
    var ageCount = titanic.col('Age').count();
    var totalRows = titanic.shape[0];
    var embarkedMissing = titanic.col('Embarked').length() - titanic.col('Embarked').count();

    var ramen = LabData.frame('ramen');
    var country = ramen.col('Country');
    var nunique = country.nunique();
    var vc = country.valueCounts();
    var usaPos = vc.index.positions('USA');
    var usPos = vc.index.positions('United States');
    var usaCount = usaPos.length ? vc.at(usaPos[0]) : 0;
    var usCount = usPos.length ? vc.at(usPos[0]) : 0;

    wrap.appendChild(UI.quiz({
      question: "titanic 데이터에서 df.col('Age').count() 는 " + ageCount +
        '인데 df.shape[0] 은 ' + totalRows + '이다. 왜 두 값이 다른가?',
      choices: [
        {
          label: 'Age 열에 결측값이 있어서 count() 가 결측을 빼고 세기 때문이다', correct: true,
          why: 'Age 열은 ' + totalRows + '행 중 ' + (totalRows - ageCount) + '개가 결측이라 count() 는 ' +
            ageCount + '만 센다. shape[0] 은 결측 여부와 상관없이 전체 행 수다.'
        },
        {
          label: 'count() 는 열(컬럼)의 개수를 센다', correct: false,
          why: 'count() 는 한 컬럼(Series) 안에서 결측이 아닌 값의 개수를 센다. 열의 개수가 아니다.'
        },
        {
          label: '두 값은 원래 같아야 하는데 계산이 잘못됐다', correct: false,
          why: '계산은 정상이다. count() 와 shape[0] 이 다른 것은 버그가 아니라 결측값이 있다는 신호다.'
        }
      ]
    }));

    wrap.appendChild(UI.quiz({
      question: 't.describe 를 괄호 없이 실행하면 어떤 일이 벌어지는가?',
      choices: [
        {
          label: '통계표 대신 "이 메서드를 가리키는 객체" 가 출력된다', correct: true,
          why: 'describe 는 메서드이므로 반드시 () 를 붙여야 실행된다. 괄호를 빼면 <bound method ...> 같은 객체가 나온다.'
        },
        {
          label: '에러가 발생하며 즉시 멈춘다', correct: false,
          why: '에러도 경고도 없이 조용히 다른 것(메서드 객체)이 출력된다. 그래서 더 위험하다.'
        },
        {
          label: 'describe() 와 완전히 같은 표가 나온다', correct: false,
          why: '괄호가 없으면 함수가 호출되지 않는다. 통계표가 아니라 메서드 자체를 가리키는 객체가 나온다.'
        }
      ]
    }));

    wrap.appendChild(UI.quiz({
      question: 'value_counts() 의 기본값(dropna=True)으로 Embarked 열을 세면, 실제로 있는 결측 ' +
        embarkedMissing + '건은 결과에서 어떻게 되는가?',
      choices: [
        {
          label: '세지 않는다 — 결과에 아예 나타나지 않는다', correct: true,
          why: 'value_counts() 의 기본은 dropna=True 라서 결측은 처음부터 세지 않는다. dropna=False 를 줘야 ' +
            'NaN 이 ' + embarkedMissing + '건 있다는 게 드러난다.'
        },
        {
          label: 'NaN 이라는 이름의 항목으로 결과 맨 위에 나온다', correct: false,
          why: '기본값에서는 아예 나타나지 않는다. dropna=False 를 줘야 NaN 항목이 보이며, 위치도 개수 순서에 따른다.'
        },
        {
          label: '에러가 난다', correct: false,
          why: '에러 없이 조용히 빠진다. 그래서 기본값만 보고 "결측이 없다" 고 착각하기 쉽다.'
        }
      ]
    }));

    wrap.appendChild(UI.quiz({
      question: 'ramen 데이터의 Country 열에 nunique() 를 실행하면 ' + nunique + '가 나온다. 그런데 ' +
        "'USA'(" + usaCount + '건)와 ' + "'United States'(" + usCount + '건)는 사실 같은 나라다. ' +
        '이 상태로 나라별 통계를 내면 무슨 일이 생기는가?',
      choices: [
        {
          label: '같은 나라의 데이터가 두 그룹으로 쪼개진다', correct: true,
          why: '실제로는 ' + (usaCount + usCount) + '건의 같은 나라 데이터인데, 문자열이 다르다는 이유로 ' +
            usaCount + '건짜리와 ' + usCount + '건짜리 두 그룹으로 나뉜다.'
        },
        {
          label: 'pandas 가 알아서 같은 나라로 합쳐준다', correct: false,
          why: "pandas 는 문자열을 있는 그대로 비교한다. 'USA' 와 'United States' 는 전혀 다른 문자열이라 자동으로 합쳐지지 않는다."
        },
        {
          label: 'nunique() 결과가 잘못 계산된 것이다', correct: false,
          why: '계산은 정확하다. 열에 서로 다른 문자열이 ' + nunique + '가지 있다는 뜻이다. 문제는 그중 두 개가 사람 눈에는 같은 나라라는 점이다.'
        }
      ]
    }));

    return wrap;
  }
})();

/* ===== modules/ch03-series.js ===== */
/* ch03-series.js — Series: 인덱스를 가진 1차원 (교재 3장)
 * IIFE 로 완전히 감싸 전역을 공유하지 않는다. render 는 여러 번 호출될 수 있으므로
 * 가변 상태는 전부 render 안의 지역 변수에 둔다(API.md §1 ②).
 */
(function () {
  'use strict';

  var MAX_VALUES = 8;
  var MIN_VALUES = 1;
  var LETTERS = 'abcdefghijklmnopqrstuvwxyz';

  /* 인덱스 모드별 라벨 생성. '기본' 은 null 을 돌려줘서 DF.series 가 RangeIndex 를 쓰게 한다. */
  function indexLabelsFor(mode, n) {
    if (mode === 'str') {
      var out = [];
      for (var i = 0; i < n; i++) out.push(LETTERS[i % LETTERS.length]);
      return out;
    }
    if (mode === 'dup') {
      var out2 = [];
      for (var j = 0; j < n; j++) out2.push(LETTERS[Math.floor(j / 2) % LETTERS.length]);
      return out2;
    }
    return null;
  }

  Lab.register({
    id: 'ch03-series',
    num: 3,
    title: 'Series — 인덱스를 가진 1차원',
    subtitle: '값과 인덱스가 하나로 붙어 다니는 1차원 자료구조',

    render: function (root) {
      // ───────────────────────────────── 시뮬레이터 ① Series 조립기
      var values = [88, 92, 79];
      var indexMode = 'default';

      var box1 = UI.el('div.card');
      box1.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ① Series 조립기' }));
      box1.appendChild(UI.note(
        '값 목록과 인덱스를 각각 바꿔 보라. 값과 인덱스는 항상 같은 길이로 붙어 다닌다.'
      ));

      var valuesRow = UI.el('div.control-row');
      var body1 = UI.el('div');

      function nextDefault() {
        return values.length ? values[values.length - 1] + 1 : 50;
      }

      function renderValuesRow() {
        UI.clear(valuesRow);
        valuesRow.appendChild(UI.el('span.control-label', { text: '값' }));
        values.forEach(function (v, i) {
          var inp = UI.el('input', {
            type: 'number', value: v, style: { width: '64px' }
          });
          inp.addEventListener('input', function () {
            values[i] = inp.value === '' ? 0 : Number(inp.value);
            rebuild1();
          });
          valuesRow.appendChild(inp);
        });
        valuesRow.appendChild(UI.el('button', {
          text: '+ 값 추가',
          onclick: function () {
            if (values.length >= MAX_VALUES) return;
            values.push(nextDefault());
            renderValuesRow();
            rebuild1();
          }
        }));
        valuesRow.appendChild(UI.el('button', {
          text: '− 값 삭제',
          onclick: function () {
            if (values.length <= MIN_VALUES) return;
            values.pop();
            renderValuesRow();
            rebuild1();
          }
        }));
      }

      var modeRow = UI.buttonGroup(
        [{ label: '기본 (0,1,2…)', value: 'default' },
         { label: '문자 (a,b,c…)', value: 'str' },
         { label: '중복 (a,a,b…)', value: 'dup' }],
        {
          label: '인덱스',
          selected: 0,
          onChange: function (v) { indexMode = v; rebuild1(); }
        }
      );

      function rebuild1() {
        UI.clear(body1);
        var idx = indexLabelsFor(indexMode, values.length);
        var opts = { name: '값' };
        if (idx) opts.index = idx;
        var s = DF.series(values.slice(), opts);

        body1.appendChild(UI.seriesTable(s, { frame: 'result' }));
        body1.appendChild(UI.code('s.values', { output: '[' + s.toArray().join(', ') + ']' }));
        body1.appendChild(UI.code('s.index', { output: '[' + s.labels().join(', ') + ']' }));
        body1.appendChild(UI.code('s.dtype', { output: s.dtype }));

        if (indexMode === 'dup') {
          body1.appendChild(UI.note(
            '인덱스에 중복 라벨이 있다 — 6장에서 이게 왜 중요한지 본다(두 Series 를 더할 때 ' +
            '같은 라벨끼리 곱집합으로 짝지어져 행이 늘어난다).',
            '중복 인덱스'
          ));
        }
      }

      root.appendChild(box1);
      box1.appendChild(valuesRow);
      box1.appendChild(modeRow);
      box1.appendChild(body1);
      renderValuesRow();
      rebuild1();

      // ───────────────────────────────── 시뮬레이터 ② 인덱스 불변 실험
      var box2 = UI.el('div.card');
      box2.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ② 인덱스 불변 실험' }));

      var demo = DF.series([10, 20, 30], { index: ['x', 'y', 'z'], name: 'v' });
      // pandas 는 인덱스 라벨 배열을 직접 대입하지 못하게 막는다. 이 실습에서는
      // 라벨 배열을 실제로 freeze 해서, 건드리면 정말로 예외가 나게 만든다(연출이 아니라 실제 실패).
      Object.freeze(demo.index.labels);

      var body2 = UI.el('div');
      var resultBox2 = UI.el('div');

      function draw2() {
        UI.clear(body2);
        body2.appendChild(UI.seriesTable(demo, { frame: 'original' }));
      }

      var changeValBtn = UI.el('button', {
        text: "값 바꾸기 — s.loc['y'] = 99",
        onclick: function () {
          demo.setLoc('y', 99);
          draw2();
          UI.clear(resultBox2);
          resultBox2.appendChild(UI.note('성공했다. 값은 라벨을 통해 얼마든지 바꿀 수 있다.'));
        }
      });
      var changeIdxBtn = UI.el('button', {
        text: "인덱스 바꾸기 — s.index[0] = 'w'",
        onclick: function () {
          UI.clear(resultBox2);
          try {
            demo.index.labels[0] = 'w';
            resultBox2.appendChild(UI.note('바뀌었다 — 이 실습 엔진에서는 원래 일어나면 안 되는 일이다.'));
          } catch (e) {
            resultBox2.appendChild(UI.danger('TypeError', 'Index does not support mutable operations'));
            resultBox2.appendChild(UI.note(
              '인덱스는 여러 Series 나 DataFrame 이 동시에 참조하는 "이름표 대장" 이다. 몰래 라벨을 ' +
              '바꾸면 같이 쓰는 다른 객체가 전부 영향을 받으므로 pandas 가 원천적으로 막아 둔다. ' +
              '라벨을 바꾸려면 rename() 으로 새 객체를 만든다.'
            ));
          }
          draw2();
        }
      });

      root.appendChild(box2);
      box2.appendChild(UI.el('div.control-row', null, [changeValBtn, changeIdxBtn]));
      box2.appendChild(body2);
      box2.appendChild(resultBox2);
      draw2();

      // ───────────────────────────────── 확인 문제
      root.appendChild(UI.quiz({
        title: '확인 문제 3-1',
        question:
          "s = pd.Series([10,20,30], index=['x','y','z']) 다음 두 줄이 있다. " +
          "(1) s['y'] = 99   (2) s.index[0] = 'w' — 어느 줄에서 에러가 나는가?",
        choices: [
          { label: '(1)에서 에러가 난다', why: '틀렸다. 값을 바꾸는 (1)은 문제없이 실행된다. Series 의 값은 가변이다.' },
          { label: '(2)에서 에러가 난다', correct: true,
            why: "맞다. 인덱스는 불변이라 (2)에서 TypeError: Index does not support mutable operations 가 난다." },
          { label: '둘 다 에러가 난다', why: '틀렸다. (1)은 정상적으로 실행된다.' }
        ]
      }));

      root.appendChild(UI.quiz({
        title: '확인 문제 3-2',
        question: '"Series 는 numpy.ndarray 의 자식 클래스다" — 이 말은 왜 틀렸는가?',
        choices: [
          { label: 'Series 는 ndarray 를 상속하지 않고 내부에 담고 있을 뿐이다(합성)', correct: true,
            why: 'issubclass(pd.Series, np.ndarray) 는 False 다. Series 는 ndarray 를 합성으로 담고 있어서 ' +
                 '.values 나 .to_numpy() 로 명시적으로 꺼내야 한다.' },
          { label: 'Series 는 애초에 배열을 담지 않는다', why: '틀렸다. Series 는 내부에 실제로 numpy 배열을 담고 있다. .values 로 꺼낼 수 있다.' },
          { label: 'numpy 가 pandas 보다 나중에 만들어졌기 때문이다', why: '상속 여부와 만들어진 순서는 관계없다.' }
        ]
      }));

      root.appendChild(UI.quiz({
        title: '확인 문제 3-3',
        question: 'ex_series.values() 처럼 괄호를 붙여 호출하면 무슨 일이 벌어지는가?',
        choices: [
          { label: '정상적으로 배열을 반환한다', why: '.values 는 속성(property)이지 메서드가 아니므로 틀렸다.' },
          { label: "TypeError: 'numpy.ndarray' object is not callable 가 난다", correct: true,
            why: '.values 는 이미 배열을 반환하는 속성이다. 그 배열을 다시 함수처럼 호출하려 하면 이 에러가 난다.' },
          { label: '아무 일도 일어나지 않는다', why: '틀렸다. 에러가 난다.' }
        ]
      }));
    }
  });
})();

/* ===== modules/ch04-frame.js ===== */
/* ch04-frame.js — DataFrame: 여러 Series 의 집합 (교재 4장)
 * IIFE 로 완전히 감싸 전역을 공유하지 않는다. render 는 여러 번 호출될 수 있으므로
 * 가변 상태는 전부 render 안의 지역 변수에 둔다(API.md §1 ②).
 */
(function () {
  'use strict';

  /* .T 전치. DF 엔진에 .T 메서드가 없으므로 공개된 DF API 만으로 화면이 직접 계산한다. */
  function transpose(df) {
    var newCols = {}, newNames = [];
    var rowLabels = df.index.labels.map(function (l) { return String(l); });
    rowLabels.forEach(function (rl, i) {
      var col = [];
      df.columns.forEach(function (c) { col.push(df.col(c).at(i)); });
      newCols[rl] = col;
      newNames.push(rl);
    });
    return DF.frame(newCols, { columns: newNames, index: df.columns.slice() });
  }

  /* Copy-on-Write 시연에 쓸 컬럼/값을 고른다. 나이 처럼 숫자 컬럼이 남아있으면 그걸 쓴다. */
  function pickWriteCol(df) {
    return df.columns.indexOf('나이') !== -1 ? '나이' : df.columns[0];
  }
  function pickWriteValue(df, col) {
    return DF.isNumericDtype(df.col(col).dtype) ? 999 : '변경됨';
  }

  Lab.register({
    id: 'ch04-frame',
    num: 4,
    title: 'DataFrame — 여러 Series 의 집합',
    subtitle: '컬럼을 조립하고, drop 이 실제로 복사본을 반환하는지 확인한다',

    render: function (root) {
      // ───────────────────────────────── 시뮬레이터 ① DataFrame 조립기
      var POOL = [
        { name: '이름', values: ['학생A', '학생B', '학생C', '학생D'] },
        { name: '나이', values: [16, 17, 16, 17] },
        { name: '키', values: [162.5, 170.1, 158.4, 175.0] },
        { name: '재학', values: [true, true, false, true] }
      ];
      var st1 = { activeCount: 2, includeGrade: false, showT: false };

      var box1 = UI.el('div.card');
      box1.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ① DataFrame 조립기' }));
      box1.appendChild(UI.note(
        '컬럼을 하나씩 추가/삭제해 표를 키워 보고, columns= 에 없는 이름을 끼워 넣으면 ' +
        '무슨 일이 벌어지는지, .T 로 뒤집으면 dtype 이 어떻게 되는지 확인해 보라.'
      ));

      var body1 = UI.el('div');

      function buildFrame1() {
        var obj = {}, names = [];
        for (var i = 0; i < st1.activeCount; i++) {
          obj[POOL[i].name] = POOL[i].values.slice();
          names.push(POOL[i].name);
        }
        var columnsOpt = names.slice();
        if (st1.includeGrade) columnsOpt.push('성적');
        return DF.frame(obj, { columns: columnsOpt });
      }

      function rebuild1() {
        UI.clear(body1);
        var df = buildFrame1();
        var showDf = st1.showT ? transpose(df) : df;
        body1.appendChild(UI.frameTable(showDf, {
          frame: 'result', caption: st1.showT ? 'df.T (전치)' : 'df'
        }));

        if (!st1.showT) {
          var dtRows = df.columns.map(function (n) { return { col: n, dtype: df.col(n).dtype }; });
          body1.appendChild(UI.table(
            [{ key: 'col', label: '컬럼' }, { key: 'dtype', label: 'dtype' }],
            dtRows, { caption: 'df.dtypes()' }
          ));
        } else {
          var dt2 = showDf.dtypes();
          var kinds = {};
          Object.keys(dt2).forEach(function (k) { kinds[dt2[k]] = true; });
          body1.appendChild(UI.note(
            '전치 후 모든 컬럼(원래는 행)의 dtype 이 ' + Object.keys(kinds).join(', ') +
            ' 로 바뀌었다. 서로 다른 타입의 값들이 한 컬럼(원래는 한 행)에 같이 들어가야 하기 때문이다.'
          ));
        }

        if (st1.includeGrade) {
          var s = df.col('성적');
          body1.appendChild(UI.danger(
            "'성적' 컬럼",
            "obj 에 없는 이름을 columns= 에 넣었다. 에러 없이 실행되지만, 전체 " + df.nrows() +
            '행 중 값이 있는 행은 ' + s.count() + '개뿐이다(전부 NaN). 오타를 내도 알아채기 어렵다.'
          ));
        }
      }

      var addBtn1 = UI.el('button', {
        text: '컬럼 추가',
        onclick: function () { if (st1.activeCount < POOL.length) st1.activeCount++; rebuild1(); }
      });
      var delBtn1 = UI.el('button', {
        text: '컬럼 삭제',
        onclick: function () { if (st1.activeCount > 1) st1.activeCount--; rebuild1(); }
      });
      var gradeToggle = UI.toggle({
        label: "columns= 에 '성적' 끼워넣기(없는 이름)", value: false,
        onChange: function (on) { st1.includeGrade = on; rebuild1(); }
      });
      var tToggle = UI.toggle({
        label: '.T 전치', value: false,
        onChange: function (on) { st1.showT = on; rebuild1(); }
      });

      root.appendChild(box1);
      box1.appendChild(UI.el('div.control-row', null, [addBtn1, delBtn1]));
      box1.appendChild(UI.el('div.control-row', null, [gradeToggle, tToggle]));
      box1.appendChild(body1);
      rebuild1();

      // ───────────────────────────────── 시뮬레이터 ② drop 은 복사본을 반환한다
      var COLS2 = ['이름', '나이', '학교'];
      function makeDemoFrame() {
        return DF.frame({
          '이름': ['학생1', '학생2', '학생3', '학생4'],
          '나이': [16, 17, 16, 17],
          '학교': ['가온고', '나래고', '다솜고', '라온고']
        });
      }

      var st2 = { original: makeDemoFrame(), dropCol: '학교', inplace: false, result: undefined, wrote: false, writeCol: null };

      var box2 = UI.el('div.card');
      box2.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ② drop 은 복사본을 반환한다' }));
      box2.appendChild(UI.danger(
        '정정 — 원본 강의자료 오류',
        "원본 자료는 'drop() 은 view 에서만 삭제하고 실제로 삭제하지 않는다' 라고 설명했지만 틀렸다. " +
        'pandas 에서 view(뷰)는 메모리 공유를 뜻하는 별개 용어다. drop() 은 뷰가 아니라 새 ' +
        'DataFrame(복사본)을 반환한다.'
      ));

      var body2 = UI.el('div');

      function resetDemo() {
        st2.original = makeDemoFrame();
        st2.result = undefined;
        st2.wrote = false;
        st2.writeCol = null;
        draw2();
      }

      function doDrop() {
        var r = st2.original.drop(st2.dropCol, { axis: 1, inplace: st2.inplace });
        st2.result = r;
        st2.wrote = false;
        st2.writeCol = null;
        draw2();
      }

      function doWrite() {
        if (!(st2.result instanceof DF.DataFrame) || st2.wrote) return;
        var col = pickWriteCol(st2.result);
        var val = pickWriteValue(st2.result, col);
        var rowLabel = st2.result.index.at(0);
        st2.result.setLoc(rowLabel, col, val);
        st2.wrote = true;
        st2.writeCol = col;
        draw2();
      }

      function draw2() {
        UI.clear(body2);
        if (st2.result === undefined) {
          body2.appendChild(UI.frameTable(st2.original, { frame: 'original', caption: '원본 df' }));
          body2.appendChild(UI.note('아직 drop 을 실행하지 않았다. 위 버튼을 눌러 보라.'));
          return;
        }
        if (st2.result === null) {
          body2.appendChild(UI.frameTable(st2.original, { frame: 'original', caption: '원본 df (inplace 로 바뀐 뒤)' }));
          body2.appendChild(UI.code(
            "result = df.drop('" + st2.dropCol + "', axis=1, inplace=True)",
            { output: 'result -> None\ndf.columns -> [' + st2.original.columns.join(', ') + ']' }
          ));
          body2.appendChild(UI.note('inplace=True 를 주면 원본이 즉시 바뀌고, drop() 의 반환값은 null(파이썬에서는 None)이다.'));
          return;
        }

        body2.appendChild(UI.frameTable(st2.original, { frame: 'original', caption: '원본 df' }));
        body2.appendChild(UI.frameTable(st2.result, { frame: 'copy', caption: "반환본 d = df.drop('" + st2.dropCol + "', axis=1)" }));

        var demoCol = st2.writeCol || pickWriteCol(st2.result);
        body2.appendChild(UI.shareBadge(st2.original.col(demoCol), st2.result.col(demoCol), '원본 df', '반환본 d'));

        if (!st2.wrote) {
          body2.appendChild(UI.note(
            '지금은 "' + demoCol + '" 컬럼이 아직 같은 블록을 보고 있다 — drop() 이 새 DataFrame(d) 을 ' +
            '만들었어도 실제 값 복제는 쓰기 순간에 일어나기 때문이다(Copy-on-Write, 7장에서 자세히 다룬다).'
          ));
          body2.appendChild(UI.el('button', {
            text: "d 에 값 쓰기 — d.loc[..., '" + demoCol + "'] = " + JSON.stringify(pickWriteValue(st2.result, demoCol)),
            onclick: doWrite
          }));
        } else {
          body2.appendChild(UI.code(
            "d.loc[" + JSON.stringify(st2.result.index.at(0)) + ", '" + demoCol + "'] = " +
            JSON.stringify(pickWriteValue(st2.result, demoCol)),
            {
              output: '원본 df 의 값: ' + UI.fmt(st2.original.col(demoCol).at(0)) + ' (안 바뀜)\n' +
                      '반환본 d 의 값: ' + UI.fmt(st2.result.col(demoCol).at(0)) + ' (바뀜)'
            }
          ));
          body2.appendChild(UI.note('값을 쓴 순간 블록이 복제되어, 이제 두 컬럼은 서로 다른 메모리를 본다.'));
        }

        body2.appendChild(UI.blockView(st2.original, { title: '원본 df 블록 상태' }));
        body2.appendChild(UI.blockView(st2.result, { title: '반환본 d 블록 상태' }));
      }

      var dropColGroup = UI.buttonGroup(
        COLS2.map(function (c) { return { label: c, value: c }; }),
        {
          label: '지울 컬럼',
          selected: COLS2.indexOf(st2.dropCol),
          onChange: function (v) { st2.dropCol = v; resetDemo(); }
        }
      );
      var inplaceToggle2 = UI.toggle({
        label: 'inplace', value: false,
        onChange: function (on) { st2.inplace = on; resetDemo(); }
      });
      var dropBtn = UI.el('button', { text: 'drop(axis=1) 실행', onclick: doDrop });
      var resetBtn2 = UI.el('button', { text: '초기화', onclick: resetDemo });

      root.appendChild(box2);
      box2.appendChild(dropColGroup);
      box2.appendChild(UI.el('div.control-row', null, [inplaceToggle2, dropBtn, resetBtn2]));
      box2.appendChild(body2);
      draw2();

      // ───────────────────────────────── 시뮬레이터 ③ reset_index / rename 의 함정
      var box3 = UI.el('div.card');
      box3.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ③ reset_index / rename 의 함정' }));

      var t = LabData.frame('titanic');
      var vc = t.col('Pclass').valueCounts(); // name:'count', index.name:'Pclass'
      var vcFrame = DF.frame((function () {
        var o = {}; o[vc.name] = vc.toArray(); return o;
      })(), { index: vc.index });
      var vcReset = vcFrame.resetIndex(); // 컬럼: ['Pclass', 'count'] — 엔진이 직접 계산한 이름

      var st3 = { renamed: false };
      var body3 = UI.el('div');

      function draw3() {
        UI.clear(body3);
        body3.appendChild(UI.el('div.panel-title', { text: "t['Pclass'].value_counts()" }));
        body3.appendChild(UI.seriesTable(vc, { frame: 'result' }));
        body3.appendChild(UI.el('div.panel-title', { text: '.reset_index()' }));
        body3.appendChild(UI.frameTable(vcReset, {
          frame: 'result', caption: '컬럼: [' + vcReset.columns.join(', ') + ']'
        }));

        if (st3.renamed) {
          var hadIndexCol = vcReset.columns.indexOf('index') !== -1;
          var hadPclassCol = vcReset.columns.indexOf('Pclass') !== -1;
          var renamed = vcReset.rename({ index: 'Pclass', Pclass: 'Pclass_count' });
          body3.appendChild(UI.frameTable(renamed, {
            frame: 'copy',
            caption: "rename(columns={'index':'Pclass','Pclass':'Pclass_count'}) 결과: [" + renamed.columns.join(', ') + ']'
          }));
          body3.appendChild(UI.danger(
            '에러도 경고도 없다',
            "'index':'Pclass' 는 " + (hadIndexCol ? '실제 컬럼이라 적용됐지만' : '그런 컬럼이 없어 조용히 무시됐고') + ', ' +
            "'Pclass':'Pclass_count' 는 " + (hadPclassCol ? '실제 컬럼이라 그대로 적용되어' : '없어서 무시되어') +
            ' 등급 라벨이 든 컬럼 이름이 Pclass_count 로 바뀌었다. 이름이 내용과 반대로 보인다.'
          ));

          var fixed = vcReset.rename({ count: '건수' });
          body3.appendChild(UI.note(
            '실제로 있는 이름을 보고 지정하면 이렇게 안전하다.', 'rename 을 올바르게 쓰면'
          ));
          body3.appendChild(UI.frameTable(fixed, {
            frame: 'result', caption: "rename(columns={'count':'건수'}) 결과: [" + fixed.columns.join(', ') + ']'
          }));
        }
      }

      var renameBtn = UI.el('button', {
        text: "rename(columns={'index':'Pclass','Pclass':'Pclass_count'}) 적용해보기",
        onclick: function () { st3.renamed = true; draw3(); }
      });
      var undoBtn3 = UI.el('button', {
        text: '되돌리기', onclick: function () { st3.renamed = false; draw3(); }
      });

      root.appendChild(box3);
      box3.appendChild(UI.el('div.control-row', null, [renameBtn, undoBtn3]));
      box3.appendChild(body3);
      draw3();

      // ───────────────────────────────── 확인 문제
      root.appendChild(UI.quiz({
        title: '확인 문제 4-1',
        question:
          "df = pd.DataFrame({'a':[1,2],'b':[3,4]}) 다음 한 줄만 실행했다. " +
          "df.drop('b', axis=1) — 이제 df 에 'b' 컬럼이 남아 있는가?",
        choices: [
          { label: '남아 있다', correct: true,
            why: 'drop() 은 결과만 반환하고 원본은 바꾸지 않는다. 반환값을 변수에 받지 않았으니 그 결과는 만들어졌다가 버려졌다.' },
          { label: '사라진다', why: '틀렸다. 원본을 실제로 바꾸려면 df = df.drop(...) 로 다시 대입하거나 inplace=True 를 써야 한다.' }
        ]
      }));

      root.appendChild(UI.quiz({
        title: '확인 문제 4-2',
        question:
          "t['Pclass'].value_counts().reset_index() 의 컬럼은 ['Pclass','count'] 다. 여기에 " +
          "rename(columns={'index':'Pclass','Pclass':'Pclass_count'}) 를 이어 붙이면 어떻게 되는가?",
        choices: [
          { label: "'index' 컬럼이 없어서 통째로 에러가 난다", why: "틀렸다. 없는 키를 rename 에 주면 에러 없이 조용히 무시될 뿐이다." },
          { label: "아무 일도 일어나지 않는다", why: "틀렸다. 'Pclass' 는 실제로 있는 컬럼이라 그대로 적용된다." },
          { label: "'index':'Pclass' 는 무시되고 'Pclass' 가 'Pclass_count' 로 바뀐다", correct: true,
            why: '실제로 있는 컬럼(Pclass)에 대한 매핑만 적용된다. 그 결과 등급 라벨이 든 컬럼 이름이 ' +
                 'Pclass_count 로 바뀌어, 이름과 내용이 반대가 된다. 에러가 없어서 더 위험하다.' }
        ]
      }));

      root.appendChild(UI.quiz({
        title: '확인 문제 4-3',
        question: "pd.DataFrame({'a':[1,2]}, columns=['a','연봉']) 을 실행하면 '연봉' 컬럼은 어떻게 되는가?",
        choices: [
          { label: 'KeyError 가 난다', why: '틀렸다. 에러 없이 실행된다.' },
          { label: '전부 NaN 인 컬럼이 생긴다', correct: true,
            why: '딕셔너리에 없는 이름을 columns= 에 넣으면 에러 없이 그 컬럼 전체가 NaN 이 된다. 오타를 내도 알아채기 어렵다.' },
          { label: '자동으로 0 으로 채워진다', why: '틀렸다. 0 이 아니라 NaN 으로 채워진다.' }
        ]
      }));
    }
  });
})();

/* ===== modules/ch05-locindex.js ===== */
/* ch05-locindex.js — 5장. loc 와 iloc: 라벨과 위치 (교재 5장, pandas.md 1549~2153줄)
 *
 * 학생이 가장 많이 틀리는 개념 3위. 이 장의 심장은 시뮬레이터 ①이다 —
 * 인덱스가 [55, 56, 1, 2] 인 DataFrame 에서 iloc(2) 와 loc(2) 가 다른 행을 가리키는 것을
 * 조작해서 직접 확인한다.
 *
 * IIFE 로 완전히 감싸 전역을 공유하지 않는다. render 는 여러 번 호출될 수 있으므로
 * 가변 상태는 전부 render 안의 지역 변수에 둔다(API.md §1 ②).
 * UI.code 에 보여주는 코드 문자열은 교재와 같은 파이썬 표기(대괄호)를 쓴다 — 실제 계산은
 * DF 엔진의 JS 표기(API.md §4.5, 객체 인자)로 한다. 학생에게 파이썬 문법을 보여주는 것과
 * 엔진을 호출하는 것은 서로 다른 층이다.
 */
(function () {
  'use strict';

  // ──────────────────────────────────────────── 순수 도우미(가변 상태 없음)

  var IDX_MODE_INFO = [
    { value: 'default', label: '기본 (0,1,2,3)' },
    { value: 'shuffled', label: '뒤섞인 ([55,56,1,2])' },
    { value: 'char', label: "문자 ('a','b','c','d')" }
  ];

  function idxLabelsFor(mode) {
    if (mode === 'shuffled') return [55, 56, 1, 2];
    if (mode === 'char') return ['a', 'b', 'c', 'd'];
    return [0, 1, 2, 3];
  }

  /* 교재 5.1 절의 temp 를 그대로 재현한다. 이름은 지어낸 것이다(실존 인물 아님). */
  function makeTemp(mode) {
    return DF.frame({
      '성': ['김', '이', '박', '최'],
      '이름': ['민준', '서연', '도윤', '하은'],
      '나이': [27, 19, 32, 31],
      '팀': ['탐구반', '실험반', '토론반', '발표반']
    }, { index: idxLabelsFor(mode) });
  }

  /* loc 라벨 버튼의 기본값. 라벨 2 가 있으면 그것을(교재 5.1 절 예제와 일치),
   * 없으면(문자 인덱스) 위치 2 자리의 라벨을 대신 쓴다. */
  function defaultLocLabel(mode) {
    var labels = idxLabelsFor(mode);
    var i = labels.indexOf(2);
    return i !== -1 ? labels[i] : labels[2];
  }

  /* 교재 코드 표시용 — 파이썬 리터럴로 찍는다(문자열엔 따옴표, 숫자는 그대로). */
  function pyLit(v) {
    return typeof v === 'string' ? "'" + v + "'" : String(v);
  }

  Lab.register({
    id: 'ch05-locindex',
    num: 5,
    title: 'loc 와 iloc — 라벨과 위치',
    subtitle: '같은 숫자 2 가 iloc 와 loc 에서 다른 행을 가리키는 이유',

    render: function (root) {
      var t = LabData.frame('titanic'); // LabData.frame() 은 render 안에서 부른다 (API.md §3)

      // ============================================================
      // 시뮬레이터 ① 라벨과 위치 나란히 보기 — 이 장의 심장
      // ============================================================
      var st1 = { mode: 'shuffled', ilocPos: 2, locLabel: defaultLocLabel('shuffled') };

      var box1 = UI.el('div.card');
      box1.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ① 라벨과 위치 나란히 보기' }));
      box1.appendChild(UI.note(
        'DataFrame 의 행에는 좌표가 두 개 있다 — 몇 번째 줄인가(위치)와 이름표가 무엇인가(라벨). ' +
        'iloc(n) 은 위치 n 인 행을, loc(라벨) 은 그 라벨을 가진 행을 찾는다. 아래에서 위치 슬라이더와 ' +
        '라벨 버튼을 각각 움직여, 두 기준이 어떤 행을 가리키는지 표에서 링(is-focus)으로 확인해 보라.'
      ));

      var body1 = UI.el('div');

      function rebuild1() {
        UI.clear(body1);
        var df = makeTemp(st1.mode);
        var ilocPos = st1.ilocPos;
        var locLabel = st1.locLabel;
        var locPositions = df.index.positions(locLabel);
        var locPos = locPositions.length ? locPositions[0] : null;

        var keys = ['pos', 'label'].concat(df.columns);
        var cols = keys.map(function (k) {
          return { key: k, label: k === 'pos' ? '위치' : k === 'label' ? '라벨' : k };
        });
        var rows = [];
        for (var i = 0; i < df.nrows(); i++) {
          var r = { pos: i, label: df.index.at(i) };
          df.columns.forEach(function (c) { r[c] = df.col(c).at(i); });
          rows.push(r);
        }
        var hlCells = [];
        keys.forEach(function (k) { hlCells.push([ilocPos, k]); });
        if (locPos !== null) keys.forEach(function (k) { hlCells.push([locPos, k]); });

        body1.appendChild(UI.table(cols, rows, {
          hlCells: hlCells,
          caption: 'temp — index = [' + df.index.labels.join(', ') + ']'
        }));

        var ilocRow = df.iloc(ilocPos);
        var ilocName = ilocRow.col('이름').at(0);
        var ilocLabelAt = df.index.at(ilocPos);
        body1.appendChild(UI.code(
          'temp.iloc[' + ilocPos + "]['이름']",
          { output: "'" + ilocName + "'   (위치 " + ilocPos + "번째 줄, 라벨 " + UI.fmt(ilocLabelAt) + ')' }
        ));

        var locName = df.loc(locLabel).col('이름').at(0);
        body1.appendChild(UI.code(
          'temp.loc[' + pyLit(locLabel) + "]['이름']",
          { output: "'" + locName + "'   (라벨 " + UI.fmt(locLabel) + '인 행, 위치 ' + locPos + '번째)' }
        ));

        if (ilocPos === locPos) {
          var msg = 'iloc(' + ilocPos + ')와 loc(' + UI.fmt(locLabel) + ')가 같은 행(위치 ' + ilocPos + ')을 가리킨다.';
          if (st1.mode === 'default') {
            msg += ' 지금은 인덱스가 기본값(0,1,2,3)이라 위치와 라벨이 같은 숫자면 우연히 일치한다 — ' +
              '그래서 이 상태만 보면 iloc 와 loc 를 섞어 써도 문제가 드러나지 않는다. "뒤섞인" 버튼을 눌러 ' +
              '이 우연이 깨지는 것을 확인해 보라. 그게 바로 버그가 숨는 자리다.';
          }
          body1.appendChild(UI.note(msg));
        } else {
          body1.appendChild(UI.note(
            'iloc(' + ilocPos + ')는 위치 ' + ilocPos + '번째 줄(라벨 ' + UI.fmt(ilocLabelAt) + ')을, loc(' +
            UI.fmt(locLabel) + ')는 라벨이 ' + UI.fmt(locLabel) + '인 위치 ' + locPos + '번째 줄을 가리킨다. ' +
            '같은 숫자를 썼는데 다른 행이 나왔다 — 하나는 위치로, 하나는 이름표로 읽었기 때문이다.'
          ));
        }
      }

      var locGroupWrap = UI.el('div');
      function rebuildLocGroup() {
        UI.clear(locGroupWrap);
        var labels = idxLabelsFor(st1.mode);
        var sel = labels.indexOf(st1.locLabel);
        if (sel === -1) { st1.locLabel = labels[0]; sel = 0; }
        locGroupWrap.appendChild(UI.buttonGroup(
          labels.map(function (l) { return { label: String(l), value: l }; }),
          {
            label: 'loc 라벨 선택',
            selected: sel,
            onChange: function (v) { st1.locLabel = v; rebuild1(); }
          }
        ));
      }

      var modeGroup = UI.buttonGroup(
        IDX_MODE_INFO.map(function (m) { return { label: m.label, value: m.value }; }),
        {
          label: '인덱스',
          selected: IDX_MODE_INFO.map(function (m) { return m.value; }).indexOf(st1.mode),
          onChange: function (v) {
            st1.mode = v;
            st1.locLabel = defaultLocLabel(v);
            rebuildLocGroup();
            rebuild1();
          }
        }
      );
      var ilocSlider = UI.slider({
        label: 'iloc 위치 선택', min: 0, max: 3, step: 1, value: st1.ilocPos,
        onChange: function (v) { st1.ilocPos = v; rebuild1(); }
      });

      root.appendChild(box1);
      box1.appendChild(modeGroup);
      box1.appendChild(ilocSlider);
      box1.appendChild(locGroupWrap);
      box1.appendChild(body1);
      rebuildLocGroup();
      rebuild1();

      // ============================================================
      // 시뮬레이터 ② [] 연산자의 세 가지 의미
      // ============================================================
      var tSmall = t.cols(['Pclass', 'Name', 'Age']);

      var box2 = UI.el('div.card');
      box2.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ② [] 연산자의 세 가지 의미' }));
      box2.appendChild(UI.note(
        '같은 대괄호 df[...] 도 안에 무엇을 넣느냐에 따라 완전히 다른 일을 한다 — 열 이름 하나면 Series, ' +
        '리스트면 DataFrame, 슬라이스(콜론이 있는 형태)면 행 선택, 불린 배열이면 필터. 슬라이스가 아닌 ' +
        '정수 하나는 컬럼 이름으로 취급되어, 그런 이름의 컬럼이 없으면 KeyError 가 난다.'
      ));

      var seriesForm = tSmall.col('Name');
      var frameForm = tSmall.cols(['Name']);
      box2.appendChild(UI.table(
        [{ key: 'expr', label: '표현' }, { key: 'type', label: '타입' }, { key: 'shape', label: 'shape' }],
        [
          { expr: "t['Name']", type: 'Series', shape: '(' + seriesForm.length() + ',)' },
          { expr: "t[['Name']]", type: 'DataFrame', shape: '(' + frameForm.shape[0] + ', ' + frameForm.shape[1] + ')' }
        ],
        { caption: "t['Name'] 과 t[['Name']] — 대괄호 개수가 타입을 바꾼다" }
      ));

      var FORM_ITEMS = [
        { label: "t['Name']", value: 'col' },
        { label: "t[['Pclass','Name']]", value: 'cols' },
        { label: 't[0:2]', value: 'slice' },
        { label: "t[t['Pclass'] == 3]", value: 'bool' },
        { label: 't[0]  (에러)', value: 'intkey' }
      ];
      var EXPR_TEXT = {
        col: "t['Name']", cols: "t[['Pclass','Name']]", slice: 't[0:2]',
        bool: "t[t['Pclass'] == 3]", intkey: 't[0]'
      };
      var st2 = { form: 'col' };
      var body2 = UI.el('div');

      function rebuild2() {
        UI.clear(body2);
        body2.appendChild(UI.code(EXPR_TEXT[st2.form]));

        if (st2.form === 'col') {
          var s = tSmall.col('Name');
          body2.appendChild(UI.seriesTable(s, { maxRows: 5, frame: 'result' }));
          body2.appendChild(UI.note('타입: Series, shape: (' + s.length() + ',)'));
        } else if (st2.form === 'cols') {
          var f = tSmall.cols(['Pclass', 'Name']);
          body2.appendChild(UI.frameTable(f, { maxRows: 5, frame: 'result' }));
          body2.appendChild(UI.note('타입: DataFrame, shape: (' + f.shape[0] + ', ' + f.shape[1] + ')'));
        } else if (st2.form === 'slice') {
          var sl = tSmall.islice(0, 2);
          body2.appendChild(UI.frameTable(sl, { frame: 'result' }));
          body2.appendChild(UI.note(
            '정수 슬라이스는 행을 자른다. shape: (' + sl.shape[0] + ', ' + sl.shape[1] + ') — 위치 0, 1 두 행만.'
          ));
        } else if (st2.form === 'bool') {
          var mask = tSmall.col('Pclass').eq(3);
          var filtered = tSmall.mask(mask);
          body2.appendChild(UI.frameTable(filtered, { maxRows: 5, frame: 'result' }));
          body2.appendChild(UI.note(
            '불린 배열은 조건에 맞는 행만 남긴다. 전체 ' + tSmall.nrows() + '행 중 ' + filtered.nrows() + '행이 남았다.'
          ));
        } else {
          try {
            tSmall.col(0);
            body2.appendChild(UI.note('에러가 나지 않았다.'));
          } catch (e) {
            body2.appendChild(UI.danger('에러', e.message));
            body2.appendChild(UI.note(
              '0 은 슬라이스가 아니라서 컬럼 이름으로 해석됐다. 이름이 0 인 컬럼이 없어 KeyError 가 났다. ' +
              't[0:2] 는 슬라이스라서 되지만 t[0] 은 안 된다 — 안에 콜론이 있느냐 없느냐로 규칙이 갈린다.'
            ));
          }
        }
      }

      var formGroup = UI.buttonGroup(FORM_ITEMS, {
        label: '표현 선택', selected: 0,
        onChange: function (v) { st2.form = v; rebuild2(); }
      });

      root.appendChild(box2);
      box2.appendChild(formGroup);
      box2.appendChild(body2);
      rebuild2();

      // ============================================================
      // 시뮬레이터 ③ 슬라이스 — 끝을 포함하는가
      // ============================================================
      function makeSliceFrame() {
        return DF.frame({
          '이름': ['가온', '나래', '다솜', '라온', '마루'],
          '점수': [88, 92, 79, 95, 84]
        }, { index: ['p', 'q', 'r', 's', 't'] });
      }

      var box3 = UI.el('div.card');
      box3.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ③ 슬라이스 — 끝을 포함하는가' }));
      box3.appendChild(UI.note(
        'iloc 의 위치 슬라이스는 파이썬 리스트처럼 끝을 제외한다. loc 의 라벨 슬라이스는 끝을 포함한다. ' +

          df.columns.forEach(function (c) { r[c] = df.col(c).at(i); });
          rows.push(r);

/* ch06-align.js — 인덱스 정렬: 연산은 인덱스로 짝짓는다 (교재 6장)
 * IIFE 로 완전히 감싸 전역을 공유하지 않는다. render 는 여러 번 호출될 수 있으므로
 * 가변 상태는 전부 render 안의 지역 변수에 둔다(API.md §1 ②).
 *
 * 이 장은 학생이 가장 많이 틀리는 개념 2위(인덱스 정렬)다. 표는 전부 UI.alignView 로 그린다 —
 * 직접 짝짓기 표를 그리지 않는다(API.md §4.4).
 */
(function () {
  'use strict';

  // ──────────────────────────────────────────────────────────── 순수 도우미
  // (상태가 없는 계산 함수만 모듈 스코프에 둔다. ch04-frame.js 의 transpose() 와 같은 패턴.)

  /* 라벨별로 왼쪽/오른쪽에 몇 개씩 있는지 세어, 곱집합이 되는 라벨만 문장으로 만든다.
   * 인덱스가 완전히 같으면(정렬을 건너뛰는 경우) 이 함수를 부르지 않는다 — 그때는 곱집합이 생기지 않는다. */
  function dupDescriptions(left, right) {
    var union = DF.sortedUnion(left.index, right.index);
    var lines = [];
    union.forEach(function (label) {
      var lc = left.index.positions(label).length;
      var rc = right.index.positions(label).length;
      if (lc > 1 || rc > 1) {
        lines.push("'" + label + "' : 왼쪽 " + lc + '개 × 오른쪽 ' + rc + '개 = ' + (lc * rc) + '행');
      }
    });
    return lines;
  }

  /* DF 엔진에는 DataFrame.add 가 없다. Series 와 DataFrame 을 더할 때 pandas 가 하는 일
   * (컬럼 라벨 또는 행 라벨을 Series 인덱스와 정렬한 뒤 브로드캐스팅)을 공개 API(DF.alignIndexes,
   * DF.index, DF.frame)만으로 이 화면이 직접 계산한다. ch04-frame.js 의 transpose() 와 같은 접근이다. */
  function seriesBroadcastFrame(df, s, axis, opFn) {
    var baseIndex = axis === 'row' ? df.index : DF.index(df.columns.slice());
    var al = DF.alignIndexes(baseIndex, s.index);
    var resultCols = {};
    var orderLabels = al.pairs.map(function (p) { return p[2]; });
    if (axis === 'row') {
      df.columns.forEach(function (colName) {
        var vals = al.pairs.map(function (p) {
          var rp = p[0], sp = p[1];
          return (rp === -1 || sp === -1) ? null : opFn(df.col(colName).at(rp), s.at(sp));
        });
        resultCols[colName] = vals;
      });
      return DF.frame(resultCols, { columns: df.columns.slice(), index: orderLabels });
    }
    al.pairs.forEach(function (p) {
      var cp = p[0], sp = p[1], label = p[2];
      var vals = [];
      for (var r = 0; r < df.nrows(); r++) {
        vals.push((cp === -1 || sp === -1) ? null : opFn(df.col(df.columns[cp]).at(r), s.at(sp)));
      }
      resultCols[label] = vals;
    });
    return DF.frame(resultCols, { columns: orderLabels, index: df.index.labels.slice() });
  }

  /* 시뮬레이터 ④용 4x4 예제 프레임. np.arange(16).reshape(4,4) 와 같은 값을 반복문으로 만든다. */
  function buildBroadcastFrame() {
    var cols = ['a', 'b', 'c', 'd'];
    var colObj = {};
    cols.forEach(function (c, ci) {
      var vals = [];
      for (var r = 0; r < 4; r++) vals.push(r * cols.length + ci);
      colObj[c] = vals;
    });
    return DF.frame(colObj, { columns: cols });
  }

      box3.appendChild(UI.note(
        'DF.trace 로 실제 연산을 기록하고, 라벨마다 왼쪽 n개 × 오른쪽 m개가 어떻게 n×m 행이 되는지 ' +
        '한 단계씩 넘겨 본다. 왼쪽이 바깥 루프, 오른쪽이 안쪽 루프다.'
      ));

      var presetGroup3 = UI.buttonGroup(
        PRESETS3.map(function (p) { return { label: p.label, value: p.label }; }),

      );

      var body3 = UI.el('div');

      function rebuild3() {

        var result = left.add(right);

        var al = DF.alignIndexes(left.index, right.index);
        var union = DF.sortedUnion(left.index, right.index);
        var dup = dupDescriptions(left, right);

        var steps = [];
        steps.push({ type: 'overview' });
        union.forEach(function (label) {
          var lc = left.index.positions(label).length;
          var rc = right.index.positions(label).length;
          var pairs = al.pairs.filter(function (pr) { return pr[2] === label; });

        });

        var traceEntry = traceLog.length ? traceLog[0] : null;

        body3.appendChild(UI.stepper(steps, function (step) {
          if (step.type === 'overview') {

      root.appendChild(UI.quiz({

          { label: UI.fmt(qWrong3), why: '오답이다. 이건 두 Series 의 0번째 값끼리(위치로) 더한 값이다 — 넘파이라면 이렇게 되지만 pandas 는 라벨로 짝짓는다.' },
          { label: UI.fmt(qAns3), correct: true,
            why: "라벨로 짝짓기 때문에 s1 의 'a'(" + UI.fmt(qs1.loc('a')) + ")와 s2 의 'a'(" + UI.fmt(qs2.loc('a')) + ")가 더해져 " + UI.fmt(qAns3) + '이 나온다.' },

      var qResult4 = seriesBroadcastFrame(qdf4, qs4, 'col', function (a, b) { return a + b; });

/* ===== modules/ch07-copy.js ===== */
/* ch07-copy.js — 뷰와 복사, Copy-on-Write (교재 7장)
 * 학생이 가장 많이 틀리는 개념 1위. 미니 엔진(Block/ColRef/refs)이 존재하는 이유가 이 장이다.
 * IIFE 로 완전히 감싸 전역을 공유하지 않는다. render 는 여러 번 호출될 수 있으므로
 * 가변 상태는 전부 render 안의 지역 변수에 둔다(API.md §1 ②).
 */
(function () {
  'use strict';

  /* 조건(불린 Series)에서 처음으로 true 인 위치. 조건에 맞는 행이 하나도 없으면 -1. */
  function firstTruePos(series) {
    for (var i = 0; i < series.length(); i++) if (series.at(i) === true) return i;
    return -1;
  }

  /* 시뮬레이터 ②·③ 이 공유하는 작은 titanic 부분표. 컬럼을 2개로 줄여 블록 상태 표가 한눈에 들어오게 한다. */
  function makeAgeFrame() {
    return LabData.frame('titanic').cols(['Name', 'Age']);
  }

  /* 교재 7.3절 ④(loc 연쇄)에 쓰는 표. 교재의 temp 예제와 값을 그대로 맞췄다. */
  function makeLabelFrame() {
    return DF.frame(
      { 이름: ['가온', '나연', '다인', '라온'], 점수: [88, 92, 75, 81] },
      { index: [55, 56, 1, 2] }
    );
  }

  /* DF.trace 의 kind 를 한국어 제목으로. */
  function stepTitle(kind) {
    return ({
      align: '인덱스 정렬', slice: '슬라이스 — 블록 공유', take: '테이크/마스크 — 새 블록',
      copy: '완전 복사 — 새 블록', cow: 'Copy-on-Write — 쓰기 시점 복사', 'block-copy': '블록 복제',
      setCol: '컬럼 대입', 'groupby-split': '그룹 분리', 'groupby-combine': '그룹 결합', merge: '병합'
    })[kind] || kind;
  }

  /* DF.trace 한 단계를 사람이 읽는 문장으로. */
  function stepSentence(step) {
    var d = step.detail || {};
    if (step.kind === 'slice') {
      return (d.shared ? '블록을 공유한다(shares_memory: true). ' : '새 블록을 만든다(복사). ') +
        '영향받은 행 수: ' + d.rows;
    }
    if (step.kind === 'cow') {
      return "컬럼 '" + d.column + "' 에 값을 쓰려는 순간, 블록 B" + d.from + ' 이 B' + d.to +
        ' 로 갈라져 나갔다. 이제부터 두 컬럼은 서로 다른 메모리를 본다.';
    }
    if (step.kind === 'block-copy') {
      return '블록 B' + d.from + ' → B' + d.to + ' 복제 (' + (d.reason || '') + ')';
    }
    return JSON.stringify(d);
  }

  function renderStep(step, i) {
    var box = UI.el('div');
    box.appendChild(UI.el('div.panel-title', { text: (i + 1) + '단계 — ' + stepTitle(step.kind) }));
    box.appendChild(UI.note(stepSentence(step)));
    return box;
  }

  /* 시뮬레이터 ③ 의 네 가지 패턴. run() 은 매번 새 프레임을 만들어 실행하고 실제 결과를 돌려준다.
   * 숫자·값은 전부 run() 안에서 DF 로 계산한다 — 화면에는 절대 하드코딩하지 않는다. */
  var PATTERNS = [
    {
      label: "① sub=df[조건] 후 sub['Age']=0",
      code: "sub = df[df['Age'] > 60]\nsub['Age'] = 0",
      warnNote: '실제 pandas 에서는 이 패턴에 경고조차 뜨지 않는다. 네 가지 중 가장 위험한 형태다 — ' +
        '"됐다" 고 믿기 가장 쉽다.',
      run: function () {
        var base = makeAgeFrame();
        var cond = base.col('Age').gt(60);
        var pos = firstTruePos(cond);
        var label = base.index.at(pos);
        var before = base.col('Age').at(pos);
        var sub = base.mask(cond);
        sub.setCol('Age', 0);
        var after = base.col('Age').at(pos);
        return {
          label: label, before: before, after: after, changed: before !== after,
          why: 'sub = df[조건] 이 원본과 독립된 새 DataFrame 을 만든 뒤였다. 그 뒤에 쓴 sub[\'Age\']=0 은 ' +
            '그 새 객체만 바꾼다.'
        };
      }
    },
    {
      label: "② df[조건]['Age']=0 (한 줄)",
      code: "df[df['Age'] > 60]['Age'] = 0",
      warnNote: '실제 pandas 라면 여기서는 ChainedAssignmentError 경고가 뜬다. 그래도 원본은 그대로다.',
      run: function () {
        var base = makeAgeFrame();
        var cond = base.col('Age').gt(60);
        var pos = firstTruePos(cond);
        var label = base.index.at(pos);
        var before = base.col('Age').at(pos);
        base.mask(cond).setCol('Age', 0); // 결과를 변수에 담지 않고 한 줄로 이어 쓴다
        var after = base.col('Age').at(pos);
        return {
          label: label, before: before, after: after, changed: before !== after,
          why: '한 줄로 썼어도 df[조건] 이 먼저 만드는 중간 객체는 그대로 생긴다. 겉모습만 한 줄일 뿐 ' +
            '패턴 ①과 구조가 같다.'
        };
      }
    },
    {
      label: "③ df.loc[라벨]['이름']='XXX'",
      code: "temp.loc[2]['이름']          # 읽기\ntemp.loc[2]['이름'] = 'XXX'  # 쓰기",
      warnNote: '실제 pandas 에서도 ChainedAssignmentError 경고가 뜬다. 읽기는 되고 쓰기만 반영되지 않는다.',
      run: function () {
        var temp = makeLabelFrame();
        var label = 2;
        var pos = temp.index.positions(label)[0];
        var before = temp.col('이름').at(pos);
        var row = temp.loc(label);       // 라벨이 2 인 행 하나 — 읽기용 중간 객체
        var readBack = row.col('이름').at(0);
        row.setCol('이름', 'XXX');        // 그 중간 객체에 쓰기 시도
        var after = temp.col('이름').at(pos);
        return {
          label: label, before: before, after: after, changed: before !== after,
          why: "temp.loc[2] 가 만든 중간 객체를 읽는 것(" + readBack + ")은 문제없이 된다. 하지만 그 " +
            '중간 객체에 쓰는 것은 이미 원본과 분리된 곳에 쓰는 것이라 닿지 않는다.'
        };
      }
    },
    {
      label: "바른 형태: df.setLoc(조건,'Age',0)",
      code: "df.loc[df['Age'] > 60, 'Age'] = 0",
      warnNote: '이번엔 경고가 뜨지 않고, 원본이 실제로 바뀐다. 행과 열을 대괄호 한 번에 함께 지정했기 때문이다.',
      run: function () {
        var base = makeAgeFrame();
        var cond = base.col('Age').gt(60);
        var pos = firstTruePos(cond);
        var label = base.index.at(pos);
        var before = base.col('Age').at(pos);
        base.setLoc(cond, 'Age', 0);
        var after = base.col('Age').at(pos);
        return {
          label: label, before: before, after: after, changed: before !== after,
          why: '조건과 열을 한 번의 대괄호(.loc[조건,\'Age\'])로 함께 넘겨서 중간 객체가 생기지 않았다.'
        };
      }
    }
  ];

  Lab.register({
    id: 'ch07-copy',
    num: 7,
    title: '뷰와 복사, Copy-on-Write',
    subtitle: '언제 메모리를 공유하고 언제 복사하는지, 그리고 쓰는 순간 무슨 일이 일어나는지 직접 본다',

    render: function (root) {
      root.appendChild(UI.note(
        '필터링한 결과에 값을 대입했는데 원본이 그대로인 경우가 있다. 아래 시뮬레이터로 pandas 가 ' +
        '언제 블록(메모리)을 공유하고 언제 복사하는지, 그리고 "연쇄 할당"이 왜 위험한지 직접 확인해 보자.'
      ));

      // ═══════════════════════════════ 시뮬레이터 ① 슬라이스는 공유, 마스크는 복사
      var box1 = UI.el('div.card');
      box1.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ① 슬라이스는 공유, 마스크는 복사' }));
      box1.appendChild(UI.note(
        'head(3) 과 islice(2, 5) 는 원본과 블록을 공유하고(파랑 원본과 메모리가 같다), ' +
        'mask(조건) 과 copy() 는 새 블록을 만든다. 넷을 눌러 비교해 보라 — 실제 pandas 도 이렇게 갈린다.'
      ));

      var t1 = LabData.frame('titanic').cols(['Age', 'Fare']);
      var OPS1 = [
        { label: 'head(3)', code: 'df.head(3)', run: function () { return t1.head(3); } },
        { label: 'islice(2, 5)', code: 'df.islice(2, 5)', run: function () { return t1.islice(2, 5); } },
        { label: 'mask(조건)', code: "df.mask(df['Age'] > 60)", run: function () { return t1.mask(t1.col('Age').gt(60)); } },
        { label: 'copy()', code: 'df.copy()', run: function () { return t1.copy(); } }
      ];
      var st1 = { op: 0 };
      var body1 = UI.el('div');

      function rebuild1() {
        UI.clear(body1);

        var overview = OPS1.map(function (o) {
          var r = o.run();
          return { code: o.code, shared: DF.sharesMemory(t1.col('Age'), r.col('Age')) ? '공유 (true)' : '복사 (false)' };
        });
        body1.appendChild(UI.table(
          [{ key: 'code', label: '연산' }, { key: 'shared', label: 'sharesMemory(원본, 결과)' }],
          overview, { caption: '넷을 한눈에 비교' }
        ));

        var op = OPS1[st1.op];
        var result = op.run();
        body1.appendChild(UI.frameTable(t1, { frame: 'original', maxRows: 5, caption: '원본 df' }));
        body1.appendChild(UI.frameTable(result, { frame: 'copy', maxRows: 5, caption: op.code + ' 의 결과' }));
        body1.appendChild(UI.shareBadge(t1.col('Age'), result.col('Age'), '원본 df', '결과'));
        body1.appendChild(UI.blockView(t1, { title: '원본 df 블록 상태' }));
        body1.appendChild(UI.blockView(result, { title: '결과 블록 상태' }));
      }

      box1.appendChild(UI.buttonGroup(
        OPS1.map(function (o, i) { return { label: o.label, value: i }; }),
        { label: '연산 선택', selected: st1.op, onChange: function (v) { st1.op = v; rebuild1(); } }
      ));
      box1.appendChild(body1);
      rebuild1();
      root.appendChild(box1);

      // ═══════════════════════════════ 시뮬레이터 ② 쓰는 순간 복사된다 (심장)
      var box2 = UI.el('div.card');
      box2.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ② 쓰는 순간 복사된다' }));
      box2.appendChild(UI.note(
        '원본 df 와 파생본 sub = df.islice(0, 5) 는 지금 같은 블록을 본다(참조 수가 1보다 크다). ' +
        '파생본에 값을 쓰는 순간 무슨 일이 일어나는지 DF.trace 로 한 단계씩 확인해 보라.'
      ));

      var body2 = UI.el('div');
      var st2 = {};

      function resetSim2() {
        DF.trace.enable();
        st2.base = makeAgeFrame();
        st2.derived = st2.base.islice(0, 5);
        st2.steps = DF.trace.get();
        DF.trace.disable();
        st2.written = false;
        st2.writeLabel = null;
        st2.writeVal = null;
      }

      function doWrite2() {
        if (st2.written) return;
        var label = st2.derived.index.at(0);
        var val = 999;
        DF.trace.enable();
        st2.derived.setLoc(label, 'Age', val);
        var newSteps = DF.trace.get();
        DF.trace.disable();
        st2.steps = st2.steps.concat(newSteps);
        st2.written = true;
        st2.writeLabel = label;
        st2.writeVal = val;
        rebuild2();
      }

      function rebuild2() {
        UI.clear(body2);
        body2.appendChild(UI.frameTable(st2.base, { frame: 'original', maxRows: 5, caption: '원본 df' }));
        body2.appendChild(UI.frameTable(st2.derived, { frame: 'copy', maxRows: 5, caption: 'sub = df.islice(0, 5)' }));
        body2.appendChild(UI.shareBadge(st2.base.col('Age'), st2.derived.col('Age'), '원본 df', '파생본 sub'));
        body2.appendChild(UI.blockView(st2.base, { title: '원본 df 블록 상태' }));
        body2.appendChild(UI.blockView(st2.derived, { title: '파생본 sub 블록 상태' }));

        if (!st2.written) {
          body2.appendChild(UI.el('button', {
            text: "sub.loc[..., 'Age'] = 999  (파생본에 값 쓰기)",
            onclick: doWrite2
          }));
        } else {
          body2.appendChild(UI.stepper(st2.steps, renderStep, { title: 'DF.trace 기록' }));
          var pos = st2.base.index.positions(st2.writeLabel)[0];
          body2.appendChild(UI.code(
            "sub.loc[" + JSON.stringify(st2.writeLabel) + ", 'Age'] = " + st2.writeVal,
            {
              output: '원본 df 의 Age: ' + UI.fmt(st2.base.col('Age').at(pos)) + ' (안 바뀜)\n' +
                '파생본 sub 의 Age: ' + UI.fmt(st2.derived.col('Age').at(0)) + ' (바뀜)'
            }
          ));
          body2.appendChild(UI.note(
            '블록 id 가 갈라지고 나면 두 컬럼은 완전히 다른 메모리를 본다 — 그래서 원본은 안전했다.'
          ));
        }
        body2.appendChild(UI.el('button', { text: '초기화', onclick: function () { resetSim2(); rebuild2(); } }));
      }

      resetSim2();
      box2.appendChild(body2);
      rebuild2();
      root.appendChild(box2);

      // ═══════════════════════════════ 시뮬레이터 ③ 연쇄 할당 함정 3종
      var box3 = UI.el('div.card');
      box3.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ③ 연쇄 할당 함정 3종' }));

/* ch08-missing.js — 결측 데이터 (교재 8장)
 * IIFE 로 완전히 감싸 전역을 공유하지 않는다. render 는 여러 번 호출될 수 있으므로
 * 가변 상태는 전부 render 안의 지역 변수에 둔다(API.md §1 ②).
 */
(function () {
  'use strict';

  /* 최빈값. 엔진에 mode() 가 없으므로 valueCounts() 에서 가장 많이 등장한 값(첫 항목)을 쓴다.
   * (개수가 같으면 valueCounts 가 "먼저 나온 순서" 를 앞에 두므로 결정적이다.) */
  function modeValue(series) {
    var vc = series.dropna().valueCounts();
    return vc.length() ? vc.labels()[0] : null;
  }

  /* 결측이 하나라도 있는 행의 위치 배열. DF 엔진에 df.any(axis=1) 이 없어 공개 API 로 직접 센다. */
  function rowsWithAnyNA(df) {
    var isnaDf = df.isna();
    var cols = df.columns;
    var pos = [];
    for (var i = 0; i < df.nrows(); i++) {
      var bad = false;
      for (var c = 0; c < cols.length; c++) {
        if (isnaDf.col(cols[c]).at(i)) { bad = true; break; }
      }
      if (bad) pos.push(i);
    }
    return pos;
  }

  Lab.register({
    id: 'ch08-missing',
    num: 8,
    title: '결측 데이터',
    subtitle: '찾고(isna) · 채우고(fillna) · 버리는(dropna) 세 가지 방법, 그리고 문자 하나가 컬럼을 망치는 순간',

    render: function (root) {
      var t = LabData.frame('titanic');
      var age = t.col('Age');
      var ageMissing = age.length() - age.count();

      // ───────────────────────────────── 시뮬레이터 ① 결측 지도
      var box1 = UI.el('div.card');
      box1.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ① 결측 지도' }));
      box1.appendChild(UI.note(
        'isna()는 칸마다 결측 여부를 True/False로 돌려준다. 여기에 .sum()을 이으면 컬럼별 결측 ' +
        '개수가 나온다 — 파이썬에서 True는 1, False는 0으로 취급되기 때문이다. 전부 df.isna().sum() ' +
        '을 그 자리에서 계산한 값이다.'
      ));

      var isnaSum = t.isna().sum();      // Series: 컬럼 -> 결측 수
      var sumLabels = isnaSum.labels();
      var sumVals = isnaSum.toArray();

      box1.appendChild(UI.bar(
        sumLabels.map(function (c, i) { return { label: c, value: sumVals[i] }; }),
        { title: 't.isna().sum() — 컬럼별 결측 수', labelHeader: '컬럼', valueHeader: '결측 수', padLeft: 100 }
      ));

      box1.appendChild(UI.table(
        [
          { key: 'col', label: '컬럼' },
          { key: 'cnt', label: '결측 수' },
          { key: 'pct', label: '비율(%)', digits: 1 }
        ],
        sumLabels.map(function (c, i) {
          return { col: c, cnt: sumVals[i], pct: t.nrows() ? sumVals[i] / t.nrows() * 100 : 0 };
        }),
        { caption: '전체 ' + t.nrows() + '행 기준 비율' }
      ));

      // "True 가 1로 세어진다" 미니 데모 — 컬럼 선택 가능
      var missingCols = ['Age', 'Cabin', 'Embarked'];
      var st1 = { demoCol: 'Cabin' };
      var demoBody = UI.el('div');

      function rebuildDemo() {
        UI.clear(demoBody);
        var demoIsna = t.isna().col(st1.demoCol);
        var n = Math.min(5, demoIsna.length());
        var rows = [];
        for (var i = 0; i < n; i++) {
          var b = demoIsna.at(i);
          rows.push({ idx: t.index.at(i), bool: b, num: b ? 1 : 0 });
        }
        var totalForCol = sumVals[t.columns.indexOf(st1.demoCol)];
        demoBody.appendChild(UI.table(
          [
            { key: 'idx', label: '인덱스' },
            { key: 'bool', label: st1.demoCol + '.isna()' },
            { key: 'num', label: '숫자로 보면' }
          ],
          rows, { caption: '처음 ' + n + '행' }
        ));
        demoBody.appendChild(UI.note(
          '이 ' + n + '행만 숫자로 더해도 ' + rows.reduce(function (s, r) { return s + r.num; }, 0) +
          '이 나온다. ' + t.nrows() + '행 전체에서 True 만 더하면 위 막대그래프의 그 숫자, ' + totalForCol +
          '(= ' + st1.demoCol + ' 결측 수)이 나온다.'
        ));
      }

      box1.appendChild(UI.buttonGroup(
        missingCols.map(function (c) { return { label: c, value: c }; }),
        { label: '어느 컬럼으로 확인할까', selected: missingCols.indexOf(st1.demoCol),
          onChange: function (v) { st1.demoCol = v; rebuildDemo(); } }
      ));
      box1.appendChild(demoBody);
      rebuildDemo();

      // 결측이 있는 행을 실제로 보여준다
      var missingPos = rowsWithAnyNA(t);
      box1.appendChild(UI.note(
        t.nrows() + '행 중 ' + missingPos.length + '행은 (' + t.columns.length + '개 컬럼 중) 어딘가 하나라도 비어 있다 ' +
        '— t.isna().any(axis=1) 에 해당한다.'
      ));
      box1.appendChild(UI.frameTable(
        t.cols(['PassengerId', 'Name', 'Age', 'Cabin', 'Embarked']).take(missingPos),
        { maxRows: 6, caption: '결측이 있는 행 (결측 칸은 자동으로 회색이다)' }
      ));

      root.appendChild(box1);

      // ───────────────────────────────── 시뮬레이터 ② 채우는 방법 비교기
      var box2 = UI.el('div.card');
      box2.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ② 채우는 방법 비교기' }));
      box2.appendChild(UI.note(
        'Age 결측 ' + ageMissing + '개를 0 / 평균 / 중앙값 / 최빈값으로 채워 보고, 분포와 평균이 ' +
        '어떻게 달라지는지 비교한다. 전부 그 자리에서 DF 엔진으로 계산한 값이다.'
      ));

      var beforeMean = age.mean(), beforeStd = age.std();
      var st2 = { method: 'mean' };
      var body2 = UI.el('div');

      var METHODS = [
        { label: '0', value: 'zero' },
        { label: '평균', value: 'mean' },
        { label: '중앙값', value: 'median' },
        { label: '최빈값', value: 'mode' }
      ];

      function fillValueFor(method) {
        if (method === 'zero') return 0;
        if (method === 'mean') return age.mean();
        if (method === 'median') return age.median();
        return modeValue(age);
      }

      function rebuild2() {
        UI.clear(body2);
        var fv = fillValueFor(st2.method);
        var filled = age.fillna(fv);
        var afterMean = filled.mean(), afterStd = filled.std();

        body2.appendChild(UI.table(
          [
            { key: 'item', label: '항목' },
            { key: 'before', label: '채우기 전' },
            { key: 'after', label: '채운 뒤' }
          ],
          [
            { item: '채운 값', before: '—', after: UI.fmt(fv, 4) },
            { item: '평균', before: UI.fmt(beforeMean, 4), after: UI.fmt(afterMean, 4) },
            { item: '표준편차', before: UI.fmt(beforeStd, 4), after: UI.fmt(afterStd, 4) },
            { item: '결측 수', before: ageMissing, after: filled.length() - filled.count() }
          ]
        ));

        body2.appendChild(UI.hist(age.toArray(), { title: '채우기 전 분포 (결측 제외)', bins: 20 }));
        body2.appendChild(UI.hist(filled.toArray(), {
          title: '채운 뒤 분포', bins: 20, color: 'var(--c-result)'
        }));

        if (st2.method === 'zero') {
          body2.appendChild(UI.danger(
            '평균이 크게 내려간다',
            '결측 ' + ageMissing + '개를 0으로 채우면 평균이 ' + UI.fmt(beforeMean, 2) + '세에서 ' +
            UI.fmt(afterMean, 2) + '세로 내려간다(차이 ' + UI.fmt(beforeMean - afterMean, 2) + '세). ' +
            '실제로는 나이를 몰라서 못 채운 ' + ageMissing + '명인데, 0으로 채우면 "이 사람들이 0살" ' +
            '이라고 우기는 셈이다.'
          ));
        }
      }

      box2.appendChild(UI.buttonGroup(METHODS, {
        label: '채우는 방법', selected: 1,
        onChange: function (v) { st2.method = v; rebuild2(); }
      }));
      box2.appendChild(body2);
      rebuild2();

      root.appendChild(box2);

      // ───────────────────────────────── 시뮬레이터 ③ fillna('0') 이 컬럼을 망친다
      var box3 = UI.el('div.card');
      box3.appendChild(UI.el('div.panel-title', { text: "시뮬레이터 ③ ★★ fillna('0') 이 컬럼을 망친다" }));
      box3.appendChild(UI.note(
        '실제로 이 상태로 저장되어 있던 강의용 노트북의 사고를 재현한다. 숫자 0 대신 따옴표를 친 ' +
        "문자열 '0' 을 채우면 무슨 일이 일어나는지 본다."
      ));

      var fillnaZero = age.fillna(0);
      var fillnaStr = age.fillna('0');

      box3.appendChild(UI.table(
        [{ key: 'expr', label: '표현식' }, { key: 'dtype', label: 'dtype' }],
        [
          { expr: 'Age (원본)', dtype: age.dtype },
          { expr: 'Age.fillna(0)', dtype: fillnaZero.dtype },

})();

/* ===== modules/ch09-dtype.js ===== */
/* ch09-dtype.js — 값 바꾸기와 타입 변환 (교재 9장)
 * IIFE 로 완전히 감싸 전역을 공유하지 않는다. render 는 여러 번 호출될 수 있으므로
 * 가변 상태는 전부 render 안의 지역 변수에 둔다(API.md §1 ②).
 */
(function () {
  'use strict';

  /* NaN 을 항상 false 로 다루는 비교. DF 엔진의 비교 연산자(gt/le 등)와 같은 규칙이다
   * ( isNA(lv) || isNA(rv) ? false : fn(lv, rv) — df.js 참고 ). 여러 단계 if/elif 가 필요한
   * 분류 함수라 Series.le/gt 하나로는 못 쓰고, 같은 규칙을 스칼라용으로 직접 구현한다. */
  function naSafeLE(v, x) { return DF.isNA(v) ? false : v <= x; }

  /* 교재 9.5절 get_category 의 "버그" 버전 — 결측을 먼저 걸러내지 않는다. */
  function categorizeBuggy(age) {
    if (naSafeLE(age, 5)) return 'Baby';
    if (naSafeLE(age, 12)) return 'Child';
    if (naSafeLE(age, 18)) return 'Teenager';
    if (naSafeLE(age, 25)) return 'Student';
    if (naSafeLE(age, 35)) return 'Young Adult';
    if (naSafeLE(age, 60)) return 'Adult';
    return 'Elderly';
  }
  /* 고친 버전 — 결측을 맨 앞에서 따로 처리한다. */
  function categorizeFixed(age) {
    if (DF.isNA(age)) return '결측';
    return categorizeBuggy(age);
  }

  var CAT_ORDER = ['Baby', 'Child', 'Teenager', 'Student', 'Young Adult', 'Adult', 'Elderly'];
  var CAT_ORDER_FIXED = CAT_ORDER.concat(['결측']);

  function countsInOrder(catSeries, order) {
    var vc = catSeries.valueCounts();
    var labels = vc.labels(), vals = vc.toArray();
    var map = {};
    labels.forEach(function (l, i) { map[l] = vals[i]; });
    return order.map(function (c) { return { label: c, value: map[c] || 0 }; });
  }

  Lab.register({
    id: 'ch09-dtype',
    num: 9,
    title: '값 바꾸기와 타입 변환',
    subtitle: 'replace · to_numeric · astype 이 dtype 을 어떻게 바꾸는지, 그리고 결측이 조건문을 속이는 법',

    render: function (root) {
      var t = LabData.frame('titanic');
      var ramen = LabData.frame('ramen');

      // ───────────────────────────────── 시뮬레이터 ① dtype 승격표
      var box1 = UI.el('div.card');
      box1.appendChild(UI.el('div.panel-title', { text: '시뮬레이터 ① dtype 승격표' }));
      box1.appendChild(UI.note(
        '값의 조합에 따라 dtype 이 어떻게 정해지는지 DF.inferDtype() 으로 그 자리에서 계산한다.'
      ));

      var PRESETS = [
        { label: '[1, 2, 3]', values: [1, 2, 3] },
        { label: '[1, 2.5]', values: [1, 2.5] },
        { label: '[1, null]', values: [1, null] },
        { label: "['a', 'b']", values: ['a', 'b'] },
        { label: "[1, 'a']", values: [1, 'a'] },
        { label: '[true, false]', values: [true, false] },
        { label: '[true, 1]', values: [true, 1] }
      ];
      box1.appendChild(UI.table(
        [{ key: 'label', label: '값 조합' }, { key: 'dtype', label: 'dtype (DF.inferDtype 계산)' }],
        PRESETS.map(function (p) { return { label: p.label, dtype: DF.inferDtype(p.values) }; })
      ));

      var strDtype = DF.inferDtype(['a', 'b']);
      box1.appendChild(UI.note(
        "['a','b'] 처럼 문자열만 있으면 dtype 은 object 가 아니라 " + strDtype +
        " 다(실제로 방금 계산한 값). pandas 3.0 부터 문자열 전용 dtype 이 생겼기 때문이다. " +
        "[1,'a'] 처럼 숫자와 문자열이 섞이면 그때는 " + DF.inferDtype([1, 'a']) + " 로 떨어진다.",
        '★ 정정표 — pandas 3.0 의 변화'
      ));

      // 학생이 직접 값을 추가/제거하며 dtype 이 바뀌는 것을 본다
      var st1 = { values: [], nextInt: 1, nextFloat: 1.5, nextChar: 97 /* 'a' */, nextBool: true };
      var body1 = UI.el('div');

      function rebuild1() {
        UI.clear(body1);
        body1.appendChild(UI.el('div.mono', {
          text: '값 목록: [' + st1.values.map(function (v) {

          }).join(', ') + ']'
        }));

          '현재 dtype = ' + (st1.values.length ? DF.inferDtype(st1.values) : '(값이 없다)')

      root.appendChild(box1);

      function rebuild2() {

        ));

      var coerceBtn = UI.el('button', {

      var MODES3 = [

      box4.appendChild(UI.note(

          ],
          { caption: '엔진의 비교 연산도 결측을 항상 False 로 다룬다' }
        ));
      }

      var actualOver60 = ages.gt(60).sum();
      var st4 = { fixed: false };
      var body4 = UI.el('div');

      function rebuild4() {
        UI.clear(body4);
        var order = st4.fixed ? CAT_ORDER_FIXED : CAT_ORDER;
        var cats = ages.apply(st4.fixed ? categorizeFixed : categorizeBuggy);

        body4.appendChild(UI.bar(items, {

        }));

        var catArr = cats.toArray();
        var isnaArr = ages.isna().toArray();
        var elderlyTotal = items.filter(function (it) { return it.label === 'Elderly'; })[0].value;

        if (!st4.fixed) {

            elderlyTotal + '명으로 줄었다 — 실제로 60살을 넘은 ' + actualOver60 + '명과 같다.'
          ));
        }
      }

      box4.appendChild(UI.buttonGroup(
        [{ label: '버그 버전 (else: Elderly)', value: 'buggy' }, { label: '수정 버전 (결측 먼저 분기)', value: 'fixed' }],
        { selected: 0, onChange: function (v) { st4.fixed = (v === 'fixed'); rebuild4(); } }
      ));
      box4.appendChild(body4);
      rebuild4();

      root.appendChild(box4);

      // ───────────────────────────────── 확인 문제
      root.appendChild(UI.quiz({
        title: '확인 문제 9-1',
        question: "pd.Series(['a', 'b']).dtype 는 무엇인가?",

          { label: 'str', correct: true,
            why: "실제로 DF.inferDtype(['a','b']) 를 계산하면 " + strDtype + " 가 나온다. pandas 3.0 의 " +
                 '변화다 — 문자열만 있으면 object 가 아니라 전용 str dtype 을 받는다.' },
          { label: 'int64', why: '틀렸다. 문자열 값에는 나올 수 없는 dtype 이다.' }
        ]
      }));

      root.appendChild(UI.quiz({
        title: '확인 문제 9-2',
        question:
          "Sex 컬럼(dtype " + sex.dtype + ")을 {male:0, female:1} 로 replace 하면 dtype 은 무엇이 되는가?",
        choices: [
          { label: sex.dtype, why: '틀렸다. 새로 들어온 값(정수)이 원래 dtype 과 다른 종류라 승격이 일어난다.' },
          { label: 'float64', why: '틀렸다. replace 는 값에서 dtype 을 다시 추론하지 않는다.' },
          { label: 'object', correct: true,
            why: '문자열(' + sex.dtype + ')과 정수를 동시에 담을 수 있는 dtype 은 object 뿐이다. ' +
                 '숫자를 넣었다고 곧바로 숫자형이 되지 않는다 — 진짜 숫자 dtype 이 필요하면 ' +
                 'to_numeric 을 이어서 써야 한다.' }
        ]
      }));

      root.appendChild(UI.quiz({
        title: '확인 문제 9-3',
        question:
          "get_category(age) 의 if/elif 사슬(끝에 else: 'Elderly')을 나이가 결측인 승객에게 적용하면 " +
          '어떤 카테고리로 분류되고, 왜 그런가?',
        choices: [
          { label: '에러가 난다', why: "틀렸다. NaN 과의 비교는 에러 없이 항상 False 를 돌려준다." },
          { label: "Baby 로 분류된다", why: '틀렸다. age <= 5 도 False 이므로 Baby 가 아니다.' },
          { label: "Elderly 로 분류된다", correct: true,
            why: 'NaN 은 <=, > 등 모든 비교에서 False 다. 그래서 if/elif 의 모든 조건을 다 통과하지 ' +
                 '못하고 마지막 else: cat = \'Elderly\' 로 떨어진다. 결측을 나이가 아주 많은 사람으로 ' +
                 '잘못 분류한 것이다. 함수 맨 앞에 결측을 먼저 처리하는 분기를 추가해야 막을 수 있다.' }
        ]
      }));
    }
  });
})();

/* ===== modules/ch10-agg.js ===== */
/* ch10-agg.js — 10장. 정렬과 집계
 *
 * 교재 10장(pandas.md 3927~4279줄)의 짝.
 * sort_values 로 순서를 바꾸되 인덱스는 값을 따라간다는 것, count/sum/mean/std 같은 집계
 * 함수가 결측을 어떻게 다루는지, describe() 의 8줄이 각각 무엇인지, 문자열 컬럼이 섞이면
 * corr() 이 죽는다는 것을 실행으로 보여준다. 이 파일이 화면에 내는 숫자는 전부 DF 엔진이
 * LabData.frame('titanic') 을 그 자리에서 계산한 값이다 — 손으로 적은 숫자는 없다.
 *
 * ES 모듈 문법 금지 — 단일 파일 배포본에 인라인되므로 깨진다. IIFE 로 감싼다.
 */
(function () {
  'use strict';

  var SORT_COLS = [
    { label: '나이 (Age, 결측 있음)', value: 'Age' },
    { label: '선착장 (Embarked, 결측 있음)', value: 'Embarked' },
    { label: '요금 (Fare)', value: 'Fare' },
    { label: '좌석 등급 (Pclass)', value: 'Pclass' },
    { label: '이름 (Name)', value: 'Name' }
  ];

  var AGG_COLS = [
    { label: '나이 (Age)', value: 'Age' },
    { label: '요금 (Fare)', value: 'Fare' },
    { label: '좌석 등급 (Pclass)', value: 'Pclass' },
    { label: '형제자매/배우자 수 (SibSp)', value: 'SibSp' },
    { label: '부모/자녀 수 (Parch)', value: 'Parch' }
  ];

  var CORR_COLS = [
    { label: '좌석 등급 (Pclass)', value: 'Pclass' },
    { label: '나이 (Age)', value: 'Age' },
    { label: '형제자매/배우자 수 (SibSp)', value: 'SibSp' },
    { label: '부모/자녀 수 (Parch)', value: 'Parch' },
    { label: '요금 (Fare)', value: 'Fare' },
